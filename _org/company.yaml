# company.yaml — ORGANIZATION-level profile for the mifos-x (openMF / Mifos Initiative) workspace.
# Org-level release identity + deploy defaults shared by EVERY mifos-x product (group-banking,
# mobile-wallet, backoffice, …). Project-specific content lives in each project's source; THIS is org-level.
schema_version: 1
scope: organization
workspace: mifos-x

# ── ORG IDENTITY (workspace-scoped SoT, RULE-WORKSPACE-ORG-IDENTITY-001) ──────────────────────────
# Single source of truth for this workspace's release identity. HARD RULE: PUBLIC IDENTIFIERS + a vault
# NAME pointer ONLY — NO secret VALUES ever live in _org/** (committed plaintext). Keys/tokens/certs stay
# in the vault, referenced by alias. Unlike mbs, mifos-x IS the canonical openMF/Mifos identity (the
# kmp-project-template's built-in identity is CORRECT for this workspace).
org_identity:
  apple_team_id: "L432S2FZP5"                                        # The Mifos Initiative Apple Developer team
  apple_match_git_url: "git@github.com:openMF/ios-provisioning-profile.git"
  apple_match_git_branch: "master"
  app_id_base: "org.mifos"                                           # fork appId prefix (per-app suffix appended)
  vendor: "The Mifos Initiative"                                     # desktop packaging vendor + copyright holder
  copyright: "© 2026 The Mifos Initiative. All rights reserved."
  mac_app_category_default: "public.app-category.finance"            # per-app override allowed
  firebase_android_testers_group: "mifos-mobile-apps"               # org-level Firebase App Distribution tester group (a group NAME, not a secret)
  apple_testflight_internal_group: "mifos-mobile-apps"               # iOS TestFlight INTERNAL group (team; reaches every build, no Apple review) — a group NAME
  apple_testflight_testers_group:  "mifos-mobile-apps"               # iOS TestFlight EXTERNAL group (public self-join; Apple beta review) — a group NAME
  # Org-wide TestFlight external tester roster — every mifos-x app's beta reaches these (emails are
  # PUBLIC identifiers, not secrets). deploy-testers-roster-sync.sh materializes it into each app-profile.
  apple_testflight_tester_emails:
    - rajanmaurya154@gmail.com
    - edcable@gmail.com
    - skniyajali0@gmail.com
  vault: "mifos-x"                                                   # → SECRETS_VAULTS_REGISTRY.yaml (NAME only, not a secret)
  # NO secret values here — resolve keys/tokens/certs via `/secrets get <alias>` from the mifos-x vault.

# ── REPOSITORY COMMUNITY FILES ────────────────────────────────────────────────────────────────────
# CODE_OF_CONDUCT.md · CONTRIBUTING.md · LICENSE · SECURITY.md · .github/workflows/cla-check.yml in every mifos-x repo. The Mifos devops
# and security teams set them up per repository, so agents never edit them here (enforced by
# .claude-runtime/scripts/hooks/template-owned-edit-guard.sh). A template sync never writes them either.
# Per file: { access: read | write, writers: [github-login, …] } — overrides each repo's app.yaml entry.
repo_files:
  CODE_OF_CONDUCT.md: { access: read }
  CONTRIBUTING.md:    { access: read }
  LICENSE:            { access: read }
  SECURITY.md:        { access: read }
  .github/workflows/cla-check.yml: { access: read }   # the org CLA bot pushes it

name: "The Mifos Initiative"
short: "Mifos"
contact_email: "team@mifos.org"
location: "USA"

# App Store / Play Console REVIEW + trade-representative contact — ORG-LEVEL DEFAULT for /idea-deploy.
# A project's DEPLOYMENT_PROJECT_CONFIG.yaml#contact overrides per-field. `phone` MUST be `+<countrycode>`
# (Apple rejects contactPhone / external beta review otherwise).
deploy_contact:
  first_name: "Mifos"
  last_name: "Team"
  email: "team@mifos.org"
  phone: "+919015090523"        # E.164, +91 India — Apple contactPhone / external beta review format
  country: "India"
  country_code: "+91"

# Product portfolio — maintained by /idea-site STEP 1.ORG (keyed by slug; rendered on /company + footer).
apps:
  - slug: "kmp-project-template"
    name: "Money Toolkit"
    tagline: "Private, offline-first money utilities — on every platform"
    domain: "kmp-project-template.pages.dev"
    url: "https://kmp-project-template.pages.dev"
    platforms: ["android", "ios", "macos", "desktop", "web"]
    status: "open-source"
    accent: "#6C63FF"
