# secrets-manifest.yaml — RULE-SECRETS-LAYOUT-001 schema v3.0 (alias-only, SL5)
#
# Pure alias list — no secret VALUES, no (env-var:secret-id) pairs. Every alias
# resolves via SECRETS_ALIAS_REGISTRY.yaml v2.0 and materializes with
# `/secrets pull` (or core/scripts/secrets-resolve-path.sh <alias> for a single
# read). Real values live ONLY in the vault.
#
# NOTE (2026-08-21): the pre-sync fork had a `secrets.env` checked into git
# history with real (non-placeholder) keystore passwords — a separate, serious
# finding the user is handling directly (rotation + history purge), NOT part of
# this migration. This manifest does not move, read, or reference that file's
# content; it declares the CANONICAL target layout every alias below migrates
# TO once the user's rotation completes.
schema_version: "3.0"
project: mifos-x/mifos-x-field-officer-app
# Required by secrets-sync-orchestrate.sh, which refuses to run without it
# ("no default_vault in …"). Every sibling manifest declares one; this file was
# authored without it, so the auto-sync that follows every `/secrets handoff`
# (SV41, mandatory) failed for this project — the value reached the vault and
# the destinations were silently left stale. Found 2026-10-02 pushing
# `mifos-x-stitch-api-key-a7`.
default_vault: mifos-x
needs:
  - alias: android-keystore-mifos-x-field-officer-app
  - alias: android-keystore-props-mifos-x-field-officer-app
  - alias: firebase-config-android-mifos-x-field-officer-app
  - alias: play-store-sa-openmf
  - alias: app-store-connect-p8-openmf
  - alias: firebase-config-ios-mifos-x-field-officer-app
  # Stitch pool slot a7 — this project's design-generation key (operator-confirmed 2026-10-02).
  # Declared here because the account was created FOR this app's Stitch work, so the vault row's
  # `used_by: mifos-x/mifos-x-field-officer-app` is accurate rather than an artifact of whichever
  # project happened to be bound at push time. Resolved at runtime by
  # .claude-runtime/scripts/stitch-account-resolve.ts via assignments[mifos-x/mifos-x-field-officer-app].
  - alias: mifos-x-stitch-api-key-a7
