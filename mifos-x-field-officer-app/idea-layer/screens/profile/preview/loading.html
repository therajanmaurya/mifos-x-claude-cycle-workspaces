* { box-sizing: border-box; }
html, body { margin: 0; }
body { width: 100%; min-height: 100vh; background: var(--color-background); color: var(--color-on-surface); font-family: var(--font-family); -webkit-font-smoothing: antialiased; }
.appbar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: var(--space-xs); height: 64px; padding: 0 var(--space-xs); background: var(--color-background); }

.shimmer { display: block; border-radius: 6px; background: linear-gradient(90deg, var(--color-shimmer-a) 0%, var(--color-shimmer-b) 50%, var(--color-shimmer-a) 100%); background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; }
.sh-name { height: 28px; width: 70%; }
.sh-email { height: 14px; width: 55%; }
.sh-value { height: 16px; width: 40%; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .shimmer { animation: none; } }
.section-title { margin: 0 0 var(--space-sm); font-size: 14px; font-weight: 500; color: var(--color-on-surface-variant); }
.card { background: var(--color-surface); border: 1px solid var(--color-outline-variant); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); overflow: hidden; }
.row { display: flex; align-items: center; gap: var(--space-lg); min-height: 56px; padding: var(--space-sm) var(--space-lg); }
.row + .row { border-top: 1px solid var(--color-divider); }
.row svg { flex: none; color: var(--color-on-surface-variant); }
.row-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.label { font-size: 12px; color: var(--color-on-surface-variant); }
.value { font-size: 16px; overflow-wrap: anywhere; }
.mono { font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: var(--space-sm); padding: var(--space-md) var(--space-lg); }
.chip { display: inline-flex; align-items: center; gap: var(--space-sm); height: 32px; padding: 0 var(--space-md); border: 1px solid var(--color-outline); border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; }
.chip svg { color: var(--color-primary); }
@media (min-width: 600px) {

}
@media (min-width: 840px) {

}
</style>
