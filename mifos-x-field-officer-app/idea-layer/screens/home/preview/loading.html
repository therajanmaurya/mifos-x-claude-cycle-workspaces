<!doctype html>

<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home: MifosXDroid</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<style>
:root{
  --primary:#4338CA;--on-primary:#FFFFFF;--primary-container:#E0E7FF;--on-primary-container:#1F1D75;
  --surface-variant:#E2E8F0;
  --bg:#FAFAFB;--surface:#FAFAFB;--surface-container:#FFFFFF;
  --fg:#0F172A;--fg-muted:#475569;--outline:#94A3B8;--border:#CBD5E1;
  --shimmer-a:#E2E8F0;--shimmer-b:#F1F5F9;
  --font-sans:"Outfit",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Outfit",ui-sans-serif,system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --font-icon:"Material Symbols Outlined";
  --fs-xs:12px;--fs-sm:14px;--fs-md:16px;--fs-lg:18px;--fs-xl:22px;--fs-2xl:28px;--fs-3xl:36px;
  --fw-regular:400;--fw-medium:500;--fw-semibold:600;
  --lh-icon:1;--lh-tight:1.15;--lh-body:1.45;
  --sp-0:0;--sp-xs:4px;--sp-sm:8px;--sp-md:12px;--sp-lg:16px;--sp-xl:24px;--sp-xxl:32px;--sp-xxxl:48px;
  --touch:48px;--icon:24px;--icon-sm:20px;--avatar:40px;--bar:64px;--nav:72px;--meter:8px;
  --sk-line:12px;--sk-title:18px;--sk-big:40px;--sk-tile:64px;--sk-kpi:60px;
  --w-25:25%;--w-40:40%;--w-55:55%;--w-70:70%;--w-90:90%;
  --r-sm:8px;--r-md:12px;--r-lg:20px;--r-full:999px;
  --el-0:none;
  --el-1:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.08);
  --el-2:0 2px 4px rgba(15,23,42,.06),0 6px 16px rgba(15,23,42,.08);
  --el-3:0 8px 24px rgba(15,23,42,.14);
  --hairline:1px;--focus:2px;--track-tight:-0.01em;
  --content-max:1200px;--dur:1400ms;
}
:root[data-theme="dark"]{
  --primary:#A5B4FC;--on-primary:#1E1B4B;--primary-container:#312E81;--on-primary-container:#E0E7FF;
  --surface-variant:#334155;
  --bg:#0B1120;--surface:#0F172A;--surface-container:#1E293B;
  --fg:#F1F5F9;--fg-muted:#CBD5E1;--outline:#64748B;--border:#334155;
  --shimmer-a:#1E293B;--shimmer-b:#334155;
  --el-1:0 1px 2px rgba(0,0,0,.4);--el-2:0 4px 12px rgba(0,0,0,.45);--el-3:0 10px 28px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%}
body{display:flex;flex-direction:column;min-height:100vh;background:var(--bg);color:var(--fg);font-family:var(--font-sans);font-size:var(--fs-md);line-height:var(--lh-body);-webkit-font-smoothing:antialiased}
.ms{font-family:var(--font-icon);font-weight:var(--fw-regular);font-style:normal;font-size:var(--icon);line-height:var(--lh-icon);display:inline-block;font-feature-settings:"liga"}
.shell{display:flex;flex-direction:column;min-height:100vh;width:100%}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:center;height:var(--bar);padding:0 var(--sp-lg);background:var(--surface);box-shadow:var(--el-1)}
.topbar h1{margin:0;font-size:var(--fs-lg);font-weight:var(--fw-semibold)}
.topbar .trail{position:absolute;right:var(--sp-sm)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;min-width:var(--touch);min-height:var(--touch);border:0;border-radius:var(--r-full);background:transparent;color:var(--fg-muted);cursor:pointer}
.iconbtn:focus-visible,.bnav a:focus-visible{outline:var(--focus) solid var(--primary);outline-offset:var(--focus)}
main{flex:1;display:flex;flex-direction:column;width:100%}
.page{width:100%;max-width:var(--content-max);margin:0 auto;padding:var(--sp-lg) var(--sp-lg) var(--sp-xxl)}
.hello{margin-bottom:var(--sp-xl)}
.hello h2{margin:0;font-family:var(--font-display);font-size:var(--fs-2xl);font-weight:var(--fw-semibold);line-height:var(--lh-tight);letter-spacing:var(--track-tight)}
.hello p{margin:var(--sp-xs) 0 var(--sp-sm);color:var(--fg-muted);font-size:var(--fs-sm)}
.chip{display:inline-flex;align-items:center;gap:var(--sp-xs);padding:var(--sp-xs) var(--sp-md);border-radius:var(--r-full);background:var(--primary-container);color:var(--on-primary-container);font-size:var(--fs-xs);font-weight:var(--fw-medium)}
.chip .ms{font-size:var(--icon-sm)}
.caption{margin:0 0 var(--sp-lg);color:var(--fg-muted);font-size:var(--fs-sm)}
.cols{display:grid;grid-template-columns:1fr;gap:var(--sp-lg)}
.col{display:flex;flex-direction:column;gap:var(--sp-lg);min-width:0}
.card{background:var(--surface-container);border-radius:var(--r-lg);box-shadow:var(--el-1);padding:var(--sp-lg);display:flex;flex-direction:column;gap:var(--sp-md)}
.card.hero{box-shadow:var(--el-2);padding:var(--sp-xl) var(--sp-lg)}
.sk{display:block;height:var(--sk-line);border-radius:var(--r-sm);background:linear-gradient(90deg,var(--shimmer-a) 25%,var(--shimmer-b) 50%,var(--shimmer-a) 75%);background-size:200% 100%;animation:shimmer var(--dur) ease-in-out infinite}
.sk.title{height:var(--sk-title);width:var(--w-40)}
.sk.sub{width:var(--w-90)}
.sk.big{height:var(--sk-big);width:var(--w-55)}
.sk.meter{height:var(--meter);border-radius:var(--r-full)}
.sk.btn{height:var(--touch);border-radius:var(--r-full)}
.sk.kpi{height:var(--sk-kpi);border-radius:var(--r-md)}
.sk.tile{height:var(--sk-tile);border-radius:var(--r-md)}
.sk.tile.wide{grid-column:1 / -1}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-sm)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-sm)}
.qgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-sm)}
.qcell{display:flex;flex-direction:column;align-items:center;gap:var(--sp-sm);padding:var(--sp-md) var(--sp-xs)}
.qcell .dot{width:var(--touch);height:var(--touch);border-radius:var(--r-full)}
.qcell .lbl{width:var(--w-70)}
.srow{display:flex;align-items:center;gap:var(--sp-md);min-height:var(--touch);padding:var(--sp-sm) var(--sp-xs)}
.srow+.srow{border-top:var(--hairline) solid var(--surface-variant)}
.srow .lead{width:var(--avatar);height:var(--avatar);border-radius:var(--r-md);flex:none}
.srow .lines{flex:1;display:flex;flex-direction:column;gap:var(--sp-xs)}
.srow .lines .sk:first-child{width:var(--w-70)}
.srow .lines .sk:last-child{width:var(--w-40)}
.srow .pill{width:var(--sp-xxl);height:var(--sk-title);border-radius:var(--r-full);flex:none}
.bnav{position:sticky;bottom:0;margin-top:auto;z-index:5;display:flex;justify-content:center;background:var(--surface-container);box-shadow:var(--el-3)}
.bnav .items{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:var(--content-max)}
.bnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-xs);min-height:var(--nav);color:var(--fg-muted);font-size:var(--fs-xs);text-decoration:none;cursor:pointer}
.bnav a .ms{padding:var(--sp-xs) var(--sp-lg);border-radius:var(--r-full)}
.bnav a[data-nav-selected="true"]{color:var(--on-primary-container);font-weight:var(--fw-semibold)}
.bnav a[data-nav-selected="true"] .ms{background:var(--primary-container)}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* RULE-MOCKUP-RESPONSIVE-001: compact under 600 single column; medium 600-840 two columns; expanded 840+ two columns in a 1200 container */
@media (min-width:600px){
  .page{padding:var(--sp-xl)}
  .cols{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .hello h2{font-size:var(--fs-3xl)}
}
@media (min-width:840px){
  .page{padding:var(--sp-xxl) var(--sp-xxl) var(--sp-xxxl)}
  .cols{grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:var(--sp-xl)}
  .col{gap:var(--sp-xl)}
}
</style>
</head>
