schema_version: '3.1'
id: onboarding
name: Onboarding
description: >
  First-run onboarding, shown ONCE on a fresh install before sign-in. Three short intro pages say what the app is for —
  managing clients, groups and centres in the field; collecting repayments and running collection sheets; working
  offline and syncing later — and a final privacy page asks, with both switches OFF, whether to share usage analytics
  and send crash reports. Two equally visible buttons finish it: "Allow and get started" turns both on and saves them;
  "Continue without sharing" / "Continue with my choices" saves the switches exactly as shown. Either one marks
  onboarding done (last) and opens sign-in; it never shows again on that device. An agreement line in the privacy
  content — "By using our service you accept our Terms & Conditions and Privacy Policy." — links both in-app. Skip on
  the intro pages jumps to the privacy page, so consent is never skipped silently. On every page the dots and the
  primary action(s) sit in a fixed bottom bar, only the content above scrolls, and page content moves with the
  shared-axis-X transition; a 32dp Mifos X mark sits at the top start of every page.
feature: onboarding
flow: authentication
version: '1.0'
tags:
  - first-run
  - privacy
  - consent
  - P1
status: approved
approve_hash: "sha256:b3304ec2d9eee2e1519d519cd05f9e4059811e0bfb77dd2176b852091a01222d"
approve_hash_method: approve-hash.sh/v1
approved_at: '2026-11-05T06:55:00Z'
approved_by: /idea-approve
