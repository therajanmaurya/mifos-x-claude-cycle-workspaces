# ──────────────── NAVIGATION ────────────────
entry_point: false
bottom_nav: false
navigates_to: [signin]

route:
  name: ServerConfigRoute
  original_name: UpdateServerConfig
  params: {}

entry_points:
  - source: signin
    action: "server_config_cta.on_click"
    params: {}
    note: "the pre-authentication path — this is why the route sits on the ROOT graph, not the authenticated one"
  - source: rootNav
    action: "RootNavScreen updateServerConfig binding"
    params: {}
  - source: settings
    action: "settings list item"
    params: {}
    status: not_yet_ported
    note: "the authenticated entry arrives with the rest of settings in S7"

screens:
  - id: serverConfig
    name: ServerConfigScreen
    viewmodel: ServerConfigViewModel

# ──────────────── PORT DEVIATIONS ────────────────
port_deviations:
  - id: error-surface
    original: "five StateFlow<String?> error streams, one per field, each built from snapshotFlow{}.mapLatest{validator.validateX(it).message}"
    shipped: "one Map<ServerConfigField, ValidationFailure> derived from state"
    why: >
      The message arrived PRE-LOCALIZED out of the domain layer, which is what forced Compose
      string resources into core/domain. Typed failures let the screen do the mapping, which is
      where string resources belong (spec §2).
  - id: submit-validation
    original: "validated reactively only — nothing stopped UpdateServerConfig dispatching while a field was invalid"
    shipped: "validation runs on SUBMIT as well as per keystroke; invalid submit is refused and re-publishes the failures"
    why: "the original wrote whatever was in the fields"
  - id: use-localhost
    original: "absent"
    shipped: "added — ServerConfig.LOCALHOST already existed in the substrate"
    why: "a developer target that the substrate modelled but no screen exposed"
  - id: save-confirmation
    original: "popped back with no confirmation — a successful save looked identical to a dismissed screen"
    shipped: "snackbar, then navigate back"
    why: "the user could not tell whether the change took"

# ──────────────── EXTRACTION FINDING ────────────────
source_findings:
  tenant_regex:
    original: "^[a-zA-Z0-9]+$"
    shipped: "^[a-zA-Z0-9_-]+$"
    why: >
      DELIBERATE WIDENING. The app's own shipped default tenant is `mifos-bank-1`, which the
      original's own regex REJECTS — so the app could not save the configuration it ships with.
      Found while porting; recorded here rather than silently inherited.
