schema_version: "3.1"
id: serverConfig
name: Server configuration
description: >
  Edits the Fineract instance this app talks to — protocol, host, API path, port, tenant. Reachable
  BEFORE authentication, because a first-run user whose instance differs from the shipped default
  has no other way to correct it and therefore cannot sign in at all.
feature: serverConfig
flow: entry
version: "1.0"
tags: [mvp, core, P0, entry, settings]

# ──────────────── MODULE PIN (RULE-KMP-FEATURE-MODULE-PATH-001) ────────────────
# The idea-layer feature is `serverConfig`; it lives inside the `feature/settings` Kotlin module
# alongside the rest of settings. Unpinned, codegen would resolve `serverConfig` →
# `feature/serverConfig` and scaffold a module that should not exist.
module_path: feature/settings

# ──────────────── PROVENANCE ────────────────
provenance:
  imported_from: "6b66e8a43"
  imported_at: "2026-10-02"
  imported_by: "/idea-feature-import"
  extraction: complete
  source_files:
    - feature/settings/src/commonMain/kotlin/com/mifos/feature/settings/updateServer/UpdateServerConfigScreen.kt
    - feature/settings/src/commonMain/kotlin/com/mifos/feature/settings/updateServer/UpdateServerConfigViewModel.kt
    - feature/settings/src/commonMain/kotlin/com/mifos/feature/settings/updateServer/UpdateServerConfigEvent.kt
    - feature/settings/src/commonMain/kotlin/com/mifos/feature/settings/navigation/SettingsNavigation.kt   # registering graph
    - cmp-navigation/src/commonMain/kotlin/cmp/navigation/rootnav/RootNavScreen.kt                          # second entry point
  also_reflects_port:
    ref: "working-tree"
    reason: >
      Hand-ported in S1/S3 and device-verified 2026-10-02 (all five fields, Use defaults, Save
      rendered and functional on a physical device). Per spec §7.4 an audited port is not
      regenerated; differences are recorded under port_deviations.
    files:
      - feature/settings/src/commonMain/kotlin/kpt/feature/settings/serverconfig/ServerConfigScreen.kt
      - feature/settings/src/commonMain/kotlin/kpt/feature/settings/serverconfig/ServerConfigViewModel.kt
      - feature/settings/src/commonMain/kotlin/kpt/feature/settings/serverconfig/ServerConfigRoute.kt

