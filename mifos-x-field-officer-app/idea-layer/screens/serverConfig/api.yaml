# serverConfig — API contract. IMPORTED from source 2026-10-02.
# This screen makes NO network calls. That is the whole point of recording it: a reader who assumes
# "server configuration" implies a connectivity test would be wrong, and the absence is deliberate.

schema_version: "3.1"
feature: serverConfig

endpoints: []    # none — see local_writes

# ──────────────── LOCAL WRITES ────────────────
local_writes:
  - id: updateServerConfig
    target: "ProjectPreferencesRepository.updateServerConfig(ServerConfig)"
    store: plainSettings
    key: "fineract.server_config"
    policy: local_only
    policy_why: >
      Device state, not server state. There is no server to agree with — this IS the setting that
      decides which server exists. No MutationGateway, no offline queue, no conflict.
    payload:
      protocol: string
      endPoint: string
      apiPath: string
      port: string
      tenant: string

# ──────────────── WHAT IT CONFIGURES (and currently does not) ────────────────
configures:
  intended_consumer: "the Fineract HTTP client's base URL + tenant header"
  actual_consumer: null
  status: NOT_WIRED
  detail: >
    The saved ServerConfig is read back by this screen and by ProjectPreferencesRepository.instanceUrl,
    but NOT by the HTTP client. Requests resolve against AppAccessPoints — generated at build time
    from app-profile/app.yaml#network.access_points — so protocol/host/port/path/tenant on the wire
    come from the build, not from this screen.
  evidence: >
    Measured 2026-10-01: the shipped access point declared base_path `fineract-provider/api/v1/`
    and tenant `default`, while ServerConfig.DEFAULT declared `/1.0/field/v1/` and `mifos-bank-1`.
    Sign-in 404'd until the ACCESS POINT was corrected; changing the screen would have done nothing.
  required_to_wire:
    - "a DynamicUrlConfigProvider backed by the saved ServerConfig"
    - "the tenant declared `runtime:` in app-profile so AuthHeaderBridge-style resolution applies"
    - "ktorfitFor threading a provider through — a core-base/network change (upstream)"

# ──────────────── READS ────────────────
reads:
  - id: current_config
    source: "ProjectPreferencesRepository.serverConfig"
    shape: ServerConfig
    note: "seeds the form; falls back to ServerConfig.DEFAULT when nothing is stored"

defaults:
  DEFAULT:
    protocol: "https://"
    endPoint: "apis.mifos.community"
    apiPath: "/1.0/field/v1/"
    port: "443"
    tenant: "mifos-bank-1"
    note: "must stay equal to the `mifos` access point — a user who repairs their settings with Use defaults must land on a working server"
  LOCALHOST:
    protocol: "http://"
    endPoint: "localhost"
    apiPath: "/fineract-provider/api/v1/"
    port: "8080"
    tenant: "default"
