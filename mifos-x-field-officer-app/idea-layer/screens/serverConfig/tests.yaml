# serverConfig — test contract. IMPORTED from source 2026-10-02.

schema_version: "3.1"
feature: serverConfig

existing:
  file: feature/settings/src/commonTest/kotlin/kpt/feature/settings/serverconfig/ServerConfigViewModelTest.kt
  status: passing
  note: >
    Part of the 22 tests in feature/settings. The suite exists because the port made validation a
    pure function over state; the original's five snapshotFlow-derived error streams had no
    combined view to assert against.

state_coverage:
  - state: editing
    covered: true
  - state: field_invalid
    covered: true
    scenarios:
      - "port outside 1..65535 → PortOutOfRange on the port field only"
      - "apiPath without a leading slash → ApiPathMissingLeadingSlash"
      - "tenant `mifos-bank-1` is VALID — the original's regex rejected it"
  - state: saved
    covered: true
    scenarios:
      - "valid submit persists and emits Saved"
      - "invalid submit does NOT persist and re-publishes failures"

proposed:
  - id: use-defaults-clears-errors
    priority: P2
    why: "DEFAULT is valid by construction, so restoring it must clear every field error — asserted nowhere"
  - id: defaults-match-the-access-point
    priority: P1
    why: >
      ServerConfig.DEFAULT and the `mifos` access point must agree. They did NOT on 2026-10-01
      (`/1.0/field/v1/` vs `fineract-provider/api/v1/`), and sign-in 404'd until the access point
      was corrected. A test pinning the two together would have caught it before the device did.
    shape: "assert ServerConfig.DEFAULT.{endPoint,apiPath,port,tenant} == AppAccessPoints mifos point"

# ──────────────── NOT TESTABLE AT THIS LAYER ────────────────
untestable_here:
  - id: config-reaches-the-client
    why: >
      The screen's central promise — that editing these fields changes where the app talks — is
      currently false, and no unit test on this ViewModel can detect that: the ViewModel's job
      (validate, persist) works correctly. It needs an integration assertion that a saved config
      changes the request URL, which cannot pass until the wiring exists (api.yaml#configures).
    severity: high

device:
  status: maestro-not-authored
  last_manual_verification: >
    2026-10-02 — all five fields, Use defaults and Save rendered and functioned on a physical
    device; Use defaults correctly restored apis.mifos.community + /1.0/field/v1/ after the fields
    had been corrupted.
  gap: "hand-driven uiautomator, not an executed Maestro flow (spec AC14)"
