# ──────────────── STATE COVERAGE ────────────────
state_coverage:
  - state: empty
    covered: true
    device_verified: '2026-10-05'
    scenarios:
      - "logo, title, submit, instance chip all present; no error affordance; no overlay"
      - "biometric action ABSENT — no stored session to unlock into"
      - "signin:consent reads exactly 'By signing in you accept our Terms & Conditions and Privacy Policy.' pinned in the bottom bar (2026-11-05)"

  - state: validation_error
    covered: true
    device_verified: '2026-10-03'
    scenarios:
      - "username shorter than 4 → username error AND zero network calls"
      - "password shorter than 6 → password error"
      - "the offending field only — the clean field keeps its toggle and stays unmarked"
      - "an invalid password is STILL MASKED (regression lock, see migration_defects)"

  - state: submitting
    covered: true
    device_verified: '2026-10-03'
    scenarios:
      - "a MODAL overlay covers the form; submit disabled"
      - "the instance chip stays ENABLED — a hung sign-in is when the way out matters most"

  - state: transport_error
    covered: true
    device_verified: '2026-10-05'
    scenarios:
      - "200 with authenticated == false → rejected, NOT treated as success"

  - state: offline
    covered: true
    device_verified: false
    device_note: "rests on unit tests; not exercised on a device (would need a controlled network drop)"
    scenarios:
      - "MutationResult.Blocked(OFFLINE) → SignInError.Offline, distinct from a rejected credential"

  - state: locked_out
    covered: true
    status: new_in_v2
    device_verified: '2026-10-05'
    scenarios:
      - "warn branch at 3 failures: `2 attempts remaining before sign-in is paused.`"
      - "locked branch at 5: submit DISABLED, instance chip still ENABLED"
      - "biometric action WITHDRAWN while locked — the throttle is on signing in, not on one path"
      - "a local validation failure does NOT advance the counter"
      - "a success RESETS the counter to zero"

  - state: biometric_ready
    covered: true
    status: new_in_v2
    device_verified: false
    device_verdict: pending-device-verify
    device_blocker: >
      Needs sign-in shown WITH a stored session (root state `UserLocked`), which this app cannot
      currently reach — see docs.yaml#pending_device_verify and flow.yaml#inbound_routes.
    scenarios:
      - "absent with no stored session"
      - "absent with a stored session on hardware that cannot perform the check"
      - "present for a returning officer with both"
      - "withdrawn on lockout"
      - "hasStoredSession follows the stored credential, and a successful sign-in sets it"

  - state: success
    covered: true
    device_verified: '2026-10-05'
    scenarios:
      - "persists the user record and emits LoggedIn"
      - "stores the RAW credential, not a pre-formatted header"
      - "does NOT persist the raw password (closed 2026-10-02)"
      - "signing in after a sign-out reaches authenticated AND unlocked"
      - "live sign-in against apis.mifos.community reached the authenticated shell"

# ──────────────── CONSENT LINKS (2026-11-05) ────────────────
# The two spans are LinkAnnotation inside ONE Text tagged signin:consent; spans carry no testTag,
# so each is found and tapped by its TEXT.
scenarios:
  - id: empty_consent_open_terms_in_app
    preconditions: ["sign-in shown (any state with the consent line)"]
    actions: ["tap the text 'Terms & Conditions' inside signin:consent"]
    assertions:
      - "https://mifos-products.pages.dev/mobile/field-officer/terms/ (AppOrgLinks[\"terms\"]) opens IN-APP via LocalUrlLauncher.launchInApp (Custom Tabs / SFSafariViewController), titled 'Terms & Conditions — Field Officer App'"
      - "closing it returns to sign-in with the username and password fields unchanged"
      - "no SignInViewModel action fires (screen-level effect)"
    priority: medium
  - id: empty_consent_open_privacy_policy_in_app
    preconditions: ["sign-in shown (any state with the consent line)"]
    actions: ["tap the text 'Privacy Policy' inside signin:consent"]
    assertions:
      - "https://mifos-products.pages.dev/mobile/field-officer/privacy/ (AppPrivacyConfig.PRIVACY_POLICY_URL) opens IN-APP via LocalUrlLauncher.launchInApp"
      - "closing it returns to sign-in with both fields unchanged"
      - "no SignInViewModel action fires (screen-level effect)"
    priority: medium

# ──────────────── WHAT THE TESTS CAUGHT ────────────────
# Recorded because the value of a test is demonstrated by a failure it produced, not by its presence.
caught_by_tests:
  - defect: instance-chip-hidden-when-host-blank
    caught_by: SignInScreenUiTest.theEmptyStateShowsEverythingAFirstRunUserNeeds
    at: '2026-10-05'
    why_the_device_missed_it: >
      `ServerConfig.DEFAULT` is never blank, so the guarded branch never fired on a real device. Only
      a test that constructs the default `SignInState()` reaches the first-run case.
    fixed_how: "at the source — render unconditionally, label the blank host — not by relaxing the assertion"

  - defect: password-unmasked-when-toggle-hidden
    caught_by: SignInScreenUiTest.anInvalidPasswordIsStillMasked
    at: '2026-10-03'
    proven_red_first: true
    why_units_missed_it: "the state value is identical either way; only the rendering differs"

# ──────────────── PROPOSED ────────────────
proposed:
  - id: non-2xx-is-not-empty-success
    priority: P1
    status: open
    why: >
      The client does not set expectSuccess, so a non-2xx body deserializes onto DTO defaults. On
      THIS screen the explicit authenticated-flag check masks it; a test would pin that the mask is
      deliberate rather than accidental.

  - id: fields-survive-a-failed-attempt
    priority: P2
    status: open
    why: "retyping a password after a 502 is exactly what the port's Snackbar design avoids"
    note: "observed true on device 2026-10-05 across five consecutive failures, but not pinned by a test"

  - id: biometric-success-reaffirms-the-session
    priority: P1
    status: blocked
    added_at: '2026-10-05'
    why: >
      The unlock path's `updateFineractUser(stored.copy(isAuthenticated = true))` is what also sets
      `isUnlocked`; omitting it would reproduce the 2026-10-02 bounce. Nothing currently pins it.
    blocked_by: >
      `BiometricAuthenticator` is a final expect class with no interface above it, so it cannot be
      faked in commonTest. Pinning this needs either a seam in core-base/security (upstream, per
      RULE-TEMPLATE-MODULE-FIX-UPSTREAM-001) or a device able to reach `biometric_ready`.

  - id: consent-links-ui-test
    priority: P2
    status: open
    added_at: '2026-11-05'
    why: "pin that signin:consent carries both LinkAnnotation spans and each invokes its own lambda (onOpenTerms / onOpenPrivacyPolicy)"

