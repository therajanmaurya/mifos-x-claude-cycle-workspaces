  --space-xs: 4px; --space-sm: 8px; --space-md: 12px; --space-lg: 16px; --space-xl: 24px; --space-xxl: 32px; --space-xxxl: 48px;

[data-theme="dark"] {

  --color-on-surface-variant: #CBD5E1;

* { box-sizing: border-box; }
html, body { margin: 0; }
body { width: 100%; min-height: 100vh; background: var(--color-surface); color: var(--color-on-surface); font-family: var(--font-family); -webkit-font-smoothing: antialiased; }
button { font: inherit; }
.page { width: 100%; min-height: 100vh; display: flex; flex-direction: column; }
.brand-panel { display: none; }
.card { flex: 1; width: 100%; display: flex; flex-direction: column; padding: var(--space-lg) var(--space-xl) var(--space-xl); background: var(--color-surface); }
.form { flex: 1; display: flex; flex-direction: column; }
.chip { align-self: center; display: inline-flex; align-items: center; min-height: 48px; padding: 0 var(--space-md); border: 0; border-radius: 999px; background: transparent; color: var(--color-on-surface-variant); font-size: 13px; letter-spacing: 0.1px; cursor: pointer; }
.chip-inner { display: inline-flex; align-items: center; gap: var(--space-sm); height: 32px; padding: 0 var(--space-sm) 0 var(--space-md); border: 1px solid var(--color-outline-variant); border-radius: 999px; background: var(--color-background); }
.chip svg { width: 16px; height: 16px; flex: none; }
.chip .host { color: var(--color-on-surface); font-weight: 500; }
.chip .sep { opacity: 0.5; }
.mark-tile { align-self: center; margin-top: var(--space-xxl); width: 72px; height: 72px; display: grid; place-items: center; border-radius: var(--radius-tile); background: var(--color-secondary-container); }
.mark-tile svg { width: 44px; height: 44px; }

.bio svg { width: 26px; height: 26px; }

.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--color-outline-variant); }
.fields { margin-top: var(--space-xl); display: flex; flex-direction: column; gap: var(--space-lg); }
.field { position: relative; display: flex; align-items: center; gap: var(--space-md); height: 56px; padding: 0 var(--space-xs) 0 var(--space-md); border: 1px solid var(--color-outline); border-radius: var(--radius-field); background: var(--color-surface); }
.field > svg { width: 24px; height: 24px; flex: none; color: var(--color-on-surface-variant); }
.field label { position: absolute; top: -9px; left: 10px; padding: 0 var(--space-xs); background: var(--color-surface); font-size: 12px; line-height: 16px; color: var(--color-on-surface-variant); }
.field .value { flex: 1; font-size: 16px; color: var(--color-on-surface); }
.field .placeholder { flex: 1; font-size: 16px; color: var(--color-outline); }
.icon-btn { width: 48px; height: 48px; flex: none; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: transparent; color: var(--color-on-surface-variant); cursor: pointer; }
.icon-btn svg { width: 24px; height: 24px; }
.primary { margin-top: var(--space-xl); width: 100%; min-height: 48px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 999px; background: var(--color-primary); color: var(--color-on-primary); font-size: 15px; font-weight: 600; letter-spacing: 0.2px; cursor: pointer; box-shadow: 0 1px 2px rgba(31, 29, 117, 0.25); }
.consent { margin: var(--space-xxl) 0 0; padding-top: var(--space-lg); text-align: center; font-size: 12px; line-height: 18px; color: var(--color-on-surface-variant); }
.consent a { color: var(--color-primary); font-weight: 500; text-decoration: none; }
.spacer { flex: 1; }
:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
/* medium (600-840): the same form as a centred card on a brand-tinted ground */
@media (min-width: 600px) {
  body { background: var(--color-ground); }

  .spacer { display: none; }

@media (min-width: 840px) {

  .brand-panel { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: var(--space-xxxl); border-radius: var(--radius-card); background: var(--color-brand-panel); color: var(--color-on-brand-panel); }
  .brand-panel .big-mark { width: 112px; height: 112px; border-radius: 22px; overflow: hidden; display: block; }
  .brand-panel h2 { margin: var(--space-xxl) 0 var(--space-md); font-size: 40px; line-height: 46px; font-weight: 600; letter-spacing: -0.6px; max-width: 12ch; }
  .brand-panel p { margin: 0; font-size: 17px; line-height: 26px; color: var(--color-on-brand-panel-muted); max-width: 34ch; }
  .card { align-self: center; flex: 0 1 var(--card-max); }
  .card .mark-tile { display: none; }
  .card .title { margin-top: var(--space-lg); text-align: left; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
