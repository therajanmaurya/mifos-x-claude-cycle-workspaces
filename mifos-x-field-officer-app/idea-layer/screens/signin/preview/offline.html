<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in offline: Mifos X Field Officer</title>
<style>
:root {
  --color-background: #FAFAFB;
  --color-on-background: #0F172A;
  --color-surface-card: #FFFFFF;
  --color-surface-variant: #E2E8F0;
  --color-on-surface-variant: #475569;
  --color-primary: #4338CA;
  --color-on-primary: #FFFFFF;
  --color-primary-container: #E0E7FF;
  --color-on-primary-container: #1F1D75;
  --color-secondary-container: #D1FAE5;
  --color-tertiary: #D97706;
  --color-tertiary-container: #FEF3C7;
  --color-on-tertiary-container: #78350F;
  --color-error: #F87171;
  --color-on-error-container: #9F1239;
  --color-outline: #94A3B8;
  --color-outline-variant: #CBD5E1;
  --color-inverse-surface: #1E293B;
  --color-inverse-on-surface: #F1F5F9;
  --color-ground: #EEF0FA;
  --color-brand-panel: #1F1D75;
  --color-on-brand-panel: #FFFFFF;
  --color-on-brand-panel-muted: #C7D2FE;
  --color-scrim: rgba(15, 23, 42, 0.32);
  --color-disabled-container: rgba(15, 23, 42, 0.12);
  --color-on-disabled: rgba(15, 23, 42, 0.38);
  --mark-lime: #92D050;
  --mark-green: #00B050;
  --mark-blue: #0070C0;
  --mark-sky-a: #00B0F0;
  --mark-sky-b: #7FD8F8;
  --mark-x: #FFFFFF;
  --el-1: 0 1px 2px rgba(15, 23, 42, 0.06), 0 2px 6px rgba(15, 23, 42, 0.05);
  --el-2: 0 1px 2px rgba(15, 23, 42, 0.06), 0 16px 40px rgba(31, 29, 117, 0.10);
  --el-3: 0 4px 12px rgba(15, 23, 42, 0.18), 0 12px 28px rgba(15, 23, 42, 0.16);
  --font-family: "Outfit", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  --fs-headline: 24px; --lh-headline: 32px;
  --fs-display: 32px; --lh-display: 40px;
  --fs-body: 16px; --lh-body: 24px;
  --fs-body-md: 14px; --lh-body-md: 20px;
  --fs-small: 12px; --lh-small: 16px;
  --fs-chip: 13px;
  --fw-regular: 400; --fw-medium: 500; --fw-semibold: 600;
  --sp-xs: 4px; --sp-sm: 8px; --sp-md: 12px; --sp-lg: 16px; --sp-xl: 24px; --sp-xxl: 32px; --sp-xxxl: 48px;
  --touch-min: 48px;
  --field-h: 56px;
  --chip-h: 32px;
  --icon: 24px; --icon-sm: 18px;
  --tile: 64px; --tile-mark: 36px; --brand-mark: 88px;
  --spinner: 48px; --spinner-w: 4px;
  --border-w: 1px; --border-w-strong: 2px;
  --r-md: 12px; --r-lg: 20px; --r-full: 999px;
  --form-max: 400px;
  --card-medium: 480px;
  --content-expanded: 1200px;
  --stage-min: 680px;
  --snackbar-max: 560px;
}
[data-theme="dark"] {
  --color-background: #0F172A;
  --color-on-background: #F1F5F9;
  --color-surface-card: #1E293B;
  --color-surface-variant: #334155;
  --color-on-surface-variant: #CBD5E1;
  --color-primary: #A5B4FC;
  --color-on-primary: #1F1D75;
  --color-primary-container: #312E81;
  --color-on-primary-container: #E0E7FF;
  --color-secondary-container: #064E3B;
  --color-tertiary: #FBBF24;
  --color-tertiary-container: #451A03;
  --color-on-tertiary-container: #FEF3C7;
  --color-error: #F87171;
  --color-on-error-container: #FECDD3;
  --color-outline: #64748B;
  --color-outline-variant: #334155;
  --color-inverse-surface: #E2E8F0;
  --color-inverse-on-surface: #0F172A;
  --color-ground: #0F172A;
  --color-brand-panel: #312E81;
  --color-on-brand-panel: #FFFFFF;
  --color-on-brand-panel-muted: #C7D2FE;
  --color-scrim: rgba(0, 0, 0, 0.5);
  --color-disabled-container: rgba(241, 245, 249, 0.12);
  --color-on-disabled: rgba(241, 245, 249, 0.38);
  --el-1: 0 1px 2px rgba(0, 0, 0, 0.4);
  --el-2: 0 1px 2px rgba(0, 0, 0, 0.4), 0 16px 40px rgba(0, 0, 0, 0.35);
  --el-3: 0 4px 12px rgba(0, 0, 0, 0.45), 0 12px 28px rgba(0, 0, 0, 0.4);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100vh; background: var(--color-surface-card); color: var(--color-on-background); font-family: var(--font-family); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
.defs { position: absolute; }
.ic { width: var(--icon); height: var(--icon); flex: none; fill: currentColor; }
.ic-sm { width: var(--icon-sm); height: var(--icon-sm); }
.root { width: 100%; min-height: 100vh; display: flex; flex-direction: column; }
.stage { flex: 1; width: 100%; display: flex; }
.brand { display: none; }
.card { flex: 1; width: 100%; min-height: 100vh; display: flex; flex-direction: column; background: var(--color-surface-card); }
.content { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: var(--sp-xl); padding: var(--sp-sm) var(--sp-xl) var(--sp-xl); }
.chip { align-self: center; max-width: 100%; min-height: var(--touch-min); display: inline-flex; align-items: center; padding: 0; border: 0; background: transparent; cursor: pointer; }
.chip-pill { height: var(--chip-h); max-width: 100%; display: inline-flex; align-items: center; gap: var(--sp-sm); padding: 0 var(--sp-sm) 0 var(--sp-md); border: var(--border-w) solid var(--color-outline-variant); border-radius: var(--r-full); color: var(--color-on-surface-variant); font-size: var(--fs-chip); font-weight: var(--fw-medium); letter-spacing: 0.1px; white-space: nowrap; }
.chip-pill span { overflow: hidden; text-overflow: ellipsis; }
.chip:hover .chip-pill { background: var(--color-background); }
.chip-chev { opacity: 0.7; }
.form-area { width: 100%; max-width: var(--form-max); display: flex; flex-direction: column; align-items: center; gap: var(--sp-xl); }
.logo { width: var(--tile); height: var(--tile); display: grid; place-items: center; border-radius: var(--r-lg); background: var(--color-secondary-container); margin-top: var(--sp-lg); }
.mark { width: var(--tile-mark); height: var(--tile-mark); display: block; }
.title { text-align: center; display: flex; flex-direction: column; gap: var(--sp-xs); }
.title h1 { margin: 0; font-size: var(--fs-headline); line-height: var(--lh-headline); font-weight: var(--fw-semibold); letter-spacing: -0.2px; }
.title p { margin: 0; font-size: var(--fs-body-md); line-height: var(--lh-body-md); color: var(--color-on-surface-variant); }
.fields { width: 100%; display: flex; flex-direction: column; gap: var(--sp-lg); }
.field { width: 100%; display: flex; flex-direction: column; gap: var(--sp-xs); }
.field-box { position: relative; min-height: var(--field-h); display: flex; align-items: center; gap: var(--sp-md); padding: 0 var(--sp-xs) 0 var(--sp-md); border: var(--border-w) solid var(--color-outline); border-radius: var(--r-md); color: var(--color-on-surface-variant); cursor: text; }
.field-box:focus-within { border: var(--border-w-strong) solid var(--color-primary); }
.field-label { position: absolute; top: calc(var(--sp-sm) * -1); left: var(--sp-md); padding: 0 var(--sp-xs); background: var(--color-surface-card); font-size: var(--fs-small); line-height: var(--lh-small); color: var(--color-on-surface-variant); }
.field-box input { flex: 1; min-width: 0; height: var(--field-h); border: 0; outline: 0; background: transparent; font-size: var(--fs-body); color: var(--color-on-background); }
.field-box input::placeholder { color: var(--color-outline); }
.field-lead { margin-right: var(--sp-xs); }
.field-trail { width: var(--touch-min); height: var(--touch-min); flex: none; display: grid; place-items: center; border: 0; border-radius: var(--r-full); background: transparent; color: var(--color-on-surface-variant); cursor: pointer; }
.btn { width: 100%; min-height: var(--touch-min); display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-sm); border-radius: var(--r-full); font-size: var(--fs-body); font-weight: var(--fw-semibold); letter-spacing: 0.2px; cursor: pointer; }
.btn-primary { border: 0; background: var(--color-primary); color: var(--color-on-primary); box-shadow: var(--el-1); }
.btn-primary:hover { filter: brightness(1.06); }
.btn-primary:disabled { background: var(--color-disabled-container); color: var(--color-on-disabled); box-shadow: none; filter: none; cursor: not-allowed; }
.consent-bar { flex: none; padding: var(--sp-lg) var(--sp-xl) calc(var(--sp-lg) + env(safe-area-inset-bottom)); }
.consent { margin: 0 auto; max-width: var(--form-max); text-align: center; font-size: var(--fs-small); line-height: var(--lh-small); color: var(--color-on-surface-variant); }
.consent a { color: var(--color-primary); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.snackbar { position: fixed; left: 50%; bottom: calc(var(--sp-xxxl) + var(--sp-xxl) + env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(calc(100% - var(--sp-xxl)), var(--snackbar-max)); min-height: var(--touch-min); display: flex; align-items: center; padding: var(--sp-md) var(--sp-lg); border-radius: var(--r-md); background: var(--color-inverse-surface); color: var(--color-inverse-on-surface); box-shadow: var(--el-3); font-size: var(--fs-body-md); line-height: var(--lh-body-md); z-index: 5; }
:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
@media (min-width: 600px) {
  body { background: var(--color-ground); }
  .root { justify-content: center; padding: var(--sp-xxl) var(--sp-xl); }
  .stage { flex: none; max-width: var(--card-medium); margin: 0 auto; }
  .card { min-height: 0; border-radius: var(--r-lg); box-shadow: var(--el-2); overflow: hidden; }
  .content { padding: var(--sp-xl) var(--sp-xxl) var(--sp-lg); }
  .consent-bar { padding: var(--sp-sm) var(--sp-xxl) var(--sp-xl); }
}
@media (min-width: 840px) {
  .stage { max-width: var(--content-expanded); min-height: var(--stage-min); display: grid; grid-template-columns: 5fr 6fr; border-radius: var(--r-lg); box-shadow: var(--el-2); overflow: hidden; }
  .brand { display: flex; flex-direction: column; justify-content: flex-end; gap: var(--sp-lg); padding: var(--sp-xxxl); background: var(--color-brand-panel); color: var(--color-on-brand-panel); }
  .brand-tile { width: var(--brand-mark); height: var(--brand-mark); margin-bottom: auto; border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--el-2); }
  .brand-tile svg { width: 100%; height: 100%; display: block; }
  .brand h2 { margin: 0; font-size: var(--fs-display); line-height: var(--lh-display); font-weight: var(--fw-semibold); letter-spacing: -0.4px; }
  .brand p { margin: 0; max-width: 40ch; font-size: var(--fs-body); line-height: var(--lh-body); color: var(--color-on-brand-panel-muted); }
  .card { border-radius: 0; box-shadow: none; }
  .content { justify-content: center; padding: var(--sp-xxxl) var(--sp-xxxl) var(--sp-lg); }
  .logo { display: none; }
  .consent-bar { padding: var(--sp-sm) var(--sp-xxxl) var(--sp-xxl); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" class="defs" aria-hidden="true">
  <defs>
    <linearGradient id="mark-sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: var(--mark-sky-a)"/>
      <stop offset="1" style="stop-color: var(--mark-sky-b)"/>
    </linearGradient>
    <symbol id="mifos-mark" viewBox="0 0 200 200">
      <polygon points="0,0 200,0 100,100" style="fill: var(--mark-lime)"/>
      <polygon points="0,200 200,200 100,100" style="fill: var(--mark-green)"/>
      <polygon points="0,0 0,200 100,100" style="fill: var(--mark-blue)"/>
      <polygon points="200,0 200,200 100,100" fill="url(#mark-sky)"/>
      <path d="M0 0 L200 200 M200 0 L0 200" style="stroke: var(--mark-x)" stroke-width="20"/>
    </symbol>
    <symbol id="i-dns" viewBox="0 0 24 24"><path d="M20 13H4c-.55 0-1 .45-1 1v6c0 .55.45 1 1 1h16c.55 0 1-.45 1-1v-6c0-.55-.45-1-1-1zM7 19c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM20 3H4c-.55 0-1 .45-1 1v6c0 .55.45 1 1 1h16c.55 0 1-.45 1-1V4c0-.55-.45-1-1-1zM7 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></symbol>
    <symbol id="i-person" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></symbol>
    <symbol id="i-visibility-off" viewBox="0 0 24 24"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/></symbol>
  </defs>
</svg>
<div class="root" data-shell="root" data-screen-id="signin" data-state="offline">
  <div class="stage" data-component-type="LayoutBox" data-component-id="stage">

    <aside class="brand" data-component-type="LayoutBox" data-component-id="brand_panel" aria-label="Mifos X Field Officer">
      <span class="brand-tile" data-component-type="Image" data-component-id="brand_panel_mark"><svg role="img" aria-label="Mifos X"><use href="#mifos-mark"/></svg></span>
      <h2 data-component-type="Text" data-component-variant="display_small" data-component-id="brand_panel_name">Mifos X Field Officer</h2>
      <p data-component-type="Text" data-component-variant="body_large" data-component-id="brand_panel_line">For loan officers and field staff running Mifos X.</p>
    </aside>

    <section class="card" data-component-type="Scaffold" data-component-id="signin_scaffold">
      <main class="content" data-shell="content" data-state="offline" data-component-type="LayoutBox" data-component-id="content">
        <button class="chip" type="button" data-component-type="AssistChip" data-component-id="instance_chip" data-nav-to="serverConfig" data-nav-type="push" aria-label="Server apis.mifos.community, tenant mifos-bank-1. Change server">
          <span class="chip-pill">
            <svg class="ic ic-sm" aria-hidden="true"><use href="#i-dns"/></svg>
            <span>apis.mifos.community · mifos-bank-1</span>
            <svg class="ic ic-sm chip-chev" aria-hidden="true"><use href="#i-chevron"/></svg>
          </span>
        </button>

        <div class="form-area">
          <div class="logo" data-component-type="Image" data-component-id="logo">
            <svg class="mark" role="img" aria-label="Mifos X"><use href="#mifos-mark"/></svg>
          </div>

          <div class="title" data-component-type="TextBlock" data-component-id="title">
            <h1>Mifos X Field Officer</h1>
            <p>Please enter your credentials</p>
          </div>

          <div class="fields">
            <div class="field" data-component-type="OutlinedTextField" data-component-id="username_field">
              <label class="field-box">
                <span class="field-label">Username</span>
                <svg class="ic field-lead" aria-hidden="true"><use href="#i-person"/></svg>
                <input type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Enter username" value="fieldofficer">
              </label>
            </div>

            <div class="field" data-component-type="OutlinedTextField" data-component-id="password_field">
              <label class="field-box">
                <span class="field-label">Password</span>
                <svg class="ic field-lead" aria-hidden="true"><use href="#i-lock"/></svg>
                <input type="password" name="password" autocomplete="current-password" autocapitalize="none" placeholder="Enter password" value="password123">
                <button class="field-trail" type="button" data-component-type="IconButton" data-component-id="toggle_visibility" data-action="local_state" data-action-params='{"target":"passwordVisibility"}' aria-label="Show password">
                  <svg class="ic" aria-hidden="true"><use href="#i-visibility-off"/></svg>
                </button>
              </label>
            </div>
          </div>

          <button class="btn btn-primary" type="button" data-component-type="Button" data-component-variant="primary" data-component-id="login_button" data-action="submit" data-action-params='{"target":"authenticate"}'>Login</button>
        </div>
      </main>

      <footer class="consent-bar" data-component-type="LayoutBox" data-component-id="bottom_bar">
        <p class="consent" data-component-type="LegalText" data-component-variant="body_small" data-component-id="consent_text" data-testid="signin:consent">By signing in you accept our <a role="link" tabindex="0" data-component-type="Link" data-component-id="terms_link" data-action="open_terms" aria-label="Terms &amp; Conditions - opens in the app">Terms &amp; Conditions</a> and <a role="link" tabindex="0" data-component-type="Link" data-component-id="privacy_policy_link" data-action="open_privacy_policy" aria-label="Privacy Policy - opens in the app">Privacy Policy</a>.</p>
      </footer>
    </section>
  </div>

  <div class="snackbar" role="status" aria-live="polite" data-component-type="Snackbar" data-component-id="snackbar">You are offline. Signing in needs a connection.</div>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
