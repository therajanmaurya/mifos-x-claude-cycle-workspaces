# signin — UI contract. **v2 — PROFESSIONAL TARGET**, authored 2026-10-03.
#
# ─────────────────────────── HOW TO READ THIS FILE ───────────────────────────
# v1 (`6b66e8a43:feature/auth/.../login/`) is the CONTEXT, not the ceiling. It establishes what this
# screen DOES — which endpoint, which rules, which states, which navigation — and that functional
# contract is preserved exactly. What it does NOT establish is what the screen should LOOK like or
# which affordances a 2026 field-officer app owes its user. v1 was a first version.
#
# Everything added below is CAPABILITY-BACKED. The rule this file follows, learned the expensive way
# on 2026-10-02: an affordance in a design that nothing can implement is a FALSE STATEMENT about the
# product, and a convincing mockup makes it expensive. The Stitch renders invented biometric unlock,
# an "Offline Field Cache Enabled" banner and an "Active Officer ID" row; all three were struck.
# Biometrics is BACK here — not because a renderer drew it, but because
# `core-base/security/BiometricAuthenticator` ships with android/ios/desktop/js actuals and the app
# simply never wired it. Every other addition carries the same kind of citation.
#
# v1 provenance is retained inline (`v1:` keys and the `## v1 defects` block) so the migration
# remains auditable — this is a redesign WITH history, not a greenfield screen.

schema_version: "3.1"
screen_id: signin
name: Sign in
status: designed          # v2 target; v1 behaviour shipped and device-verified 2026-10-03

# ──────────────── ARCHETYPE ────────────────
# Feature-level default consumed by the prompt builder's per-state archetype resolution.
#
# `form` is deliberate and load-bearing. The builder resolves a state's archetype as
# (1) archetype_overrides[state] → (2) a table keyed on the STATE NAME → (3) this value. That table
# maps `empty → empty_state` / `success → success_state`, correct for a list or detail screen where
# `empty` means "no data". On a form `empty` means a PRISTINE form. Leaving it unset is what made
# all six 2026-10-02 renders come out as no-data hero screens.
archetype: form

archetype_overrides:
  empty: form
  biometric_ready: form
  submitting: form
  validation_error: form
  transport_error: form
  offline: form
  locked_out: form
  success: form

# ──────────────── FEATURE PROFILE ────────────────
feature_profile:
  combo_id: form_submit
  facets: [form, auth, submit, biometric]
  archetype: screen-content
  store_archetype: MEMORY_ONLY     # sign-in is OnlineRequired and caches nothing
  recipe_ref: FEATURE_LAYER_BUILD_GUIDE
  heal: auto
  profile_hash: v2-professional-2026-10-03

# ──────────────── FEATURE SPLIT VERDICT ────────────────
# Asked explicitly 2026-10-03: should this feature split?
#
# NO — and the reason matters, because inventing a split to satisfy the question would be worse than
# leaving it whole. The one genuinely separable concern on this screen is CHOOSING THE SERVER, and
# that is ALREADY its own feature (`serverConfig`, living in `feature/settings/serverconfig`). What
# v2 changes is not the boundary but how signin SURFACES it: from a blind full-width button into an
# instance chip that states the current target. One screen, one job — authenticate — with a typed
# hand-off to a feature that already exists.
#
# One genuine split DOES exist and is deliberately NOT taken here: `onboarding`. `RootNavState` has
# a `ShowOnboarding` branch that falls through to sign-in because v1 shipped no onboarding screen
# (flow.yaml#inbound_routes). That is net-new product scope rather than migration, so it is recorded
# as a gap for a decision, not silently built.
feature_split:
  verdict: no-split
  already_separate: [serverConfig]
  deferred_candidate:
    id: onboarding
    why: "RootNavState.ShowOnboarding resolves to sign-in because no onboarding screen exists"
    status: decided
    decided_at: "2026-11-04"
    decision: "build it — first-run intro pages + privacy consent, shown once before sign-in (operator)"
    materialized_as: screens/onboarding      # /idea-plan-add add-feature onboarding; ShowOnboarding → onboarding → signin

# ──────────────── SHELL OVERRIDE ────────────────
# The MACHINE-READ opt-out from the project chrome (`UiYamlShellOverride`, merged by
# load-app-shell.ts over `design-system/app-shell.yaml#defaults`). The project default is the
# authenticated shell — top app bar + bottom navigation — because most surfaces are post-login.
# This gate opts out of all of it: there is nowhere to navigate back to, no tab to switch, and no
# settings reachable before authentication, so any chrome here is a dead affordance.
#
# Note for anyone reading the generated prompt: because `resolvedShell` is a BOTTOM-NAV list, a
# screen with no bottom nav produces an empty list and the prompt falls back to its neutral
# "app-shell rules are defined per project" line REGARDLESS of this block. That neutral text is
# what invited the phantom settings-gear icon into all six 2026-10-02 renders. The operative
# instruction for a chrome-less screen is therefore the explicit NO-TOP-APP-BAR line in
# `visual_treatment` below — this block is the structural truth, that line is what the renderer
# actually reads. Both are needed; neither is redundant.
shell:
  bottom_navigation_visible: false
  top_app_bar_visible: false
  fab_visible: false
  drawer_accessible: false

# ──────────────── LAYOUT ────────────────
layout:
  container: scaffold
  top_bar: none            # unauthenticated gate — nothing to navigate back to
  scroll: "the content Column verticalScrolls; the bottom consent block does not"
  content_order:
    - instance_chip
    - logo
    - title
    - username_field
    - password_field
    - lockout_notice
    - login_button
    - biometric_action
  bottom_bar: [consent_text]
  overlay: [progress_overlay]
  snackbar_host: scaffold_default
  container_color: "colorScheme.surface"
  v1: >
    v1 put the server CTA in `Scaffold(bottomBar)` and had no consent block. v2 moves the server
    affordance to the TOP as an informational chip (you should know where you are signing in BEFORE
    you type) and gives the bottom bar to the consent text, which belongs adjacent to the action it
    qualifies.

# ──────────────── STATES ────────────────
# Six v1 states + two v2 states. `kind: custom` on every one is required, not cosmetic: the builder
# infers kind from the state NAME when it is absent, and would read `empty` as a no-data state and
# `offline` as an error state — both wrong for a form, and both then CONTRADICT the form brief in
# the same prompt.
states:
  empty:
    kind: custom
  biometric_ready:
    kind: custom
  submitting:
    kind: custom
  validation_error:
    kind: custom
  transport_error:
    kind: custom
  offline:
    kind: custom
  locked_out:
    kind: custom
  success:
    kind: custom

initial_state: empty

# MACHINE-READ per-state composition. `state_detail[]` below is the HUMAN record (rationale,
# provenance, capability citations); THIS map is what the prompt builder actually consumes.
#
# Both are needed because the builder resolves a state's components from `state_components[key]`
# first, and only reads a `state_detail[]` list when it is NESTED inside a screen block — a
# TOP-LEVEL `state_detail:` array is never scanned. Without this map every state fell back to the
# full top-level `components:` list, so `empty` advertised the lockout banner and the biometric
# action, and `locked_out` advertised biometric unlock. Keep the two in step.
state_components:
  empty:            [instance_chip, logo, title, username_field, password_field, login_button, consent_text]
  biometric_ready:  [instance_chip, logo, title, biometric_action, username_field, password_field, login_button, consent_text]
  submitting:       [instance_chip, logo, title, username_field, password_field, login_button, consent_text, progress_overlay]
  validation_error: [instance_chip, logo, title, username_field, password_field, login_button, consent_text]
  transport_error:  [instance_chip, logo, title, username_field, password_field, login_button, consent_text, lockout_notice, snackbar]
  offline:          [instance_chip, logo, title, username_field, password_field, login_button, consent_text, snackbar]
  # login_button is PRESENT but disabled (see components.login_button.disabled_when). Omitting it
  # here contradicted that declaration and made the render drop the control entirely, which shifts
  # the layout the moment a user is locked out. Disabled, not hidden.
  locked_out:       [instance_chip, logo, title, username_field, password_field, lockout_notice, login_button, consent_text]
  success:          [instance_chip, logo, title, username_field, password_field, login_button, consent_text]

state_detail:
  - id: empty
    v1_source: "LoginUiState.Empty"
    description: "pristine form — fields blank and editable, no error, instance chip shows the target"
    components: [instance_chip, logo, title, username_field, password_field, login_button, consent_text]

  - id: biometric_ready
    v1_source: "NEW in v2"
    description: >
      A returning officer on a device with enrolled biometrics and a stored session. The form is
      still present and usable — biometrics is an accelerator, never the only way in — with a
      prominent unlock action above it.
    components: [instance_chip, logo, title, biometric_action, username_field, password_field, login_button, consent_text]
    capability: "core-base/security/BiometricAuthenticator.isAvailable() && a stored session exists"
    rationale: >
      This is the actual user problem v1 ignored. A field officer signs in repeatedly, outdoors, on
      a phone, often wearing gloves; re-typing a password each time is the friction that matters.
      The capability has shipped unused since the template landed.

    # ──── FOLDED BACK FROM IMPLEMENTATION 2026-10-05 ────
    implemented: true
    implemented_as: "SignInState.hasStoredSession && .biometricAvailable && !.isLockedOut (canUseBiometrics)"
    gate_keyed_on: base64EncodedAuthenticationKey
    gate_keyed_on_why: >
      Non-blank credential, NOT `isAuthenticated`. Biometrics unlocks a STORED session, and what
      makes a session storable is the credential, not the flag.
    reached_through: >
      `core/platform/module-deps.gradle.kts` `api`-re-exports `core-base:security`. That seam is
      FORK-OWNED, so no upstream PR is required, and features reach core-base THROUGH core/ rather
      than directly (G-CORE-BASE-ENCAP). Before this line nothing outside `cmp-navigation` and
      `core-base/network` could reach the module at all — which is why the capability sat unused.
    device_verified: false
    device_verdict: pending-device-verify
    device_blocker: >
      UNREACHABLE on a device today. The state needs sign-in shown WITH a stored session — root state
      `UserLocked` — and nothing produces it: measured 2026-10-05, force-stop + relaunch with a stored
      session resolves to `UserUnlocked` and lands on home. v1's passcode screen was the lock path and
      was already dead code there, so the port had nothing to carry over. Shipping a lock surface
      (passcode, or idle timeout) is a product decision.
    covered_by:
      - SignInScreenUiTest.biometricUnlockIsOfferedOnlyWhenItCanActuallySucceed
      - SignInScreenUiTest.biometricUnlockRendersForAReturningOfficerAndIsWithdrawnOnLockout
      - SignInViewModelTest.aStoredSessionIsWhatMakesBiometricUnlockRelevant
    gap_ref: "state/CAPABILITY_GAPS.yaml#no-lock-surface::signin/biometric_ready"

  - id: submitting
    v1_source: "LoginUiState.ShowProgress"
    description: "credential check in flight; modal overlay covers the form, fields keep their values"
    components: [instance_chip, logo, title, username_field, password_field, login_button, consent_text, progress_overlay]

  - id: validation_error
    v1_source: "LoginUiState.ShowValidationError"
    description: "a client-side rule failed — error text and a trailing error icon on the OFFENDING field only"
    components: [username_field, password_field]
    v1: >
      v1 passed BOTH message resources whenever EITHER rule failed, so a valid username still showed
      a username error. v2 attributes per field. Device-verified 2026-10-03.

  - id: transport_error
    v1_source: "LoginUiState.ShowError"
    description: "rejected or unreachable — Snackbar, fields preserved, remaining-attempts hint if close to lockout"
    components: [snackbar, lockout_notice]

  - id: offline
    v1_source: "NEW in the port — MutationResult.Blocked(OFFLINE)"
    description: "no connectivity; distinct from a rejected credential"
    components: [snackbar]
    v1: "v1 could not express this — DataState had no such state."

  - id: locked_out
    v1_source: "NEW in v2"
    description: >
      Too many consecutive failures. Submit is disabled and the notice states what happened and when
      it clears. The form stays visible so the user can still reach the instance chip and consent.
    components: [instance_chip, logo, title, username_field, password_field, lockout_notice, consent_text]
    capability: "SignInState.failedAttempts / .isLockedOut, mirroring SecurityPolicy.lockAfterFailedAttempts (5)"
    rationale: >
      Without a throttle a brute-force attempt against a field officer's device is unthrottled, and
      the user gets no warning before being locked out.
    implemented_as: local-counter
    implemented_at: '2026-10-05'
    not_backed_by_tracker: >
      CORRECTED 2026-10-05. The design cited `core-base/security/FailedAttemptTracker` as the
      capability; the implementation deliberately does NOT use it, and the citation was wrong rather
      than merely unfulfilled. `FailedAttemptTracker.recordFailure()` invokes `SecureWiper` at
      `wipeAfterFailedAttempts: 10` — irreversible local data destruction. Arming that for a field
      officer who mistypes a password is a PRODUCT decision, not an implementation detail. The screen
      therefore implements the throttle half only, as an in-memory counter in `SignInState`, with the
      threshold mirrored exactly and named `LOCK_AFTER_ATTEMPTS` so the relationship stays greppable.
    honest_limitation: >
      An in-memory counter does not survive a process restart, so the pause can be cleared by
      relaunching. That is the cost of not arming the wipe. Persisting the counter is a separate
      decision from wiping, and neither is taken here —
      see data-flow.yaml#not_written.failed_attempt_count.
    device_verified: '2026-10-05'

  - id: success
    v1_source: "LoginUiState.HomeActivityIntent"
    description: "authenticated — session persisted, root state machine routes onward"
    components: []
    v1: >
      Fineract answers HTTP 200 with `authenticated: false` for a bad credential, so a successful
      CALL is not a successful LOGIN. v1 checked the flag explicitly; dropping that check admits a
      failed login.

# ──────────────── VISUAL TREATMENT (per-screen brief; REPLACES the archetype default) ────────────
visual_treatment:
  - "A calm, confident CREDENTIAL screen for a field worker: generous vertical rhythm, one clear primary action, nothing competing with it. This is the first screen of a banking tool — it should read as trustworthy and quiet, not playful."
  - "Vertical order: a small instance chip at the very top, then the brand mark, then a two-line title, then the two fields, then the primary submit, then the biometric accelerator when present. A short legal consent line sits pinned at the bottom."
  - "The INSTANCE CHIP is the signature element and must not look like a button: a compact, low-contrast pill with a small server glyph showing host and tenant, with a subtle chevron implying it can be changed. It is information first and an affordance second."
  - "CLOSED SET — only the listed components and copy: no extra badges, chips, status lines or feature lists (lg: brand panel = mark, app name, one product line)."
  - "DO NOT add: 'remember me', 'forgot password', 'create account'/'sign up', social or SSO buttons, a QR scanner, an offline-cache banner, an officer/employee ID field, a language picker, or a version footer. None of these exist."
  - "NO TOP APP BAR and no chrome above the instance chip: no gear, no overflow, no back arrow. This is the unauthenticated gate — there is nowhere to go back to."
  # 2026-11-05 (RULE-MOCKUP-RESPONSIVE-001): stated here because the prompt builder only emits a generic responsive
  # line, and without a screen-specific one Stitch capped the root at phone width (max-w-md, no md:/lg:) on 1-2 of 8 states.
  - "RESPONSIVE: compact is a full-width form; md: a centred card on a tinted ground; lg: two panes (brand panel + card) capped near 1200 wide. Never a phone-width max-w cap without an md:/lg: widening."

# ──────────────── COMPONENTS ────────────────
# ORDER IS LOAD-BEARING: the prompt builder emits its `## Composition (top → bottom)` block from
# THIS list's order, not from state_detail[].components.
components:
  - id: instance_chip
    type: assist_chip
    role: "which Fineract instance this sign-in will hit"
    # The LITERAL label matters here, not just a description of it. The composition block the
    # prompt builder emits carries `label`, but not a `displays:` map — so with only the map below,
    # six of eight renders filled the hostname from the model's own prior and printed
    # `demo.mifos.io`: the stale plain-Fineract host whose wrong base path caused the 2026-10-01
    # 404. A chip invented to make the real target visible that instead displays a false one is
    # worse than no chip, so the true value is stated here where the renderer will actually read it.
    label: "apis.mifos.community · mifos-bank-1"
    displays:
      host: "ServerConfig.endPoint, e.g. apis.mifos.community"
      tenant: "ServerConfig.tenant, e.g. mifos-bank-1"
    runtime_binding: >
      At RUNTIME the label is composed from the live `ServerConfig` (host + tenant), never from this
      literal. The literal exists so DESIGN-time renders show the shipped default instead of
      guessing; `ServerConfigAccessPointParityTest` is what keeps the shipped default honest.
    leading_icon: settings          # MifosIcons.Settings — was `dns` in the v2 draft
    trailing_icon: chevron_right

    # ──── FOLDED BACK FROM IMPLEMENTATION 2026-10-05 ────
    renders_states: all
    renders_unconditionally: true
    renders_unconditionally_why: >
      Including `submitting` and `locked_out`, and including the case where the host is not yet
      known. An early implementation guarded it with `if (instanceHost.isNotBlank())`, which inverted
      the intent: a blank host is the FIRST-RUN case, and hiding the only route to server
      configuration precisely when no server is configured strands the user — the same defect as v1's
      blind button, wearing the opposite shape. Caught by
      `SignInScreenUiTest.theEmptyStateShowsEverythingAFirstRunUserNeeds`, which a device run could
      not have caught because `ServerConfig.DEFAULT` is never blank.
    blank_host_label_ref: feature_signin_set_instance
    blank_host_why: >
      With no host, the chip states what it DOES ("Set server") rather than rendering a bare
      separator, so it never reads as a glitch.
    enabled_while_submitting: true
    enabled_while_locked_out: true
    enabled_why: >
      The two states where sign-in is stuck or paused are exactly when the user most needs the way
      out. Device-verified 2026-10-05: the chip stayed enabled while the submit button was disabled.
    honest_caveat: >
      The chip states a value the HTTP client does not currently read. No production code under
      `core/network` reads `ServerConfig` — the access point is a build-time constant — so the label
      is true for the shipped default (pinned by `ServerConfigAccessPointParityTest`) and becomes
      false the moment a user edits it. Making the value visible did not create that bug; it made an
      invisible one legible. Tracked at
      api.yaml#known_gaps.access-point-ignores-saved-server-config.
    device_verified: '2026-10-05'
    on_click:
      action: navigate
      target: serverConfig
      params: {}
    v1: >
      REPLACES v1's `Update Server Configuration` filled-tonal button in the bottomBar. Two reasons,
      one of them evidential rather than aesthetic:

        1. The v1 button was BLIND. It offered to change a setting without ever showing its current
           value, so a user could not tell a misconfigured instance from a correct one.
        2. On 2026-10-01 every call 404'd because the shipped base path was wrong, and sign-in
           reported "Login failed. Check your credentials and try again." Diagnosing it took a
           packet-level probe — precisely because THIS SCREEN DISPLAYED NOTHING about where it was
           connecting. A chip stating `apis.mifos.community · mifos-bank-1` would have made the
           fault visible in one glance.

      It stays reachable in every state including `submitting` and `locked_out`: a wrong server is
      exactly the condition under which sign-in keeps failing, so the way out must not disappear.

  - id: logo
    type: image
    asset: signin_brand_mark
    treatment: "contained in a soft rounded tile, approx 64dp"
    # 2026-11-05: stated literally because a render drew a bank glyph here (the builder emits `label`).
    label: "Mifos X mark: square split by a white X into 4 coloured triangles. Never a bank or building icon."
    v1: >
      v1 shipped `feature_auth_mifos_logo.jpg` — a 75KB JPEG of a raster logo with baked-in white
      background, which renders with visible edges on a tinted tile and cannot adapt to dark theme.
      v2 requires a purpose-made brand mark (see `visual_assets` below).

  - id: title
    type: text_block
    lines:
      - { role: headline, source: "BuildKonfig.APP_DISPLAY_NAME", style: headlineSmall }
      - { role: subtitle, label_ref: feature_signin_enter_credentials, style: bodyMedium }
    align: center

  - id: username_field
    type: outlined_text_field
    label_ref: feature_signin_username
    placeholder_ref: feature_signin_username_placeholder
    leading_icon: person
    capitalization: none
    trailing_icon_when_error: { icon: error, content_description_ref: feature_signin_cd_username_error }
    validation:
      rule: "CredentialRules.username"
      min_length: 4
      error_ref: feature_signin_error_username_length
    v1: >
      min_length 4 is v1's own rule (UsernameValidationUseCase). An authored replacement used 5 and
      rejected four-character usernames that signed in on v1. `capitalization: none` fixes a defect
      v1 HAD: the shared field hardcoded KeyboardCapitalization.Words, so an IME turned
      `fieldofficer` into `Fieldofficer` against a case-sensitive Fineract username — invisible to
      automation because `adb shell input text` bypasses the IME.

  - id: password_field
    type: outlined_text_field
    label_ref: feature_signin_password
    placeholder_ref: feature_signin_password_placeholder
    leading_icon: lock
    capitalization: none
    visual_transformation: password
    trailing_slot:
      when_no_error:
        id: toggle_visibility
        type: icon_button
        icon_hidden: visibility_off
        icon_shown: visibility
        on_click: { action: local_state, target: passwordVisibility }
      when_error:
        icon: error
        interactive: false
    validation:
      rule: "CredentialRules.password"
      min_length: 6
      error_ref: feature_signin_error_password_length
    handling:
      type: "kpt.core.base.security.SensitiveString"
      note: >
        v2 carries the password as `SensitiveString` (AutoCloseable, zeroes its CharArray) rather
        than a raw String. The type ships in core-base/security and was never used; a String lives
        in the heap until GC and shows up in a dump.
    v1: >
      MASKING MUST NOT DEPEND ON THE TRAILING SLOT. Implementing the error-replaces-toggle rule by
      disabling the toggle also disabled masking, printing the password in clear text at the moment
      the user is told it is wrong (found on device 2026-10-03, fixed in core/designsystem, locked
      by `SignInScreenUiTest.anInvalidPasswordIsStillMasked`).

  - id: lockout_notice
    type: inline_banner
    severity: warning
    renders_states: [transport_error, locked_out]
    content:
      approaching: "remaining attempts before the account locks"
      locked: "locked, and when it clears"
    capability: "SignInState.isApproachingLockout / .isLockedOut / .attemptsRemaining"
    capability_corrected_at: '2026-10-05'
    capability_was: "FailedAttemptTracker.currentFailedCount / .isLockedOut"
    capability_correction_why: "see states.locked_out#not_backed_by_tracker — the tracker is deliberately unwired"
    in_flow_not_snackbar: >
      Rendered as a banner inside the form rather than as a snackbar, unlike every other error on
      this screen. A snackbar announces an EVENT that happened once; this is a STANDING CONDITION the
      user needs to keep seeing while they decide what to do. `SignInError.LockedOut` is therefore
      the one error value mapped to `isTransportError = false`.
    device_verified: '2026-10-05'
    device_observed:
      approaching: "2 attempts remaining before sign-in is paused."
      locked: "Too many sign-in attempts. Signing in is paused for 5 minutes. You can still change the server if you are connecting to the wrong instance."

  - id: login_button
    type: button
    label_ref: feature_signin_login
    width: fill_max_width
    min_height: 48dp
    disabled_when: [submitting, locked_out]
    on_click:
      action: submit
      target: authenticate
      params: { username: "username_field.value", password: "password_field.value" }
    v1: "validates locally first — a round trip to be told a field is too short is one a field officer often cannot afford"

  - id: biometric_action
    type: text_button
    label_ref: feature_signin_biometric_unlock
    leading_icon: fingerprint
    renders_states: [biometric_ready]
    on_click:
      action: submit
      target: authenticateBiometric
      params: {}
    capability: "BiometricAuthenticator.authenticate(reason) — injected directly, not via SecureAuthManager"
    capability_corrected_at: '2026-10-05'
    capability_was: "SecureAuthManager.requestBiometric → BiometricAuthenticator.authenticate(reason)"
    capability_correction_why: >
      `SecureAuthManager` composes the authenticator WITH `FailedAttemptTracker`, whose failure path
      arms `SecureWiper`. Routing through it would have re-introduced the wipe this screen
      deliberately declines — see states.locked_out#not_backed_by_tracker. The authenticator is
      therefore injected on its own.
    notes: >
      Secondary by design. Biometrics accelerates a RETURNING session; it never replaces the
      credential path, because a field officer may hand the device to a colleague, and
      `BiometricResult.Unavailable` must always fall back to the form rather than dead-end.

    # ──── FOLDED BACK FROM IMPLEMENTATION 2026-10-05 ────
    hidden_not_disabled: >
      Unlike `login_button`, which is disabled and never hidden, this control is omitted entirely
      when unusable. The reasoning differs because the meaning does: a disabled submit button still
      tells a user what this screen is FOR, whereas a permanently greyed biometric button on a device
      with no stored session reads as a broken feature rather than an absent one.
    result_handling:
      Success: "re-affirm isAuthenticated on the stored user (sets isUnlocked), reset failedAttempts, emit LoggedIn"
      Cancelled: "clear isSubmitting only — a cancel is a CHOICE, no error, no lockout increment"
      Failure: "SignInError.BiometricFailed via snackbar; does NOT count toward lockout"
      Unavailable: "retract the affordance (biometricAvailable := false) rather than leave a dead control"
    withdrawn_when_locked_out: >
      The throttle is on SIGNING IN, not on one credential path. Leaving biometrics live during a
      lockout would let the same person who just failed five password attempts bypass the pause.
    mints_no_credential: >
      The unlock does NOT re-authenticate against Fineract — see
      api.yaml#local_only_capabilities.biometric-unlock. The security boundary is the device.
    device_verified: false
    device_verdict: pending-device-verify   # see states.biometric_ready#device_blocker

  - id: consent_text
    type: legal_text
    slot: bottom_bar
    testTag: "signin:consent"
    label_ref: feature_signin_consent
    # 2026-11-05 /idea-plan-add enhance signin (operator instruction, device-verified source
    # SignInScreen.kt ConsentText): accept-by-continuing wording, same rule as onboarding's agreement line —
    # signing in IS the acceptance act. ONE Text with two inline LinkAnnotation spans (spans carry no testTag;
    # tests find each link by its TEXT inside signin:consent). The LITERAL copy is stated so design-time
    # renders print the real sentence, never a guessed "Terms of Service".
    label: "By signing in you accept our Terms & Conditions and Privacy Policy."
    text: "{strings.screens.signin.consent}"          # "By signing in you accept our %1$s and %2$s."
    args: ["{strings.screens.signin.terms}", "{strings.screens.signin.privacy_policy}"]   # Terms & Conditions FIRST, then Privacy Policy
    style: { titleColor: onSurfaceVariant, typography: body_small, textAlign: center }
    links:
      - id: terms_link
        token: terms
        span_text: "{strings.screens.signin.terms}"           # "Terms & Conditions"
        arg_index: 1
        target_url: 'AppOrgLinks["terms"]'                     # https://mifos-products.pages.dev/mobile/field-officer/terms/
        open_mode: in_app                                       # LocalUrlLauncher.launchInApp (Custom Tabs / SFSafariViewController)
        style: { titleColor: primary, underline: true }
        a11y: { contentDescription: "Terms & Conditions - opens in the app", role: link }
        on_click:
          action: open_terms
          action_contract:
            effect: navigate
            library_refs: []
            scope: screen                                       # screen-level effect (onOpenTerms lambda), not a ViewModel action
            description: "Opens the hosted Field Officer App terms and conditions inside the app so the officer can read what signing in accepts."
            action_contract_author: "claude-via-idea-plan-add"
            action_contract_authored_at: "2026-11-05T06:30:00Z"
      - id: privacy_policy_link
        token: privacy
        span_text: "{strings.screens.signin.privacy_policy}"  # "Privacy Policy"
        arg_index: 2
        target_url: "AppPrivacyConfig.PRIVACY_POLICY_URL"       # https://mifos-products.pages.dev/mobile/field-officer/privacy/
        open_mode: in_app
        style: { titleColor: primary, underline: true }
        a11y: { contentDescription: "Privacy Policy - opens in the app", role: link }
        on_click:
          action: open_privacy_policy
          action_contract:
            effect: navigate
            library_refs: []
            scope: screen                                       # screen-level effect (onOpenPrivacyPolicy lambda)
            description: "Opens the hosted Mifos field officer privacy policy inside the app so the officer can read it before signing in."
            action_contract_author: "claude-via-idea-plan-add"
            action_contract_authored_at: "2026-11-05T06:30:00Z"
    replaces: '2026-11-04 plain text "By signing in you agree to our Terms of Service and Privacy Policy." (links were placeholders legal.terms_url / legal.privacy_url)'
    v1: >
      ABSENT IN v1 — flagged 2026-10-03 as the clearest professional omission. An app that collects
      credentials and transmits banking data states its terms at the point of collection. This is
      the one addition here that is a compliance expectation rather than a UX improvement.

  - id: progress_overlay
    type: progress_overlay
    source: "MifosProgressIndicatorOverlay — core/ui"
    label: "loading animation, no text"   # AppProgressIndicatorOverlay (core/ui) is a Lottie with no copy; a render invented a gateway status line
    renders_states: [submitting]
    modal: true
    dismissible: false

  - id: snackbar
    type: snackbar_host
    renders_states: [transport_error, offline]

# ──────────────── IMPLEMENTATION NOTES (binding on /implement) ────────────────
# Decisions taken 2026-10-03 that /implement MUST honour. Recorded here rather than hand-applied,
# because the generators are the sole writers of `feature/**` (RULE-IMPL-GENERATOR-DISPATCH-001).
implementation_notes:

  - id: feature-owns-its-navigation
    decision: >
      `feature/signin` owns its route, its `navigateToSignIn`, and its destination builder, in a
      `navigation` package — `feature/signin/src/commonMain/kotlin/kpt/feature/signin/navigation/`.
      `cmp-navigation` may INSTALL that destination on the root graph, but must not hold signin's
      wiring.
    current_defect: >
      The unauthenticated-graph composition currently lives in
      `cmp-navigation/.../auth/AuthNavigation.kt`, and signin's route sits at the feature's package
      root rather than in a `navigation` package. Both are wrong: the feature does not own its own
      graph entry, and the generator's `@FeatureDestination` scan is restricted to a `navigation`
      package, so a route outside it is invisible to codegen.
    constraint_do_not_break: >
      Sign-in MUST NOT be annotated `@FeatureDestination`. Verified 2026-10-03:
      `GeneratedFeatureDestinations` is invoked INSIDE `authenticatedGraph`
      (`AuthenticatedNavigation.kt:54`), so the annotation would register the unauthenticated gate
      onto the authenticated graph it exists to guard. The feature therefore exposes a plain
      `NavGraphBuilder` extension that the app shell installs deliberately on the ROOT graph.

  - id: drop-mifos-outlined-text-field
    decision: "v2 signin does NOT use `kpt.core.designsystem.component.MifosOutlinedTextField`."
    rationale: >
      It is legacy surface that carries accidental behaviour, and this screen has already paid for
      it twice in one session:

        · It ACCEPTS parameters it silently IGNORES — `keyboardOptions` and `visualTransformation`
          are both in the signature and both overridden internally. A caller reading the signature
          cannot predict the result.
        · It hardcoded `KeyboardCapitalization.Words` for every field built from it, which an IME
          applied to a case-sensitive Fineract username.
        · It derived password masking from whether the TOGGLE WAS DRAWN, so hiding the toggle
          printed the password in clear text.
        · Its screen-reader strings are hardcoded English with no override, so the toggle cannot be
          localised.
        · Four overloads with different parameter sets and different behaviour.

      Each was fixed in place, but the pattern is the point: a component whose behaviour is not
      legible from its signature keeps producing defects that only a device reveals.
    instead: >
      Compose Material3 `OutlinedTextField` directly, with every value resolved from
      `core/designsystem` tokens (`MaterialTheme.spacing.*` / `.colorScheme.*` / `.typography.*`)
      per RULE-IMPL-DESIGN-TOKEN-CONSUMPTION-001 — explicit, auditable, nothing hidden.
    scope: >
      This is a decision for THIS feature, not a deletion. Other features still consume the
      component and are out of scope here; the two fixes already applied to it stay. If v2's field
      treatment proves right, promoting it into `core/designsystem` as a clean replacement is a
      separate, deliberate piece of work.

# ──────────────── VISUAL ASSETS (RULE-SCREEN-VISUAL-ASSETS-001) ────────────────
visual_assets:
  - id: signin_brand_mark
    kind: logo
    role: brand
    intent: >
      A clean, flat, scalable Mifos-family brand mark that reads at 64dp on a tinted tile and in
      both light and dark theme. Replaces the v1 raster JPEG, whose baked-in white background shows
      as a hard rectangle against the tile and cannot invert for dark mode.
    # CORRECTED 2026-10-03. This read `/idea-feature-stitch-art`, which would have been REFUSED:
    # that command declines the brand/typographic role family by design, because a model asked for
    # a brand mark invents one, and an invented brand mark is a fake brand mark. `/idea-branding`
    # DERIVES it from the project's own shipped artwork instead.
    produced_by: /idea-branding
    status: produced
    asset: feature_signin_brand_mark          # feature/signin/.../drawable/feature_signin_brand_mark.png
    derived_from: "app-profile/icons/android/.../ic_launcher_foreground.webp (adaptive foreground, alpha-true)"
    provenance_sidecar: "feature_signin_brand_mark.gen.yaml"
    # ONE asset satisfies both declared states: the mark is transparent, so the tile's own
    # `secondaryContainer` token supplies the ground per theme. Two baked variants would need
    # hand-syncing and would drift.
    states: [light, dark]
    consistency: app-icon-family
    consistency_proof: "byte-derived from the shipped launcher icon, so it cannot drift from the home-screen icon"

# ──────────────── NAV BINDINGS ────────────────
graph_bindings:
  - { param: updateServerConfig, bound_to_component: instance_chip, target: serverConfig }
  - { param: navigateHome,       bound_to_state: success,           target: home }
  - param: navigatePasscode
    bound_to_state: passcode
    target: passcode
    status: dead_in_v1
    note: >
      v1 computed a `passcode` StateFlow, never read it, and the branch that would have used it is
      COMMENTED OUT — `onLoginSuccessful` assigned `HomeActivityIntent` unconditionally. Collapsing
      the two in the port therefore MATCHES v1's real behaviour. v2's biometric path is the modern
      answer to the need that dead passcode screen was reaching for.

# ──────────────── V1 DEFECTS THE PORT MUST NOT INHERIT ────────────────
v1_defects:
  - id: non-null-assertions-on-a-partial-response
    where: "LoginViewModel.onLoginSuccessful — userId!!, officeId!!, permissions!!"
    consequence: "three force-unwraps on a server response; a 200 missing any of them crashes at the moment of a SUCCESSFUL login"
    port_status: fixed
    locked_by: "AuthDtoContractTest (core/network)"
  - id: raw-password-persisted
    where: "LoginViewModel.onLoginSuccessful — User(password = password, …)"
    consequence: "a credential on disk for the life of the session, read by nothing"
    port_status: fixed
    locked_by: "theRawPasswordIsNeverPersisted"
  - id: username-field-auto-capitalised
    where: "shared MifosOutlinedTextField hardcoded KeyboardCapitalization.Words"
    consequence: "IME capitalises a case-sensitive Fineract username; invisible to `adb input text`"
    port_status: fixed
  - id: password-unmasked-when-toggle-hidden
    where: "shared MifosOutlinedTextField — mask derived from isPasswordToggleDisplayed"
    consequence: "password rendered in clear text exactly when the user is told it is wrong"
    port_status: fixed
    locked_by: "SignInScreenUiTest.anInvalidPasswordIsStillMasked (proven RED first)"
