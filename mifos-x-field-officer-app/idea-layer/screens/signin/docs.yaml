# Recorded because each was invisible to the layer above it.
migration_defects:
  - id: username-auto-capitalised
    where: "core/designsystem MifosOutlinedTextField hardcoded KeyboardCapitalization.Words"
    effect: "an IME capitalised a case-sensitive Fineract username; `fieldofficer` submitted as `Fieldofficer`"
    invisible_to: "automation — `adb shell input text` bypasses the IME entirely"
    status: FIXED
    reconfirmed_at: '2026-10-05'
    reconfirmed_how: "device capture shows `fieldofficer` lowercase after real IME entry"

  - id: password-unmasked-when-toggle-hidden
    where: "core/designsystem MifosOutlinedTextField derived masking from isPasswordToggleDisplayed"
    effect: "password rendered in CLEAR TEXT at the moment the user is told it is wrong"
    invisible_to: "unit tests — the state value is identical either way; only the rendering differs"
    status: FIXED
    locked_by: "SignInScreenUiTest.anInvalidPasswordIsStillMasked (proven RED before the fix)"
    found_by: on-device-capture

  - id: instance-chip-hidden-when-host-blank
    where: "SignInScreen.kt — `if (state.instanceHost.isNotBlank())` around the chip"
    effect: >
      The only route to server configuration disappeared exactly when no server was configured —
      the first-run case. Same class of defect as v1's blind button, wearing the opposite shape.
    invisible_to: "the device run — ServerConfig.DEFAULT is never blank, so the branch never fired there"
    found_by: "SignInScreenUiTest.theEmptyStateShowsEverythingAFirstRunUserNeeds (failed on the real default state)"
    status: FIXED
    fixed_at: '2026-10-05'
    note: "fixed at the source (render unconditionally, label the blank case) rather than by relaxing the assertion"

# ──────────────── KNOWN GAPS ────────────────
known_gaps:
  - id: chip-states-a-value-the-client-may-not-use
    severity: error
    surfaced_by: "the v2 instance chip"
    detail: >
      MEASURED 2026-10-05: no production code under `core/network` reads `ServerConfig`. The only
      non-test reader outside the settings screen is this screen, for display. The access point is a
      build-time constant, so EDITING the server configuration does not change where sign-in posts.
    why_it_matters_more_now: >
      v1's blind button hid this: it showed no value, so it could not contradict one. The chip asserts
      a specific host and tenant, which is TRUE for the shipped default — `ServerConfigAccessPointParityTest`
      pins `ServerConfig.DEFAULT` equal to the `mifos` access point on origin, path and tenant — and
      becomes FALSE the moment a user edits it. Making the value visible did not create the bug; it
      made an invisible one legible, which is the right trade, but the chip must not keep stating a
      value the client ignores.
    fix_belongs_in: "core/network — the access point must resolve from ServerConfig, not a build constant"
    tracked_in: "feature/settings/MIGRATION.md"

