schema_version: '3.1'
id: signin
name: Sign in
description: >
  Authenticates a field officer against the configured Fineract instance and establishes the session every other screen
  depends on. Surfaces WHICH instance it will authenticate against before the user types, and is the only route to the
  server-configuration screen, because a first-run user has no server URL and therefore cannot sign in until one is set.
  A pinned consent line — "By signing in you accept our Terms & Conditions and Privacy Policy." — links both documents
  in-app; signing in is the act of acceptance.
