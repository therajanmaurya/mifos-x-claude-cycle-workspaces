# RULE-IDEA-TESTERS-AUTOHEAL-001 sense, recorded with its blocker.
pending_device_verify:
  - state: biometric_ready
    component: biometric_action
    implemented: true
    covered_by:
      - SignInScreenUiTest.biometricUnlockIsOfferedOnlyWhenItCanActuallySucceed
      - SignInScreenUiTest.biometricUnlockRendersForAReturningOfficerAndIsWithdrawnOnLockout
      - SignInViewModelTest.aStoredSessionIsWhatMakesBiometricUnlockRelevant
    reason: >
      The state needs sign-in shown WITH a stored session — root state `UserLocked`. This app cannot
      currently reach it. Measured on device 2026-10-05: force-stop + relaunch with a stored session
      resolves to `UserUnlocked` and lands on home, never on sign-in. v1's passcode screen was the
      lock path and was already dead code there (see port_deviations.passcode-routing), so the port
      had nothing to carry over.
    blocked_by: "a product decision — ship a lock surface (passcode, or idle timeout)"
