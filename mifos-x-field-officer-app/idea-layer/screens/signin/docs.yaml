  - id: see-the-target-instance
    description: "Show the host and tenant this sign-in will hit, before the user types, and allow changing it."
    backed_by: "serverConfig feature + ServerConfig"
    v2: true
    status: shipped
    device_verified: '2026-10-05'
    caveat: "see known_gaps.chip-states-a-value-the-client-may-not-use"
  - id: unlock-with-biometrics
    description: "A returning officer with a stored session unlocks without retyping a password."
    backed_by: "core-base/security BiometricAuthenticator (android/ios/desktop/js actuals)"
    v2: true
    status: shipped-not-reachable
    note: "see pending_device_verify — implemented and tested; no lock surface to enter from"
  - id: throttle-repeated-failures
    description: "Warn as failures accumulate, then pause sign-in once the policy threshold is reached."
    backed_by: "a local counter mirroring core-base/security SecurityPolicy.lockAfterFailedAttempts"
    v2: true
    status: shipped
    device_verified: '2026-10-05'
    note: "see port_deviations.lockout-not-wired-to-tracker for why the shipped tracker is NOT used"
  - id: state-terms-at-point-of-collection
    description: >-
      Present terms and privacy adjacent to the action that collects the credential. Since 2026-11-05: "By signing in
      you accept our Terms & Conditions and Privacy Policy." — accept-by-continuing, the same rule as onboarding's
      agreement line — with both phrases as in-app links.
    backed_by: >-
      AppOrgLinks["terms"] (app-profile/app.yaml#org.links.terms → https://mifos-products.pages.dev/mobile/field-officer/terms/)
      + AppPrivacyConfig.PRIVACY_POLICY_URL, opened with LocalUrlLauncher.launchInApp (core-base/platform, cmp-open-url)
    v2: true
    status: shipped
    device_verified: '2026-11-05'

# ──────────────── SCREEN-LEVEL ACTIONS (not ViewModel) ────────────────
# The two consent links are lambdas on SignInScreen (onOpenTerms / onOpenPrivacyPolicy) wired to
# LocalUrlLauncher in the route; they change no ViewModel state.
screen_actions:
  - name: OpenTerms
    handles: [open_terms]
    effect: 'LocalUrlLauncher.launchInApp(AppOrgLinks["terms"])'
    error_handling:
      NoBrowserAvailable: launchInApp returning false leaves sign-in as it was, both fields unchanged
      LinkMissing: AppOrgLinks["terms"] is null only if app-profile drops org.links.terms — the span renders as plain text, never a dead link
  - name: OpenPrivacyPolicy
    handles: [open_privacy_policy]
    effect: "LocalUrlLauncher.launchInApp(AppPrivacyConfig.PRIVACY_POLICY_URL)"
    error_handling:
      NoBrowserAvailable: launchInApp returning false leaves sign-in as it was, both fields unchanged

decisions:
  - id: consent-accept-by-continuing
    decided_at: '2026-11-05'
    decision: >-
      The pinned consent line reads "By signing in you accept our Terms & Conditions and Privacy Policy." (was "By
      signing in you agree to our Terms of Service and Privacy Policy." as plain text). It is ONE Text with two
      LinkAnnotation spans, Terms & Conditions first: Terms & Conditions → AppOrgLinks["terms"], Privacy Policy →
      AppPrivacyConfig.PRIVACY_POLICY_URL, both in-app. Tests find each link by its text inside signin:consent.
    why: >-
      operator instruction 2026-11-05, verified on a device: signing in is the acceptance act, the same rule as the
      onboarding agreement line, and the document must be named exactly as published ("Terms & Conditions").

# ──────────────── PORT DEVIATIONS ────────────────
port_deviations:
  - id: passcode-routing
    original: "LoginUiState exposes HomeActivityIntent and PassCodeActivityIntent; the screen routes"
    shipped: "one LoggedIn event; RootNavViewModel decides home vs locked"
    why: >
      Re-measured 2026-10-02: v1 did NOT actually branch. It computes a `passcode` StateFlow, never
      reads it, and the branch is COMMENTED OUT, so PassCodeActivityIntent was unreachable.
      Collapsing the two matches v1's real behaviour. v2's biometric unlock is the modern answer to
      the need that dead passcode screen reached for — and inherits its missing entry point.
    status: CLOSED

  - id: validation-rules
    original: "UsernameValidationUseCase / PasswordValidationUseCase — suspend, Compose-coupled"
    shipped: "CredentialRules.username/password — pure, non-suspend, typed failures"
    why: "spec §2; thresholds preserved exactly (username >= 4, password >= 6)"
    status: CLOSED

  - id: offline-state
    original: "no offline branch — a failed call is indistinguishable from no signal"
    shipped: "MutationResult.Blocked(OFFLINE) renders a distinct offline message"
    why: "a field officer acts differently on 'wrong password' and 'no signal'"
    status: CLOSED

  - id: plaintext-password
    original: "User(password = password) — raw password persisted to preferences"
    shipped: "NOT persisted"
    status: CLOSED
    closed_at: '2026-10-02'
    why: >
      Measured: NOTHING reads `User.password`. Every consumer reads `username` or
      `base64EncodedAuthenticationKey`, and `authHeader` derives from the encoded key, which is what
      Fineract needs for subsequent Basic auth. Storing the password bought nothing and kept a
      credential on disk for the session's life. Locked by `theRawPasswordIsNeverPersisted`.

  - id: per-field-error-attribution
    original: "ShowValidationError(username_length, password_length) — BOTH messages whenever EITHER rule failed"
    shipped: "the offending field only; the clean field keeps its toggle and stays unmarked"
    status: CLOSED
    device_verified: '2026-10-03'

  - id: server-cta-becomes-an-instance-chip
    original: "a full-width filled button reading 'Update Server Configuration', in the bottom bar"
    shipped: "an AssistChip at the TOP stating `host · tenant`, with the bottom bar given to consent"
    status: CLOSED
    closed_at: '2026-10-05'
    why: >
      v1's button offered to change a setting without ever showing its current value, so a
      misconfigured instance looked exactly like a correct one. Information first, affordance second.
      Rendered UNCONDITIONALLY — an early v2 draft hid it while the host was blank, which inverted
      the intent by removing the only route to server configuration in precisely the first-run case
      that needs it. A blank host now reads "Set server" instead.

  - id: lockout-not-wired-to-tracker
    original: "no throttle of any kind"
    shipped: "a local `failedAttempts` counter in SignInState, locking at 5"
    status: CLOSED-BY-DESIGN
    closed_at: '2026-10-05'
    why: >
      `core-base/security` ships `FailedAttemptTracker`, which would be the obvious wiring — and it
      is deliberately NOT used. Its `recordFailure()` invokes `SecureWiper` at
      `wipeAfterFailedAttempts: 10`: irreversible local data destruction. Turning that on for a field
      officer who mistypes a password is a PRODUCT decision, not an implementation detail, so the
      screen implements the throttle half (`lockAfterFailedAttempts: 5`, mirrored exactly) and leaves
      the wipe half unarmed. The constant is named `LOCK_AFTER_ATTEMPTS` so the relationship is
      greppable when the policy becomes DI-injected.

