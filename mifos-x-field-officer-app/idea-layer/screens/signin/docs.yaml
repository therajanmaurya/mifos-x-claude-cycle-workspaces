# ──────────────── NAVIGATION ────────────────
entry_point: true          # the app's first interactive screen when signed out
bottom_nav: false
navigates_to: [serverConfig, home]

route:
  name: LoginRoute
  params: {}               # @Serializable object — no arguments, measured from AuthNavigation.kt

entry_points:
  - source: rootNav
    action: RootNavState.Auth | ShowOnboarding | UserLocked
    params: {}
    note: >
      Three distinct root states all resolve here. In the ORIGINAL the login screen decided between
      home and passcode itself (LoginUiState.HomeActivityIntent vs PassCodeActivityIntent); under
      the template the root state machine owns that decision and the screen emits one success
      signal. Recorded in port_deviations.

screens:
  - id: login
    name: LoginScreen
    viewmodel: LoginViewModel

# ──────────────── PORT DEVIATIONS (original → shipped) ────────────────
# Facts, not judgements. Each was decided during S1 and is recorded here so the idea-layer does not
# quietly assert the original's behaviour for a screen that no longer behaves that way.
port_deviations:
  - id: passcode-routing
    original: "LoginUiState exposes HomeActivityIntent and PassCodeActivityIntent; the screen routes"
    shipped: "one LoggedIn event; RootNavViewModel decides home vs locked"
    why: "a second source of that decision would diverge from the root state machine"
  - id: validation-rules
    original: "UsernameValidationUseCase / PasswordValidationUseCase — suspend, Compose-coupled"
    shipped: "CredentialRules.username/password — pure, non-suspend, typed failures"
    why: "spec §2; thresholds preserved exactly (username >= 4, password >= 6)"
  - id: offline-state
    original: "no offline branch — a failed call is indistinguishable from no signal"
    shipped: "MutationResult.Blocked(OFFLINE) renders a distinct offline message"
    why: "a field officer acts differently on 'wrong password' and 'no signal'"
  - id: plaintext-password
    original: "User(password = password) — raw password persisted to preferences"
    shipped: "UNCHANGED — still persisted"
    status: OPEN
    why: >
      Flagged in S1's ledger as requiring a written justification or removal, and never closed.
      base64EncodedAuthenticationKey is persisted alongside it and is what Fineract needs for
      subsequent Basic auth, which suggests the raw password is redundant. Carried here as an OPEN
      item so the import does not launder it into "intended behaviour".

# ──────────────── EXTRACTION FINDINGS ────────────────
# Recorded rather than fixed: two user-visible strings are literals in the ORIGINAL LoginScreen.kt
# while nine siblings are resourced. RULE-IMPL-NO-HARDCODED-STRING-001 would reject these on a
# fresh implement.
source_findings:
  hardcoded_strings:
    - value: "Update Server Configuration"
      at: "LoginScreen.kt:154"
    - value: "Login"
      at: "LoginScreen.kt:245"

owned_strings:
