  - feature_auth_enter_credentials
  - feature_auth_username
  - feature_auth_password
  - feature_auth_error_enter_credentials
  - feature_auth_error_username_length
  - feature_auth_error_password_length
  - feature_auth_error_not_connected_internet
  - feature_auth_error_login_failed

platform_capabilities:
  - path: feature/auth/src/androidMain/AndroidManifest.xml
    classification: manifest-only
    note: "no platform Kotlin — the feature is pure commonMain (spec §3a compliant as-is)"
