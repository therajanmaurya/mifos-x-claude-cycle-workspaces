schema_version: "3.1"
id: signin
name: Sign in
description: >
  Authenticates a field officer against the configured Fineract instance and establishes the
  session every other screen depends on. Also the only route to the server-configuration screen,
  because a first-run user has no server URL and therefore cannot sign in until one is set.
feature: signin
flow: entry
version: "1.0"
tags: [mvp, core, P0, entry]

# ──────────────── MODULE PIN (RULE-KMP-FEATURE-MODULE-PATH-001) ────────────────
# The idea-layer feature is `signin`; the Kotlin module it owns is `feature/auth`. Without this pin
# codegen resolves `signin` → `feature/signin`, scaffolds a second module beside the real one and
# manufactures the G-IMPL-DUP defect while faithfully following the naming. The operator pin is the
# sanctioned disambiguation — mirrored in idea-plan.yaml#feature_module_paths.
module_path: feature/auth

# ──────────────── PROVENANCE (what makes this an IMPORT) ────────────────
# Every claim below is traceable to a file at this ref. Verify any of it with
#   git show 6b66e8a43:<path>
provenance:
  imported_from: "6b66e8a43"
  imported_at: "2026-10-02"
  imported_by: "/idea-feature-import"
  extraction: complete
  source_files:
    - feature/auth/src/commonMain/kotlin/com/mifos/feature/auth/login/LoginScreen.kt
    - feature/auth/src/commonMain/kotlin/com/mifos/feature/auth/login/LoginUiState.kt
    - feature/auth/src/commonMain/kotlin/com/mifos/feature/auth/login/LoginViewModel.kt
    - feature/auth/src/commonMain/kotlin/com/mifos/feature/auth/navigation/AuthNavigation.kt   # registering graph — supplies on_click targets
    - feature/auth/src/commonMain/kotlin/com/mifos/feature/auth/di/AuthModule.kt
    - feature/auth/src/commonMain/composeResources/values/strings.xml
  also_reflects_port:
    ref: "working-tree"
    reason: >
      The feature was hand-ported in S1 and device-verified 2026-10-02. Per the migration spec §7.4
      an audited port is NOT regenerated, so this docset is reconciled against the SHIPPED source as
      well as the original. Where the two differ, the difference is recorded under
      `port_deviations` rather than silently resolved.
    files:
      - feature/auth/src/commonMain/kotlin/kpt/feature/auth/LoginScreen.kt
      - feature/auth/src/commonMain/kotlin/kpt/feature/auth/LoginViewModel.kt
      - feature/auth/src/commonMain/kotlin/kpt/feature/auth/LoginRoute.kt

