    assetPath: idea-layer/store-assets/09-feature-graphic-hero.html
    ground_image: idea-layer/stitch/store_ref_feature_banner.png   # WIDE 2:1 reference for the 1024×500 banner
    copy:
      en:
        eyebrow: Mifos X Field Officer
        title: Microfinance work, in the field.
        subtitle: Clients, loans and collections on your Mifos X server.
        tags:
          - Mifos X
          - Field work
  - order: 10
    screen: feature-graphic
    state: centered
    source: stitch
    theme: field
    frame: feature-graphic
    variant: centered
    hero_screen: offlineSync
