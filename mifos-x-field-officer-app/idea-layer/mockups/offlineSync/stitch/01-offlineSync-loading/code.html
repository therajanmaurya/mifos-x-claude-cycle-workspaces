  <script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            appBackground: "#FAFAFB",
            appSurface: "#FFFFFF",
            onSurface: "#0F172A",
            onSurfaceVariant: "#475569",
            shimmerBase: "#E2E8F0",
            shimmerHighlight: "#F1F5F9",
            outlineVariant: "#CBD5E1"
          },
          fontFamily: {
            sans: ["Public Sans", "sans-serif"]
          },
          borderRadius: {
            'card': '16px',
            'avatar': '12px'
          }
        }
      }
    }
  </script>
  <style>
    @keyframes shimmerAnim {
      0% {
        background-position: -200% 0;
      }
      100% {
        background-position: 200% 0;
      }
    }
    .skeleton-shimmer {
      background: linear-gradient(90deg, #E2E8F0 0%, #F1F5F9 50%, #E2E8F0 100%);
      background-size: 200% 100%;
      animation: shimmerAnim 1.8s infinite ease-in-out;
    }
    @media (prefers-reduced-motion: reduce) {
      .skeleton-shimmer {
        animation: none;
        background: #E2E8F0;
      }
    }
  </style>
</head>
<body class="bg-appBackground text-onSurface font-sans antialiased min-h-screen flex flex-col selection:bg-slate-200">

  <!-- Component 1 - Top App Bar (64dp tall, full width, background #FAFAFB) -->
  <header class="w-full h-16 bg-appBackground border-b border-outlineVariant sticky top-0 z-30 flex items-center px-4 md:px-6">
    <div class="w-full flex items-center gap-3 max-w-[1200px] mx-auto">
      <button type="button" aria-label="Navigate back" class="w-10 h-10 -ml-1 flex items-center justify-center rounded-full text-onSurfaceVariant hover:bg-slate-200/60 active:bg-slate-300/60 transition-colors duration-150">
        <span class="material-symbols-outlined text-[24px]">arrow_back</span>
      </button>
      <h1 class="text-xl font-semibold tracking-tight text-onSurface">Offline sync</h1>
    </div>
  </header>

  <!-- Responsive Layout Container -->
  <!-- Compact (<600dp): 1 column, stacked summary over list, 16dp insets -->
  <!-- Medium (600-840dp): 2 columns, left ~360dp summary, right flexible list, 24dp gutter -->
  <!-- Expanded (>=840dp): Centred in max 1200dp, left 400dp, right flexible -->
  <main class="w-full flex-1 px-4 py-4 md:px-6 md:py-6 lg:px-8">
    <div class="w-full max-w-[1200px] mx-auto grid grid-cols-1 md:grid-cols-[360px_1fr] lg:grid-cols-[400px_1fr] gap-4 md:gap-6 items-start">

      <!-- Component 2 - Summary Skeleton Card -->
      <section aria-label="Summary skeleton" class="bg-appSurface rounded-card border border-outlineVariant p-4 shadow-none w-full">
        <!-- Two pill shimmer chips (84dp and 96dp wide, 32dp tall) -->
        <div class="flex items-center gap-2 mb-4">
          <div class="h-8 w-[84px] rounded-full skeleton-shimmer shrink-0"></div>
          <div class="h-8 w-[96px] rounded-full skeleton-shimmer shrink-0"></div>
        </div>

        <!-- Row of three equal 70dp shimmer tiles -->
        <div class="grid grid-cols-3 gap-2.5 mb-4">
          <div class="h-[70px] rounded-xl skeleton-shimmer w-full"></div>
          <div class="h-[70px] rounded-xl skeleton-shimmer w-full"></div>
          <div class="h-[70px] rounded-xl skeleton-shimmer w-full"></div>
        </div>

        <!-- One text-line shimmer at about half width -->
        <div class="mb-5">
          <div class="h-4 w-1/2 rounded-md skeleton-shimmer"></div>
        </div>

        <!-- Full-width 48dp pill shimmer where the sync button will be -->
        <div class="w-full">
          <div class="h-12 w-full rounded-full skeleton-shimmer"></div>
        </div>
      </section>

      <!-- Component 3 - List Skeleton Card (list_screen archetype skeleton) -->
      <section aria-label="Cached records skeleton list" class="bg-appSurface rounded-card border border-outlineVariant p-4 shadow-none w-full">
        <!-- Heading shimmer at a third of the width -->
        <div class="mb-4">
          <div class="h-5 w-1/3 rounded-md skeleton-shimmer"></div>
        </div>

        <!-- Three 36dp shimmer tabs side by side -->
        <div class="flex items-center gap-2 pb-4 border-b border-outlineVariant">
          <div class="h-9 w-24 rounded-lg skeleton-shimmer"></div>
          <div class="h-9 w-24 rounded-lg skeleton-shimmer"></div>
          <div class="h-9 w-24 rounded-lg skeleton-shimmer"></div>
        </div>

        <!-- Three divided rows -->
        <div class="divide-y divide-outlineVariant">
          <!-- Row 1 -->
          <div class="py-3.5 flex items-center gap-3.5 first:pt-4 last:pb-1">
            <div class="w-10 h-10 rounded-avatar skeleton-shimmer shrink-0"></div>
            <div class="flex-1 min-w-0 space-y-2">
              <div class="h-3.5 w-3/4 rounded skeleton-shimmer"></div>
              <div class="h-3 w-1/2 rounded skeleton-shimmer"></div>
              <div class="h-2.5 w-1/3 rounded skeleton-shimmer"></div>
            </div>
          </div>

          <!-- Row 2 -->
          <div class="py-3.5 flex items-center gap-3.5">
            <div class="w-10 h-10 rounded-avatar skeleton-shimmer shrink-0"></div>
            <div class="flex-1 min-w-0 space-y-2">
              <div class="h-3.5 w-2/3 rounded skeleton-shimmer"></div>
              <div class="h-3 w-2/5 rounded skeleton-shimmer"></div>
              <div class="h-2.5 w-1/4 rounded skeleton-shimmer"></div>
            </div>
          </div>

          <!-- Row 3 -->
          <div class="py-3.5 flex items-center gap-3.5 last:pb-1">
            <div class="w-10 h-10 rounded-avatar skeleton-shimmer shrink-0"></div>
            <div class="flex-1 min-w-0 space-y-2">
              <div class="h-3.5 w-4/5 rounded skeleton-shimmer"></div>
              <div class="h-3 w-3/5 rounded skeleton-shimmer"></div>
              <div class="h-2.5 w-1/3 rounded skeleton-shimmer"></div>
            </div>
          </div>
        </div>
      </section>

    </div>
  </main>

</body>
</html>
