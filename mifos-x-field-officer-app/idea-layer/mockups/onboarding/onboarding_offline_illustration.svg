<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Soft shadow filter for focal items -->
    <filter id="softFieldShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#4338CA" flood-opacity="0.09"/>
    </filter>
    <filter id="subtleFloatShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4338CA" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- 1. BASE CANVAS & GENEROUS MARGINS (#F8FAFC) -->
  <rect width="800" height="600" fill="#F8FAFC"/>

  <!-- 2. AMBIENT ATMOSPHERE & MORNING SKY -->
  <!-- Peaceful atmospheric aura disc (#E0E7FF) -->
  <circle cx="260" cy="180" r="145" fill="#E0E7FF" opacity="0.6"/>
  <circle cx="260" cy="180" r="85" fill="#F8FAFC"/>

  <!-- Distant gentle birds in upward hopeful flight (#4338CA with low opacity) -->
  <g fill="none" stroke="#4338CA" stroke-width="2.5" stroke-linecap="round" opacity="0.35">
    <path d="M 180 125 Q 188 116 196 125 Q 204 116 212 125"/>
    <path d="M 220 145 Q 226 138 232 145 Q 238 138 244 145"/>
    <path d="M 145 155 Q 151 148 157 155 Q 163 148 169 155"/>
  </g>

  <!-- 3. ROLLING RURAL LANDSCAPE & TERRACED HILLS -->
  <!-- Back rolling ridge (#E0E7FF) -->
  <path d="M 0 350 Q 210 290 460 325 Q 670 355 800 310 L 800 600 L 0 600 Z" fill="#E0E7FF" opacity="0.5"/>
  <!-- Middle agricultural hill curve (#E0E7FF full & emerald tint) -->
  <path d="M 0 390 Q 280 340 550 375 Q 690 395 800 365 L 800 600 L 0 600 Z" fill="#E0E7FF" opacity="0.85"/>
  <!-- Rich foreground terrace slope in emerald (#059669) -->
  <path d="M 0 430 Q 230 380 490 410 Q 660 425 800 400 L 800 600 L 0 600 Z" fill="#059669" opacity="0.16"/>

  <!-- Stylized agricultural contours across the hillside (#059669 lines) -->
  <g fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" opacity="0.25">
    <path d="M 40 405 Q 180 375 330 390"/>
    <path d="M 70 425 Q 220 395 380 410"/>
    <path d="M 480 390 Q 610 398 740 380"/>
  </g>

  <!-- Distant village shelter & tree copse on the left horizon -->
  <g id="distant-trees" opacity="0.6">
    <circle cx="110" cy="355" r="22" fill="#059669"/>
    <circle cx="132" cy="348" r="16" fill="#059669" opacity="0.8"/>
    <circle cx="92" cy="360" r="14" fill="#059669" opacity="0.9"/>
    <rect x="108" y="365" width="4" height="15" fill="#D97706"/>

    <!-- Small rural cottage/canopy motif -->
    <rect x="150" y="360" width="28" height="18" rx="2" fill="#F8FAFC" stroke="#E0E7FF" stroke-width="1.5"/>
    <polygon points="146,360 164,345 182,360" fill="#4338CA"/>
    <rect x="160" y="367" width="7" height="11" rx="1" fill="#4338CA"/>
  </g>

  <!-- Majestic roadside village shade tree on right midground -->
  <g id="roadside-tree">
    <!-- Trunk in warm amber #D97706 -->
    <path d="M 670 450 C 673 400 668 340 655 295 C 665 288 685 288 696 295 C 685 340 688 400 695 450 Z" fill="#D97706"/>
    <!-- Deep trunk shadow contour -->
    <path d="M 677 450 C 680 400 677 345 668 310 C 674 306 684 306 688 312 C 680 348 682 400 689 450 Z" fill="#4338CA" opacity="0.22"/>
    
    <!-- Protective branching canopy in layered geometric emerald (#059669) -->
    <circle cx="615" cy="245" r="55" fill="#059669" opacity="0.9"/>
    <circle cx="675" cy="205" r="70" fill="#059669"/>
    <circle cx="740" cy="235" r="55" fill="#059669" opacity="0.95"/>
    <circle cx="690" cy="180" r="50" fill="#059669"/>

    <!-- Soft highlight canopy petals (#E0E7FF tint) -->
    <path d="M 635 220 Q 675 180 720 195 Q 730 230 680 245 Z" fill="#E0E7FF" opacity="0.28"/>
    <circle cx="700" cy="225" r="24" fill="#E0E7FF" opacity="0.22"/>
  </g>

  <!-- 4. THE WINDING RURAL ROAD -->
  <!-- Sweeping tranquil earthen road leading from distance toward foreground left-to-center -->
  <path d="M 230 375
           C 280 410, 360 425, 420 445
           C 510 475, 490 510, 440 540
           C 390 570, 300 580, 220 600
           L 360 600
           C 470 580, 570 550, 600 515
           C 640 470, 560 445, 480 425
           C 420 410, 350 395, 290 375 Z"
        fill="#E0E7FF"/>

  <!-- Road earthen edge rim / warm contour line in Amber (#D97706) -->
  <path d="M 230 375 C 280 410, 360 425, 420 445 C 510 475, 490 510, 440 540 C 390 570, 300 580, 220 600"
        fill="none" stroke="#D97706" stroke-width="4.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M 290 375 C 350 395, 420 410, 480 425 C 560 445, 640 470, 600 515 C 570 550, 470 580, 360 600"
        fill="none" stroke="#D97706" stroke-width="3" stroke-linecap="round" opacity="0.35"/>

  <!-- Road path center dashes / texture segments (#F8FAFC) -->
  <g fill="none" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <path d="M 260 388 Q 285 400 310 408"/>
    <path d="M 350 422 Q 385 435 415 448"/>
    <path d="M 455 470 Q 485 490 500 512"/>
    <path d="M 480 535 Q 450 555 410 572"/>
    <path d="M 360 585 Q 320 594 280 600"/>
  </g>

  <!-- Mile marker / rural milestone stone along road in #F8FAFC & #4338CA -->
  <g transform="translate(485, 435)" filter="url(#softFieldShadow)">
    <rect x="0" y="0" width="16" height="24" rx="4" fill="#F8FAFC" stroke="#E0E7FF" stroke-width="1.5"/>
    <circle cx="8" cy="8" r="3.5" fill="#4338CA"/>
    <rect x="4" y="14" width="8" height="2" rx="1" fill="#059669"/>
  </g>

  <!-- 5. HERO FOREGROUND ARTIFACT: SMARTPHONE WITH OPEN CLIENT RECORDS & NO SIGNAL -->
  <!-- Generously proportioned, placed comfortably on the left/center foreground -->
  <g id="hero-phone-group" transform="translate(190, 160)" filter="url(#subtleFloatShadow)">
    <!-- Base shadow cushion on ground -->
    <ellipse cx="110" cy="385" rx="105" ry="18" fill="#4338CA" opacity="0.14"/>

    <!-- Phone Chassis in Indigo (#4338CA) -->
    <rect x="0" y="0" width="220" height="370" rx="36" fill="#4338CA" stroke="#E0E7FF" stroke-width="2.5"/>

    <!-- Screen Bezel Outer Ring in Light Tone (#E0E7FF) -->
    <rect x="6" y="6" width="208" height="358" rx="30" fill="#F8FAFC"/>

    <!-- Top Speaker Ear-piece Notch -->
    <rect x="75" y="14" width="70" height="6" rx="3" fill="#4338CA"/>

    <!-- Status Bar Area (NO APPS/CHROME, purely self-contained signal & system status) -->
    <!-- Signal Indicator on Upper-Right: 4 hollow bars + bold calm X / crossout (NO RED, strictly #D97706 or #4338CA) -->
    <g id="no-signal-indicator" transform="translate(152, 28)">
      <!-- 4 Signal Bar Outlines in soft Lavender (#E0E7FF) -->
      <rect x="0" y="11" width="3.5" height="5" rx="1" fill="#E0E7FF"/>
      <rect x="6" y="8" width="3.5" height="8" rx="1" fill="#E0E7FF"/>
      <rect x="12" y="5" width="3.5" height="11" rx="1" fill="#E0E7FF"/>
      <rect x="18" y="2" width="3.5" height="14" rx="1" fill="#E0E7FF"/>
      <!-- Soft Amber strike line indicating disconnected / searching (#D97706) -->
      <line x1="-3" y1="18" x2="25" y2="1" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Mini circular amber status beacon -->
      <circle cx="28" cy="14" r="3.5" fill="#D97706"/>
    </g>

    <!-- Signal-search decorative pill badge on upper left -->
    <g transform="translate(20, 26)">
      <rect x="0" y="0" width="34" height="9" rx="4.5" fill="#E0E7FF"/>
      <circle cx="6" cy="4.5" r="2.5" fill="#4338CA"/>
      <rect x="12" y="3" width="16" height="3" rx="1.5" fill="#4338CA" opacity="0.6"/>
    </g>

    <!-- Internal Screen Header Card / Vault Banner (Indigo #4338CA) -->
    <g transform="translate(16, 48)">
      <rect x="0" y="0" width="188" height="42" rx="12" fill="#4338CA"/>
      
      <!-- Protected Vault Emblem Icon inside header -->
      <circle cx="22" cy="21" r="11" fill="#E0E7FF"/>
      <path d="M 18 21 L 21 24 L 27 18" fill="none" stroke="#4338CA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Abstract header title lines -->
      <rect x="40" y="14" width="75" height="6.5" rx="3" fill="#F8FAFC"/>
      <rect x="40" y="24" width="45" height="4.5" rx="2" fill="#E0E7FF" opacity="0.8"/>

      <!-- Reassuring Offline Shield Badge in Emerald (#059669) -->
      <g transform="translate(132, 10)">
        <rect x="0" y="0" width="46" height="22" rx="11" fill="#059669"/>
        <circle cx="11" cy="11" r="3.5" fill="#F8FAFC"/>
        <path d="M 9.5 11 L 10.5 12 L 12.5 10" fill="none" stroke="#059669" stroke-width="1" stroke-linecap="round"/>
        <rect x="18" y="9" width="20" height="4" rx="2" fill="#F8FAFC"/>
      </g>
    </g>

    <!-- LOCAL OFFLINE ACTIVE NOTIFICATION BANNER (Emerald #059669 Tint) -->
    <g transform="translate(16, 98)">
      <rect x="0" y="0" width="188" height="32" rx="8" fill="#E0E7FF" stroke="#059669" stroke-width="1.2" opacity="0.9"/>
      <!-- Small shield-check glyph in #059669 -->
      <circle cx="16" cy="16" r="8" fill="#059669"/>
      <path d="M 13 16 L 15 18 L 19 14" fill="none" stroke="#F8FAFC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Reassuring summary line bars -->
      <rect x="32" y="11" width="95" height="5" rx="2" fill="#4338CA"/>
      <rect x="32" y="19" width="60" height="3.5" rx="1.5" fill="#059669"/>
      <!-- Safe lock icon on right -->
      <rect x="160" y="11" width="14" height="10" rx="2" fill="#4338CA"/>
      <path d="M 163 11 L 163 8 Q 167 5 171 8 L 171 11" fill="none" stroke="#4338CA" stroke-width="1.5"/>
    </g>

    <!-- RECORD ROW 1 (Client Loan Portfolio Card - Emerald Verified) -->
    <g transform="translate(16, 138)" filter="url(#softFieldShadow)">
      <rect x="0" y="0" width="188" height="54" rx="10" fill="#F8FAFC" stroke="#E0E7FF" stroke-width="1.5"/>
      <!-- Client avatar circle in Indigo #E0E7FF & #4338CA -->
      <circle cx="24" cy="27" r="14" fill="#E0E7FF"/>
      <circle cx="24" cy="22" r="5" fill="#4338CA"/>
      <path d="M 15 34 Q 24 29 33 34" fill="none" stroke="#4338CA" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Client Name & Account bars -->
      <rect x="46" y="15" width="70" height="6.5" rx="2" fill="#4338CA"/>
      <rect x="46" y="26" width="50" height="4.5" rx="2" fill="#4338CA" opacity="0.6"/>
      <rect x="46" y="34" width="35" height="4" rx="2" fill="#D97706"/>

      <!-- Verified emerald badge (Saved safely on device) -->
      <rect x="136" y="18" width="40" height="18" rx="9" fill="#059669"/>
      <path d="M 148 27 L 152 31 L 163 21" fill="none" stroke="#F8FAFC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- RECORD ROW 2 (Community Group Center Repayment - Amber In-Progress) -->
    <g transform="translate(16, 200)" filter="url(#softFieldShadow)">
      <rect x="0" y="0" width="188" height="54" rx="10" fill="#F8FAFC" stroke="#E0E7FF" stroke-width="1.5"/>
      <!-- Group avatar circle in Amber (#D97706) -->
      <circle cx="24" cy="27" r="14" fill="#E0E7FF"/>
      <circle cx="20" cy="23" r="3.5" fill="#D97706"/>
      <circle cx="28" cy="23" r="3.5" fill="#D97706"/>
      <path d="M 16 34 Q 24 29 32 34" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>

      <!-- Group Name & Repayment progress bars -->
      <rect x="46" y="15" width="62" height="6.5" rx="2" fill="#4338CA"/>
      <rect x="46" y="26" width="75" height="4.5" rx="2" fill="#4338CA" opacity="0.6"/>
      <rect x="46" y="34" width="45" height="4" rx="2" fill="#059669"/>

      <!-- Local Cache Tag in warm Amber (#D97706) -->
      <rect x="136" y="18" width="40" height="18" rx="9" fill="#D97706"/>
      <circle cx="148" cy="27" r="3" fill="#F8FAFC"/>
      <rect x="154" y="25" width="14" height="4" rx="2" fill="#F8FAFC"/>
    </g>

    <!-- RECORD ROW 3 (Savings Ledger Account) -->
    <g transform="translate(16, 262)">
      <rect x="0" y="0" width="188" height="48" rx="10" fill="#F8FAFC" stroke="#E0E7FF" stroke-width="1.5"/>
      <!-- Icon emblem -->
      <circle cx="24" cy="24" r="12" fill="#E0E7FF"/>
      <rect x="18" y="19" width="12" height="10" rx="2" fill="#4338CA"/>
      <circle cx="24" cy="24" r="2" fill="#F8FAFC"/>

      <rect x="46" y="16" width="55" height="5.5" rx="2" fill="#4338CA"/>
      <rect x="46" y="26" width="40" height="4" rx="2" fill="#059669"/>

      <!-- Check pill -->
      <circle cx="160" cy="24" r="8" fill="#059669"/>
      <path d="M 157 24 L 159 26 L 163 22" fill="none" stroke="#F8FAFC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Bottom Home Indicator Bar in Indigo (#4338CA) -->
    <rect x="75" y="352" width="70" height="4" rx="2" fill="#4338CA" opacity="0.7"/>
  </g>

  <!-- 6. THE PROMINENT FLOATING SYNC CLOUD (WAITING FOR CONNECTION BACK) -->
  <!-- Positioned dynamically and joyfully to the right of the smartphone, floating over the winding path -->
  <g id="floating-sync-cloud-emblem" transform="translate(420, 240)" filter="url(#subtleFloatShadow)">
    <!-- Cast ground shadow on road below -->
    <ellipse cx="65" cy="180" rx="55" ry="12" fill="#4338CA" opacity="0.12"/>

    <!-- Reassuring Concentric Signal Resonance Waves (Calmly radiating outward) -->
    <circle cx="65" cy="65" r="80" fill="none" stroke="#E0E7FF" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.8"/>
    <circle cx="65" cy="65" r="66" fill="none" stroke="#059669" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.5"/>

    <!-- Primary Emblem Circle (#4338CA Base with Pure #F8FAFC Border) -->
    <circle cx="65" cy="65" r="56" fill="#F8FAFC"/>
    <circle cx="65" cy="65" r="50" fill="#4338CA"/>

    <!-- Soft Cloud Geometry inside emblem (#E0E7FF fill with clean vector shape) -->
    <g id="cloud-shape" transform="translate(25, 25)">
      <!-- Cloud Body (#F8FAFC with soft opacity and clean crisp outline) -->
      <path d="M 24 55
               L 56 55
               A 14 14 0 0 0 58 27
               A 20 20 0 0 0 24 23
               A 16 16 0 0 0 14 43
               A 12 12 0 0 0 24 55 Z"
            fill="#F8FAFC" opacity="0.95"/>

      <!-- Circular Sync Arrow (Waiting / Ready to Sync) in Emerald #059669 & Indigo #4338CA -->
      <!-- Top Arc Arrow rotating clockwise -->
      <path d="M 40 24 A 16 16 0 0 1 54 38" fill="none" stroke="#059669" stroke-width="4.5" stroke-linecap="round"/>
      <polygon points="56,31 56,43 45,39" fill="#059669"/>

      <!-- Bottom Arc Arrow rotating clockwise -->
      <path d="M 40 54 A 16 16 0 0 1 26 40" fill="none" stroke="#059669" stroke-width="4.5" stroke-linecap="round"/>
      <polygon points="24,47 24,35 35,39" fill="#059669"/>

      <!-- Center reassuring pulse node (#D97706) -->
      <circle cx="40" cy="39" r="4.5" fill="#D97706"/>
    </g>

    <!-- Amber Badge: Records waiting to upload (#D97706 with 3-dot queued sync indicator) -->
    <g transform="translate(98, 20)">
      <circle cx="15" cy="15" r="15" fill="#D97706" stroke="#F8FAFC" stroke-width="2.5"/>
      <!-- Three friendly queued synchronization dots (#F8FAFC) -->
      <circle cx="9" cy="15" r="2.2" fill="#F8FAFC"/>
      <circle cx="15" cy="15" r="2.2" fill="#F8FAFC"/>
      <circle cx="21" cy="15" r="2.2" fill="#F8FAFC"/>
    </g>

    <!-- Upward floating reconnection beamlets / signal sparks (Friendly, optimistic) -->
    <g fill="#059669" opacity="0.8">
      <circle cx="65" cy="-8" r="3"/>
      <circle cx="82" cy="-2" r="2"/>
      <circle cx="50" cy="-4" r="2"/>
    </g>
  </g>

  <!-- 7. REASSURING AMBIENT VECTOR PARTICLES & MOTES OF LIGHT -->
  <!-- Gentle, optimistic floating motes around the composition (#059669, #D97706, #E0E7FF) -->
  <g id="ambient-motes" opacity="0.65">
    <circle cx="140" cy="220" r="3" fill="#059669"/>
    <circle cx="160" cy="170" r="2" fill="#D97706"/>
    <circle cx="430" cy="150" r="3.5" fill="#E0E7FF"/>
    <circle cx="470" cy="190" r="2" fill="#059669"/>
    <circle cx="600" cy="310" r="3" fill="#D97706"/>
    <circle cx="620" cy="340" r="2" fill="#E0E7FF"/>
    <circle cx="390" cy="490" r="2.5" fill="#059669"/>
    <circle cx="180" cy="510" r="3" fill="#E0E7FF"/>
  </g>

  <!-- 8. FOREGROUND PRAIRIE FLORA & BOTANICAL ACCENTS -->
  <!-- Anchoring bottom corners with friendly botanical leaves (#059669 & #E0E7FF) -->
  <!-- Left Corner Foliage -->
  <g id="botanical-left">
    <path d="M 50 600 Q 70 540 100 535 Q 85 565 80 600" fill="#059669"/>
    <path d="M 80 600 Q 105 545 135 542 Q 115 570 110 600" fill="#059669" opacity="0.75"/>
    <circle cx="100" cy="535" r="4" fill="#D97706"/>
    <path d="M 140 600 Q 155 560 175 558 Q 160 580 155 600" fill="#059669" opacity="0.9"/>

    <!-- Soft rolling foreground rim (#E0E7FF) -->
    <path d="M 0 575 Q 120 545 230 580 L 230 600 L 0 600 Z" fill="#E0E7FF" opacity="0.3"/>
  </g>

  <!-- Right Corner Foliage -->
  <g id="botanical-right">
    <path d="M 750 600 Q 730 540 700 535 Q 715 565 720 600" fill="#059669"/>
    <path d="M 720 600 Q 695 545 665 542 Q 685 570 690 600" fill="#059669" opacity="0.75"/>
    <circle cx="700" cy="535" r="4" fill="#D97706"/>
    <path d="M 660 600 Q 645 560 625 558 Q 640 580 645 600" fill="#059669" opacity="0.9"/>
  </g>
</svg>