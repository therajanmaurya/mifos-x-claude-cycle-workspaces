<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Soft shadow filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4338CA" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Canvas Background #F8FAFC with generous margins -->
  <rect width="800" height="600" fill="#F8FAFC"/>

  <!-- Main Artboard Enclosure / Horizon Field (4:3 composition with generous margins) -->
  <!-- Ambient sky / peaceful morning atmosphere backdrop -->
  <rect x="40" y="30" width="720" height="540" rx="28" fill="#F8FAFC"/>
  
  <!-- Subtle Soft Sky Aura Ring -->
  <circle cx="590" cy="180" r="130" fill="#E0E7FF" opacity="0.6"/>
  <circle cx="590" cy="180" r="70" fill="#F8FAFC"/>

  <!-- Rolling Background Hills (Flat curved geometric horizons) -->
  <path d="M 40 380 Q 220 330 460 360 Q 640 385 760 340 L 760 570 L 40 570 Z" fill="#E0E7FF" opacity="0.5"/>
  <path d="M 40 420 Q 300 370 560 410 Q 680 430 760 395 L 760 570 L 40 570 Z" fill="#E0E7FF"/>
  <path d="M 40 455 Q 260 415 520 440 Q 660 455 760 435 L 760 570 L 40 570 Z" fill="#059669" opacity="0.15"/>

  <!-- ================= BACKGROUND: VILLAGE CENTRE BUILDING ================= -->
  <g transform="translate(510, 270)" filter="url(#softShadow)">
    <!-- Distant trees framing the building -->
    <circle cx="160" cy="50" r="32" fill="#059669" opacity="0.3"/>
    <circle cx="185" cy="60" r="24" fill="#059669" opacity="0.4"/>
    <circle cx="-15" cy="65" r="26" fill="#059669" opacity="0.3"/>

    <!-- Centre Building Base / Walls -->
    <rect x="15" y="55" width="130" height="85" rx="4" fill="#F8FAFC" stroke="#E0E7FF" stroke-width="2"/>
    
    <!-- Sloped Roof in Indigo #4338CA -->
    <polygon points="5,58 80,18 155,58" fill="#4338CA"/>
    <!-- Small Cupola / Bell Tower motif atop building -->
    <rect x="71" y="2" width="18" height="18" rx="2" fill="#E0E7FF"/>
    <polygon points="67,4 80,-8 93,4" fill="#4338CA"/>
    <circle cx="80" cy="11" r="3.5" fill="#4338CA"/>

    <!-- Building Details: Windows and Doorway -->
    <rect x="68" y="85" width="24" height="55" rx="3" fill="#4338CA"/>
    <rect x="30" y="75" width="24" height="28" rx="3" fill="#E0E7FF"/>
    <line x1="42" y1="75" x2="42" y2="103" stroke="#4338CA" stroke-width="1.5"/>
    <line x1="30" y1="89" x2="54" y2="89" stroke="#4338CA" stroke-width="1.5"/>

    <rect x="106" y="75" width="24" height="28" rx="3" fill="#E0E7FF"/>
    <line x1="118" y1="75" x2="118" y2="103" stroke="#4338CA" stroke-width="1.5"/>
    <line x1="106" y1="89" x2="130" y2="89" stroke="#4338CA" stroke-width="1.5"/>

    <!-- Porch Step -->
    <rect x="10" y="138" width="140" height="6" rx="3" fill="#E0E7FF"/>
  </g>

  <!-- Winding footpath from centre toward meeting circle -->
  <path d="M 590 410 Q 560 450 490 465 Q 430 480 390 485" fill="none" stroke="#E0E7FF" stroke-width="24" stroke-linecap="round"/>

  <!-- ================= FOREGROUND MEETING AREA & TREE ================= -->
  <!-- Lush Meeting Shade Lawn / Communal Ground Circle -->
  <ellipse cx="290" cy="495" rx="220" ry="55" fill="#059669" opacity="0.2"/>
  <ellipse cx="280" cy="490" rx="175" ry="42" fill="#059669" opacity="0.25"/>

  <!-- ================= LARGE VILLAGE MEETING TREE ================= -->
  <g id="village-meeting-tree">
    <!-- Tree Trunk & Major Branches in Warm Amber-Brown #D97706 & Indigo Shadow accents -->
    <!-- Trunk Base Shadow -->
    <ellipse cx="205" cy="485" rx="34" ry="10" fill="#059669" opacity="0.3"/>

    <!-- Main Trunk -->
    <path d="M 190 485 C 195 430 190 350 175 290 C 188 280 215 280 230 290 C 215 350 218 430 226 485 Z" fill="#D97706"/>
    <!-- Deep bark tone accent -->
    <path d="M 198 485 C 203 430 200 360 188 310 C 196 305 210 305 216 312 C 206 360 210 430 218 485 Z" fill="#4338CA" opacity="0.25"/>

    <!-- Left Branch sweeping outward -->
    <path d="M 180 340 C 150 310 110 300 70 295 C 75 285 90 282 105 287 C 145 295 170 310 188 332 Z" fill="#D97706"/>
    <!-- Right Branch reaching overhead towards group -->
    <path d="M 215 330 C 260 295 320 285 375 275 C 370 285 355 292 340 295 C 295 305 248 312 210 345 Z" fill="#D97706"/>
    <path d="M 205 310 C 220 270 240 230 260 200 C 270 205 270 215 260 230 C 245 260 230 290 215 325 Z" fill="#D97706"/>

    <!-- Tree Canopy (Expansive, rounded, protective layers in Emerald #059669 and Fresh Tints) -->
    <!-- Back / Under Canopy (Dark Emerald) -->
    <circle cx="100" cy="235" r="75" fill="#059669" opacity="0.9"/>
    <circle cx="180" cy="180" r="95" fill="#059669" opacity="0.95"/>
    <circle cx="280" cy="170" r="90" fill="#059669"/>
    <circle cx="365" cy="210" r="75" fill="#059669" opacity="0.9"/>
    <circle cx="230" cy="140" r="85" fill="#059669"/>

    <!-- Main Canopy Dome (Primary Emerald #059669) -->
    <circle cx="130" cy="200" r="70" fill="#059669"/>
    <circle cx="215" cy="155" r="85" fill="#059669"/>
    <circle cx="310" cy="165" r="80" fill="#059669"/>
    <circle cx="360" cy="225" r="60" fill="#059669"/>

    <!-- Highlight Canopy Layers (Stylized overlapping shapes in #E0E7FF and light tone) -->
    <path d="M 90 220 Q 140 160 210 170 Q 230 210 170 240 Z" fill="#E0E7FF" opacity="0.25"/>
    <path d="M 220 130 Q 280 110 330 140 Q 340 180 270 180 Z" fill="#E0E7FF" opacity="0.25"/>
    <circle cx="280" cy="135" r="35" fill="#E0E7FF" opacity="0.2"/>
    <circle cx="160" cy="150" r="40" fill="#E0E7FF" opacity="0.2"/>

    <!-- Leaf Clusters / Edge scallops -->
    <circle cx="60" cy="255" r="35" fill="#059669"/>
    <circle cx="410" cy="245" r="45" fill="#059669"/>
    <circle cx="330" cy="265" r="40" fill="#059669"/>
    <circle cx="120" cy="280" r="35" fill="#059669"/>
  </g>

  <!-- ================= SEATED CLIENTS UNDER THE TREE ================= -->
  <!-- Low communal bench / mat beneath tree -->
  <ellipse cx="240" cy="505" rx="100" ry="16" fill="#E0E7FF"/>

  <!-- Client 1 (Leftmost, seated attentively, wearing warm Amber #D97706 wrap) -->
  <g id="client-1" transform="translate(155, 420)">
    <!-- Shadow -->
    <ellipse cx="25" cy="80" rx="24" ry="7" fill="#059669" opacity="0.3"/>
    
    <!-- Flowing Skirt / Traditional Garment -->
    <path d="M 8 45 Q 25 35 42 45 L 48 78 Q 25 84 2 78 Z" fill="#D97706"/>
    <!-- Wrap Stripe -->
    <path d="M 6 58 Q 25 50 44 58" fill="none" stroke="#F8FAFC" stroke-width="3" opacity="0.8"/>
    
    <!-- Upper Body / Blouse in Indigo #4338CA -->
    <path d="M 12 30 Q 25 22 38 30 L 40 48 Q 25 50 10 48 Z" fill="#4338CA"/>
    
    <!-- Head & Headwrap -->
    <circle cx="25" cy="15" r="11" fill="#D97706"/>
    <!-- Headscarf crown -->
    <path d="M 16 14 C 15 6 22 2 30 2 C 37 2 38 9 34 16 Z" fill="#059669"/>
    <circle cx="32" cy="7" r="3" fill="#D97706"/>

    <!-- Arm resting on lap -->
    <path d="M 14 34 Q 24 45 35 44" fill="none" stroke="#D97706" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Client 2 (Center seated woman with passbook/savings folder in Emerald & Indigo) -->
  <g id="client-2" transform="translate(210, 410)">
    <!-- Shadow -->
    <ellipse cx="28" cy="90" rx="26" ry="8" fill="#059669" opacity="0.35"/>
    
    <!-- Skirt / Wrap in Deep Emerald #059669 -->
    <path d="M 8 50 Q 28 40 48 50 L 54 88 Q 28 95 2 88 Z" fill="#059669"/>
    <!-- Shawl fold in soft Lavender #E0E7FF -->
    <path d="M 10 32 Q 28 24 46 32 L 48 56 Q 28 62 8 56 Z" fill="#E0E7FF"/>
    
    <!-- Head & Graceful Headwrap -->
    <circle cx="28" cy="14" r="11" fill="#D97706"/>
    <path d="M 18 12 C 18 4 27 0 35 2 C 42 5 41 12 37 16 Z" fill="#D97706"/>
    <ellipse cx="34" cy="5" rx="5" ry="3" fill="#4338CA"/>

    <!-- Hands holding financial passbook -->
    <path d="M 14 38 Q 22 52 28 52" fill="none" stroke="#D97706" stroke-width="5" stroke-linecap="round"/>
    <path d="M 42 38 Q 34 52 28 52" fill="none" stroke="#D97706" stroke-width="5" stroke-linecap="round"/>
    <!-- Passbook / Loan Card in Indigo #4338CA -->
    <rect x="23" y="47" width="16" height="12" rx="2" fill="#4338CA" transform="rotate(-6, 28, 52)"/>
    <rect x="25" y="49" width="12" height="3" rx="1" fill="#F8FAFC" transform="rotate(-6, 28, 52)"/>
  </g>

  <!-- Client 3 (Right seated, leaning forward in active discussion) -->
  <g id="client-3" transform="translate(270, 420)">
    <!-- Shadow -->
    <ellipse cx="25" cy="80" rx="24" ry="7" fill="#059669" opacity="0.3"/>
    
    <!-- Garment in Indigo #4338CA -->
    <path d="M 8 46 Q 24 38 40 46 L 46 78 Q 24 84 2 78 Z" fill="#4338CA"/>
    
    <!-- Torso / Shawl in Amber #D97706 -->
    <path d="M 12 28 Q 24 22 36 28 L 38 48 Q 24 50 10 48 Z" fill="#D97706"/>
    
    <!-- Head & Styled Hair / Headwrap -->
    <circle cx="24" cy="14" r="11" fill="#D97706"/>
    <circle cx="24" cy="9" r="10" fill="#4338CA"/>
    <circle cx="20" cy="5" r="4" fill="#059669"/>

    <!-- Arm gesturing toward officer -->
    <path d="M 28 35 Q 40 38 48 34" fill="none" stroke="#D97706" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- ================= STANDING HERO: FIELD OFFICER WITH PHONE ================= -->
  <!-- Positioned prominently on the right of the meeting circle, standing tall and friendly -->
  <g id="field-officer" transform="translate(370, 340)" filter="url(#softShadow)">
    <!-- Cast Shadow on ground -->
    <ellipse cx="48" cy="170" rx="38" ry="11" fill="#059669" opacity="0.35"/>

    <!-- Trousers in Deep Indigo #4338CA -->
    <!-- Left Leg (Straight, grounded) -->
    <path d="M 36 98 L 34 165 L 24 165 L 28 98 Z" fill="#4338CA"/>
    <rect x="22" y="162" width="16" height="7" rx="3" fill="#D97706"/>

    <!-- Right Leg (Slight relaxed stance) -->
    <path d="M 48 98 L 56 165 L 66 165 L 56 98 Z" fill="#4338CA"/>
    <rect x="54" y="162" width="16" height="7" rx="3" fill="#D97706"/>

    <!-- Belt in Amber #D97706 -->
    <rect x="26" y="94" width="36" height="5" rx="1" fill="#D97706"/>

    <!-- Field Shirt / Professional Tunic in Crisp #F8FAFC with Indigo trim -->
    <path d="M 22 38 L 66 38 L 62 96 L 26 96 Z" fill="#F8FAFC" stroke="#E0E7FF" stroke-width="1.5"/>
    <!-- Collar & Placket -->
    <polygon points="38,38 44,52 50,38" fill="#4338CA"/>
    <line x1="44" y1="52" x2="44" y2="94" stroke="#4338CA" stroke-width="2"/>
    
    <!-- Officer Identity Lanyard & Badge in Emerald #059669 -->
    <path d="M 36 38 Q 44 65 44 70 Q 44 65 52 38" fill="none" stroke="#059669" stroke-width="2"/>
    <rect x="39" y="70" width="10" height="14" rx="2" fill="#4338CA"/>
    <rect x="41" y="72" width="6" height="4" rx="1" fill="#E0E7FF"/>
    <line x1="41" y1="78" x2="47" y2="78" stroke="#F8FAFC" stroke-width="1"/>

    <!-- Officer Head & Cap -->
    <circle cx="44" cy="20" r="14" fill="#D97706"/>
    <!-- Professional Field Cap in Indigo #4338CA with visor pointing left toward clients -->
    <path d="M 32 18 C 32 8 40 4 52 4 C 60 4 62 10 60 18 Z" fill="#4338CA"/>
    <path d="M 28 17 L 44 15 L 42 19 L 26 19 Z" fill="#4338CA"/>
    <!-- Cap accent band in Emerald #059669 -->
    <path d="M 32 17 Q 44 14 56 17" fill="none" stroke="#059669" stroke-width="2"/>

    <!-- Left Arm holding clipboard / notebook at side -->
    <path d="M 58 42 Q 68 65 64 88" fill="none" stroke="#F8FAFC" stroke-width="10" stroke-linecap="round"/>
    <circle cx="64" cy="90" r="5" fill="#D97706"/>
    <!-- Clipboard in Amber #D97706 -->
    <rect x="62" y="76" width="14" height="22" rx="2" fill="#D97706" transform="rotate(8, 62, 76)"/>
    <rect x="64" y="78" width="10" height="18" rx="1" fill="#F8FAFC" transform="rotate(8, 62, 76)"/>
    <rect x="67" y="74" width="6" height="3" rx="1" fill="#4338CA" transform="rotate(8, 62, 76)"/>

    <!-- Right Arm extended forward holding the smartphone -->
    <path d="M 26 42 Q 10 58 14 74" fill="none" stroke="#F8FAFC" stroke-width="10" stroke-linecap="round"/>
    <circle cx="14" cy="74" r="5" fill="#D97706"/>

    <!-- THE SMARTPHONE (Key technology artifact) -->
    <!-- Phone casing in Deep Indigo #4338CA -->
    <g transform="translate(2, 60) rotate(-10)">
      <rect x="0" y="0" width="18" height="32" rx="3.5" fill="#4338CA"/>
      <!-- Screen in Soft Pale Ice Lavender #E0E7FF -->
      <rect x="1.5" y="2.5" width="15" height="27" rx="2" fill="#E0E7FF"/>
      <!-- Ledger rows & checkmark motif on phone screen -->
      <rect x="3.5" y="6" width="11" height="2" rx="0.5" fill="#4338CA"/>
      <rect x="3.5" y="10" width="8" height="1.5" rx="0.5" fill="#059669"/>
      <rect x="3.5" y="13" width="11" height="1.5" rx="0.5" fill="#4338CA" opacity="0.6"/>
      <rect x="3.5" y="16" width="6" height="1.5" rx="0.5" fill="#D97706"/>
      
      <!-- Tiny checkmark circle indicating verified sync / active record -->
      <circle cx="11.5" cy="22" r="3" fill="#059669"/>
      <path d="M 10 22 L 11 23 L 13 21" fill="none" stroke="#F8FAFC" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Phone speaker slot -->
      <rect x="6.5" y="1" width="5" height="0.8" rx="0.4" fill="#E0E7FF"/>
    </g>
  </g>

  <!-- ================= FOREGROUND FOLIAGE ACCENTS ================= -->
  <!-- Delicate prairie grass & leaf motifs along lower bottom margin -->
  <g id="foreground-grass">
    <!-- Left margin grass tufts in Emerald & Amber -->
    <path d="M 60 550 Q 75 515 95 510 Q 85 530 80 550" fill="#059669"/>
    <path d="M 75 550 Q 95 520 115 518 Q 102 535 98 550" fill="#059669" opacity="0.8"/>
    <circle cx="95" cy="510" r="3" fill="#D97706"/>

    <path d="M 130 555 Q 140 530 155 526 Q 145 542 142 555" fill="#059669"/>

    <!-- Right margin grass & shrub accents -->
    <path d="M 700 550 Q 685 518 665 512 Q 675 532 680 550" fill="#059669"/>
    <path d="M 685 550 Q 665 522 645 520 Q 658 537 662 550" fill="#059669" opacity="0.8"/>
    <circle cx="665" cy="512" r="3" fill="#D97706"/>

    <path d="M 630 555 Q 620 532 605 528 Q 615 544 618 555" fill="#059669"/>
  </g>
</svg>