# components — the project's shared component vocabulary.
#
# ─────────────────────────── WHY THIS FILE EXISTS ───────────────────────────
# It was MISSING. Every stitch prompt built for this project therefore carried the line
# "## Components (vocabulary used in this prompt)  - (no named components extracted — see
# composition)". So the renderer received component IDs and types with NO semantics behind them:
# it never learned that a credential field masks its input, that an error icon REPLACES a trailing
# toggle rather than joining it, or that the instance chip is informational rather than a button.
#
# That is the second half of the same root cause as the missing `design-system/app-shell.yaml`:
# the prompts were structurally complete and semantically empty, so the renderer filled both gaps
# from its own priors. Declaring the vocabulary here means a prompt STATES the behaviour instead of
# leaving it to be guessed.
#
# `content_fields[]` on each entry is read by the prompt builder to know which data a component
# surfaces (loadComponentContentFields).

schema_version: "1.0"

components:

  # ──────────────── FORM / CREDENTIAL ────────────────
  - type: outlined_text_field
    description: "Labelled single-line input with an optional leading icon and a trailing slot."
    content_fields: [label, placeholder, value, error_text]
    semantics:
      - "The trailing slot holds AT MOST ONE element. When the field is in error the error icon takes the slot; any toggle it would otherwise hold is not rendered alongside it."
      - "A credential field masks its value independently of whether a visibility toggle is drawn. Hiding the toggle must never reveal the text."
      - "Error text renders BELOW the field, attached to that field only — never in a snackbar, and never on a sibling field that passed its own rule."
    a11y:
      - "The leading icon is decorative (null contentDescription); the trailing error icon is announced."

  - type: legal_text
    description: "Small-print consent line with inline tappable links, adjacent to the action it qualifies."
    content_fields: [body, link_labels]
    semantics:
      - "Never truncated and never behind a scroll — a consent the user cannot read is not a consent."
      - "Links open external policy documents; they do not navigate inside the app."

  # ──────────────── STATUS / CONTEXT ────────────────
  - type: assist_chip
    description: "Compact, low-contrast pill carrying a piece of CONTEXT that is also actionable."
    content_fields: [label, leading_icon, trailing_icon]
    semantics:
      - "Information first, affordance second. It must read as a status, not as a primary button, and must never compete with the screen's primary action."
      - "It always STATES its current value. A chip that offers to change a setting without showing it is the defect it exists to replace."
    rationale: >
      Introduced for signin's instance chip. On 2026-10-01 every API call 404'd against a wrong
      base path and sign-in reported "Login failed. Check your credentials and try again" —
      diagnosable only by packet capture, because the screen displayed nothing about which server it
      was calling. A chip stating host and tenant makes that class of fault visible at a glance.

  - type: inline_banner
    description: "In-flow message strip for a condition the user must act on or wait out."
    content_fields: [message, severity]
    semantics:
      - "Sits in the content flow, not over it — it is not a dialog and it is not dismissible."
      - "States both WHAT happened and WHAT clears it. A warning with no exit is noise."

  - type: snackbar_host
    description: "Transient message surface for failures that have no field to attach to."
    content_fields: [message]
    semantics:
      - "Transport and connectivity failures only. A field-level validation error belongs on its field."

  - type: progress_overlay
    description: "Modal scrim covering the whole content area while a request is in flight."
    content_fields: []
    semantics:
      - "Modal and non-dismissible. Every terminal state clears it; the user never dismisses it."
      - "It covers the form rather than replacing the submit control, so field values stay visible and a second submit is impossible."

  # ──────────────── ACTIONS ────────────────
  - type: button
    description: "Primary action — one per screen."
    content_fields: [label]
    semantics:
      - "Full width on form screens, minimum 48dp touch target."
      - "Disabled rather than hidden while unavailable, so the layout does not shift under the user's thumb."

  - type: text_button
    description: "Secondary / accelerator action."
    content_fields: [label, leading_icon]
    semantics:
      - "Never the only route to an outcome. An accelerator that fails must fall back to the primary path, not dead-end."

  # ──────────────── DASHBOARD (home) ────────────────
  - type: action_grid
    description: "Grid of icon-over-label shortcut tiles (home quick actions). 4 columns on phone."
    content_fields: [label, icon]
    semantics:
      - "Each tile is rendered only when the user holds its permission — absent, never disabled; the grid reflows with no gaps."
      - "The whole grid is hidden when no tile survives the permission filter, rather than showing an empty frame."
      - "Tiles are equal-sized, each at least the 48dp touch target, label below the icon, at most two lines."
    a11y: ["Each tile announces its label as a button; the icon is decorative."]

  # ──────────────── BRAND / STATIC ────────────────
  - type: image
    description: "Brand mark or illustration."
    content_fields: [asset]
    a11y: ["Decorative images carry a null contentDescription; a brand mark that identifies the app is announced."]

  - type: text_block
    description: "Headline plus supporting line, centred."
    content_fields: [headline, subtitle]
    semantics:
      - "The headline is resolved from the fork's app-profile display name, never a hardcoded brand literal."

  # ──────────────── ONBOARDING (added 2026-11-04 by /idea-plan-add onboarding) ────────────────
  - type: pager
    extends: carousel
    description: "Full-screen horizontal pager of onboarding pages; one page visible at a time."
    content_fields: [pages]
    semantics:
      - "Never auto-scrolls — the officer moves with Next, Skip, a swipe or back."
      - "Swiping is equivalent to Next / back and never saves anything."
      - "Back on the first page is passed to the system; nothing is stored."
    a11y: ["When a page settles its title (a heading) and body are announced as one group."]

  - type: page_indicator
    extends: stepper
    description: "Row of dots showing the current onboarding page; not interactive."
    content_fields: [count, current]
    semantics:
      - "The current dot is filled with the primary colour; the others are outlined. Dots are not tap targets."
    a11y: ["Announced as 'Page n of N' — the dots themselves are not focusable."]
