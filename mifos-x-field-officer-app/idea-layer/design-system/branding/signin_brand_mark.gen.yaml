# Provenance sidecar for feature_signin_brand_mark.png (RULE-SCREEN-VISUAL-ASSETS-001 SVA-2).

schema_version: "1.0"
asset_id: signin_brand_mark
file: feature_signin_brand_mark.png
kind: logo
role: brand

# ──────────────── PRODUCTION ────────────────
produced_by: /idea-branding
produced_at: "2026-11-04"   # RE-DERIVED: the 2026-10-03 output was the template gear/dollar (see `history`)
engine: deterministic-derivation          # no generative model involved

# ──────────────── WIRING (SVA-3) ────────────────
# The resource path the screen actually renders. The gate resolves this on disk: a declared asset
# with no proven wire is indistinguishable from one that was generated and then forgotten, which is
# the whole failure mode SVA-3 exists to catch.
wired_to: source/mifos-x-field-officer-app/feature/signin/src/commonMain/composeResources/drawable/feature_signin_brand_mark.png
wired_by: "SignInScreen.kt LogoTile() — Image(painter = painterResource(Res.drawable.feature_signin_brand_mark))"

# ──────────────── LICENSE + DEVICE TRUTH (SVA-4) ────────────────
license_status: project-owned
device_fidelity: pending   # the 2026-10-03 pass below was for the gear artwork; re-capture the Mifos X mark
device_fidelity_verified_at: '2026-10-03'
device_fidelity_evidence: idea-layer/testers/captures/signin-brandmark-20261003/01-brandmark.png
device_fidelity_device: "OnePlus CPH2423 (Q4CIZHA6Y5GMJV89), apk md5 86b2d0f0b1619cd9f99bc8d97c248277"
device_fidelity_note: >
  Verified by capture, not by compilation. Held at `pending` until a screen had actually shown it,
  because the gate's own wording is the right standard: compiles/loads is not proof it renders.

  What the capture proves, specifically: the white glyph sits DIRECTLY on the mint
  `secondaryContainer` tile with no white rectangle behind it. That is the alpha channel doing its
  job, and it is the one thing the 764x268 opaque JPEG could not do at any size. The previous
  capture of this same screen shows the legacy asset letterboxed inside its baked-in white box.

derivation:
  source: app-profile/icons/android/res/mipmap-xxxhdpi/ic_launcher_foreground.webp
  source_kind: adaptive-icon-foreground
  steps:
    - "read the 432x432 RGBA foreground"
    - "compute the content bbox from the ALPHA channel: (84,84,347,347) — the Mifos X mark"
    - "crop to that bbox, removing the adaptive safe-zone padding"
    - "resize to a square transparent canvas, 216x216 (LANCZOS); the X gaps stay transparent so the tile tints through"
  output: { width: 216, height: 216, mode: RGBA, md5: fcac11312c19c64777e1bac64f14f10e }

history:
  - date: "2026-10-03"
    artwork: "template App Toolkit gear/dollar — the launcher foreground at the time (bbox 108..324)"
  - date: "2026-11-04"
    artwork: "Mifos X mark (lime/green/blue/sky triangles) — re-derived after /idea-branding found the
      sign-in tile still showing the gear. A derivation only stays current if it is RE-RUN when its
      source changes; `consistency_proof` below holds only from this date."

# ──────────────── WHY THIS SOURCE ────────────────
rationale: >
  The mark is the PROJECT'S OWN icon artwork, not a generated image. `/idea-feature-stitch-art`
  refuses the brand/typographic role family by design, and its reason is the right one: a model
  asked for a brand mark invents one, and an invented brand mark is a fake. The adaptive-icon
  foreground is the only asset in this repo that is simultaneously (a) the real logo, (b) carries a
  true alpha channel, and (c) exists at sufficient resolution. So the mark is derived, never drawn.

  The `ui.yaml#visual_assets[].produced_by` originally read `/idea-feature-stitch-art`, which would
  have been refused. Corrected to `/idea-branding`.

replaces:
  file: feature_signin_mifos_logo.jpg
  was: { width: 764, height: 268, mode: RGB, bytes: 75684 }
  defects:
    - "OPAQUE: a baked-in white background renders as a hard rectangle against the tinted tile"
    - "cannot invert for dark theme, because there is no transparency to tint through"
    - "non-square 764x268, so it could not sit centred in a 64dp square tile without letterboxing"
    - "75.7KB of JPEG for a flat logo, 10x the size of the PNG that replaces it"
  improvement: "7,596 bytes vs 75,684 — 10x smaller, square, alpha-correct"

# ──────────────── STATES ────────────────
# Declared `states: [light, dark]` is satisfied by ONE asset rather than two: the mark is
# transparent, so the tile's own `secondaryContainer` token supplies the ground in each theme and
# the artwork composites over it. A second baked variant would have to be kept in sync by hand.
states:
  light: { asset: feature_signin_brand_mark.png, ground: "colorScheme.secondaryContainer" }
  dark:  { asset: feature_signin_brand_mark.png, ground: "colorScheme.secondaryContainer" }

consistency: app-icon-family
consistency_proof: >
  Byte-derived from the shipped launcher icon, so the sign-in mark and the home-screen icon are the
  same artwork by construction. They cannot drift without the launcher icon itself changing.

license:
  status: project-owned
  note: "Derived from the fork's own app-profile icon set; no third-party or model-generated pixels."
