# idea-layer/_strings/strings.yaml — mifos-x-field-officer-app English copy (the project's single strings table)
#
# Flat dotted-path keys: {strings.x.y.z} in ui.yaml → key "x.y.z" here (same shape as the sibling
# tables in other workspaces; layer0.ts flattens nested keys with "."). Per-feature keys are
# namespaced screens.<feature>.<slug>.
# Locale: en (source locale). Other locales go in _strings/strings.{locale}.yaml.
#
# Started 2026-10-26 by /idea-feature-enrich home (first feature authored with string keys; the
# migrated screens still carry literals and fold in here as they are re-enriched).

schema_version: "1.0"
locale: en

