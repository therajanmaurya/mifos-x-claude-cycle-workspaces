  - id: loan-vertical-unreachable
    kind: unreachable-shipped-code
    feature: loan
    severity: error
    raised_at: '2026-10-21T00:00:00.000Z'
    raised_by: /implement
    status: resolved
    message: >-
      S4a–S4c shipped seven loan screens and 104 tests behind a route that
      compiled, was registered by `@FeatureDestination`, and had NO CALLER
      anywhere in the running app. The same dead-code class as a ViewModel with
      no screen, one level up — and it survived three slices because each slice
      verified its own screen rather than the path to it. Found by applying the
      §6a caller rule BEFORE porting the next screen rather than after. The
      original has TWO loan detail screens with different callers: search and
      group detail open the account SUMMARY; the client's loan LIST opens the
      loan PROFILE; `clientDetails` opens the summary but nothing navigates to
      `clientDetails` itself. The fork had ported the profile and none of its
      callers.
    resolved_by: >-
      S4d — the account summary, plus wiring the SEARCH result row's tap, which
      had shipped deliberately inert in S2 with a note saying it would become
      live "in S3, with the first destination that can receive it". That note
      went stale when client and group details landed. Three of the five entity
      types are now clickable (CLIENT, GROUP, LOAN); CENTER and SAVING stay
      inert.
    also_resolved: >-
      S4e — `clientLoanAccounts`, the loan PROFILE's own caller, reached from
      the client General screen's "Loan Account" row (which was `null`-gated and
      so not drawn). Ported out of client-slice order precisely because of this
      entry, which is the first time the new "port the caller in the same slice"
      rule was applied. Both of its card actions are live: View Account → the
      loan profile, Make Repayment → the repayment form. Every ported loan
      screen now has a path in: search → summary → its two menu entries; client
      General → loan accounts → profile and repayment.
    lesson: >-
      check the CALLER before porting the callee, not after. A slice that
      verifies its screen in isolation can ship a whole vertical nobody can
      open, and every test will pass.
    fix_belongs_in: 'feature/loan + cmp-navigation (done), feature/client (the list)'
  - id: loan-status-precedence-differs-by-screen
    kind: carried-over-inconsistency
    feature: loan
    severity: advisory
    raised_at: '2026-10-21T00:00:00.000Z'
    raised_by: /implement
    status: open
    message: >-
      The loan SUMMARY and the loan PROFILE derive the loan's state from the
      same `LoanStatus` with DIFFERENT precedence. The summary tests `active`
      first; the profile tests `pendingApproval` first. Fineract can report a
      loan as both, so the same loan reads ACTIVE on one screen and PENDING on
      the other — and the primary button offers Make Repayment on one and
      Approve on the other. Both are the original's behaviour, on both screens,
      and both are carried over. Unifying them is a product decision about which
      answer is right for a loan in that state, not a porting one. The summary
      ALSO distinguishes two states the profile collapses to "Unknown" —
      awaiting-disbursal and closed — so the profile's catch-all gap
      (`loan-profile-unknown-status-catch-all`) has an answer in the original
      even though the profile itself has none.
    fix_belongs_in: 'idea-layer (decide), then feature/loan'
  - id: loan-summary-breadcrumb-not-ported
    kind: deliberate-omission
    feature: loan
    severity: advisory
    raised_at: '2026-10-21T00:00:00.000Z'
    raised_by: /implement
    status: open
    message: >-
      The original's loan account summary rendered
      `MifosBreadcrumbNavBar(navController)` at the top of its body, and took a
      `NavController` as a SCREEN parameter to do it. Not ported onto the
      summary. CORRECTION to this entry's first wording, which said the fork
      "has no breadcrumb component": it DOES —
      `core/ui/.../components/AppBreadCrumb.kt#AppBreadcrumbNavBar`, already
      ported, and with **zero callers anywhere in the fork**. So the component
      is itself unreachable ported code, the same class as
      `loan-vertical-unreachable` but in core/ui. Checked rather than assumed
      after that finding.
    real_reason: >-
      it takes a `NavController`, and no ported SCREEN accepts one — screens
      take `onX` callbacks, which is what lets every one of them render in a
      test without a NavHost. The clean place for it is the NAVIGATION layer,
      inside the `composableWithPushTransitions { }` block where the
      NavController is already in scope and the screen stays NavController-free.
      Not done in S4d on purpose: the original renders this bar on MANY screens,
      so adding it to one would make the fork inconsistent in a way a reader
      would take for a porting miss. It is one decision covering many screens.
    also_worth_checking: >-
      `AppBreadcrumbNavBar` derives its trail by filtering backstack routes on
      the literal substring "Route" and stripping it. The fork's routes ARE
      named `…Route`, so it would work — but that coupling is worth seeing
      before it is wired to anything.
    fix_belongs_in: >-
      cmp-navigation + feature nav graphs (wire at the nav layer), one slice for
      all screens
