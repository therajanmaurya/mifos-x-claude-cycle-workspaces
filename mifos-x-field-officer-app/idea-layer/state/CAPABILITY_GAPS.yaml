      submitting before choosing a product crashed. What makes it easy to miss
      is that the surrounding code LOOKS defensive: five other option reads in
      the same builder are wrapped in an explicit `!= -1` guard and two use
      `getOrNull`. One unguarded `get` sat among them. The six guarded ones were
      only half-safe anyway — `!= -1` protects against the sentinel but not
      against an index left over from a previous template read. Fixed by keying
      selections (`Map<RecurringField, RecurringOption>`), so the payload reads
      a VALUE and neither failure is expressible. Also fixed: the pre-closure
      penalty's interest and interest-on fields were sent whatever had been
      typed even with the penalty checkbox CLEAR, so a penalty the officer had
      unchecked still reached the server. Both are now sent only when the
      penalty applies, and the fields are only rendered then. NOT a defect here,
      worth recording because eight other screens got it wrong: the date/format
      pairing was CORRECT — `DateHelper.SHORT_MONTH` alongside a date from
      `DateHelper.getDateAsStringFromLong`, both `dd-MM-yyyy`. Right by both
      halves happening to come from the same object; the port keeps it right by
      construction instead.
    worth_sweeping: >-
      `?.get(` on an options list is worth grepping for across the original
      wherever an index-into-list state pattern appears — a guarded `getOrNull`
      beside an unguarded `get` is the shape to look for, because the file reads
      as careful.
