      `SavedStateHandle(mapOf("id" to clientId))`, matching the ViewModel's
      wrong constant, so two tests passed against a screen that read nothing.
      The test now seeds the real route key, which is what makes it a test of
      the route contract rather than of the constant. The route KDoc already
      explained why `clientId` carries no default ("a screen reachable with id
      -1 that would then ask Fineract for client -1") — the route was fixed and
      the ViewModel reading it was not.
    worth_sweeping: >-
      `checks/route-key-sweep.py` (in the migration plan's checks dir) asserts
      every `*_KEY` constant names a real route property across the five ported
      feature modules. RED-validated against a copy with the defect
      reintroduced. Currently 0 unmatched.
    verified_on_device: >-
      2026-10-23, Q4CIZHA6Y5GMJV89, prod-debug md5
      9f33e55aeb2e15fb7de9a8279239cb0a, fresh install + `am force-stop`. The
      request is now `clients/1?template=true&staffInSelectedOfficeOnly=true`.
    fix_belongs_in: feature/client (done)
  - id: error-state-rendered-raw-server-json-to-the-officer
    kind: carried-over-defect-fixed
    feature: client
    severity: error
    raised_at: '2026-10-23T00:00:00.000Z'
    raised_by: device-verify
    status: resolved
    message: >-
      `rememberAppErrorMessageFor` resolved two of its nine category branches as
      `error.message ?: <localized copy>`. On a Ktor transport exception
      `message` is a diagnostic built from the whole exchange and is never null,
      so the localized copy was dead code for every HTTP 4xx and the officer saw
      the raw dump instead: the full request URL with host, tenant and query
      string, then the response body including `developerMessage`,
      `httpStatusCode` and `userMessageGlobalisationCode`. Screenshot captured
      on the Assign Staff screen. Two problems, not one — it is unreadable to
      the person it is shown to, and it publishes the deployment's internal API
      surface to an end user. It also broke the state's layout: the message
      column grew tall enough to clip the retry button to a 24px sliver with no
      readable label (uiautomator reported it as a clickable with empty text,
      empty content-desc and NAF="true"). The only control that could recover
      from the error was unreachable because of the copy beside it. Both
      branches now use their localized string. Nothing is lost: an exception
      that genuinely carries user-facing copy is handled by
      `ProjectErrorMapper`, which the mapper already consults FIRST — that is
      what the fork seam is for. AppErrorMapper.kt is template-owned, so the fix
      is also queued upstream as
      `app-error-mapper-echoes-raw-throwable-as-user-copy`; without that it will
      be reverted by the next template sync.
    worth_sweeping: >-
      `core-base/ui` `defaultErrorMessage` has the same two-line pattern. Left
      alone deliberately: different module, its own tests pin the current
      behaviour, and the app never reaches it because `appScreenStateDefaults`
      overrides `messageFor`. Whether a library default should echo a throwable
      at all is a separate decision, noted in the upstream queue entry.
    verified_on_device: >-
      2026-10-23, Q4CIZHA6Y5GMJV89, prod-debug md5
      9f33e55aeb2e15fb7de9a8279239cb0a, fresh install + `am force-stop`. The
      error state now reads "Something went wrong / Request failed. Please try
      again." with a tappable, labelled "Try again" button.
    fix_belongs_in: 'core/store (done, local) + openMF/kmp-project-template (queued)'
  - id: date-picker-button-had-no-accessibility-label
    kind: carried-over-defect-fixed
    feature: client
    severity: warning
    raised_at: '2026-10-23T00:00:00.000Z'
    raised_by: device-verify
    status: resolved
    message: >-
      `AppDatePickerTextField` rendered its trailing calendar button as an
      `IconButton` whose only child passed `contentDescription = null`, leaving
      the clickable node with no label at all. The text field itself is
      `readOnly` with no click handler, so that button is the ONLY way to open
      the picker — unlabelled, the field was not merely degraded for a screen
      reader user, it was impossible to fill. Every date field in the app routes
      through this one component. Distinct from the `contentDescription = null`
      on button LEADING icons elsewhere in the port (Cancel / Submit on the edit
      form). Those buttons carry visible text, so the text is the label and
      labelling the icon too would make a screen reader announce it twice. Null
      is correct there and was left alone. core/designsystem is
      template-derived, so this is also queued upstream as
      `app-date-picker-text-field-button-unlabelled`.
    verified_on_device: >-
      2026-10-23, Q4CIZHA6Y5GMJV89. The control reports content-desc "Open date
      picker" on the client Update Details and Client Transfer forms.
    fix_belongs_in: 'core/designsystem (done, local) + openMF/kmp-project-template (queued)'
  - id: sandbox-single-client-reads-404-while-the-list-200s
    kind: external-dependency
    feature: client
    severity: warning
    raised_at: '2026-10-23T00:00:00.000Z'
    raised_by: device-verify
    status: open
    message: >-
      On sandbox.mifos.community, EVERY single-client read 404s while the client
      LIST succeeds. Observed within one minute of each other:
      `clients?paged=true&offset=0&limit=100` → 200 (the list renders 8+ rows);
      `clients/8` → 404; `clients/8/images` → 404; `clients/1` → 404;
      `clients/1/accounts` → 404. `groups`, `centers` and
      `collateral-management` all → 200, and the DeviceVerifyGroup created
      earlier in this session is still present, so the instance did NOT lose its
      data. It is NOT client-specific. `POST groups/1?command=activate` → 404 as
      well, against the very group whose LIST entry had just returned 200 and
      which this session created. So every single-entity read or write 404s
      while every list read succeeds — which is why "the app sends a wrong
      client id" cannot explain it, and why no app-side fix follows from it. The
      app's own handling is correct in both places: the group screen reported
      "Failed to activate group" rather than claiming success. THE APP IS
      SENDING THE RIGHT ID. Verified rather than assumed: the row for account
      000000008 issues `clients/8`, and that row's cached `id` column is 8 (read
      directly out of the device's Room DB via `run-as`; the copies were deleted
      afterwards). Ids run 1..11 and line up with the account numbers, which is
      Fineract's default seeding. So this is not an identifier bug on our side,
      and there is nothing to fix in this repo. Earlier the same session
      `clients/1/identifiers/template` returned 200 and a client detail loaded,
      so the single-client path regressed mid-session. Cause unknown. It could
      not be probed independently: direct calls now return 401 for
      `fieldofficer` (one bad-password attempt from a stray keystroke earlier;
      Fineract locks after repeated failures) while the APK's existing token
      keeps working. A per-operation permission change on the instance would
      fit, but that is a guess and is recorded as one. WHAT THIS MEANS FOR
      READING A DEVICE SWEEP: client detail screens render the offline-first
      CACHE, and anything that needs a fresh single-client read shows the error
      state. UI, navigation, empty/error states and affordances are all still
      verified by such a sweep; "this screen loads its data correctly" is NOT,
      and must be re-taken against a live instance. The loan and savings product
      catalogues are separately empty (200 with an empty list), which is what
      `wizard-step-1-empty-product-catalogue-had-no-stated-cause` is about.
    fix_belongs_in: 'external (Fineract instance), not this repo'
