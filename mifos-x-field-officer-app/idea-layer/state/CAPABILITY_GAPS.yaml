  - id: action-dispatch-sweep-had-two-bugs-of-its-own
    kind: tooling-defect-fixed
    feature: multiple
    severity: error
    raised_at: '2026-10-22T00:00:00.000Z'
    raised_by: /implement
    status: resolved
    message: >-
      Draining the 21 findings exposed TWO bugs in the sweep itself, and both
      had already produced a WRONG triage call in
      `action-dispatch-sweep-found-21-actions-with-no-control`: (1) **It could
      not see indirect dispatch.** A ViewModel may expose `fun f() =
      trySendAction(XAction.Y)` and the UI pass `onPrune = viewModel::f`.
      `SyncAndDraftsAction.PruneExpired` is dispatched exactly that way from a
      real OutlinedButton on the Sync & Drafts screen — the earlier triage
      called it REAL ("reachable only from a TEST") because a grep for
      `pruneExpired()` with parentheses cannot match a `::` method reference.
      The script now collects those forwarders and accepts `::f` in a UI file as
      a dispatch. (2) **It read a constructor parameter's TYPE as the
      supertype.** The regex `data (?:object|class) (\w+)[^:\n]*: *(\w*Action)`
      matched `data class OpenAction(val action: LoanPrimaryAction, val loanId:
      Int) : LoanProfileEvent` and reported `LoanPrimaryAction.OpenAction` — an
      EVENT mis-read as an action, against a type that is a status-to-action
      vocabulary for the nav graph. The earlier triage recorded it as a "not an
      MVI action" false positive, which described the symptom but missed that
      the parse was simply wrong. The parameter list is now matched as a
      balanced group and discarded. After both fixes the sweep reports 0/13
      features, and it still flags the group-detail defect it was written for
      when that menu is removed (RED re-validated).
    worth_sweeping: >-
      the lesson is about the tool, not the code: a checker that produces one
      wrong row makes its whole list untrustworthy, and both of these bugs
      produced findings that LOOKED plausible enough to triage and write down.
      Re-validate RED after any change to a checker's matching.
    fix_belongs_in: plan-layer checks/action-dispatch-sweep.py (done)
  - id: client-push-destinations-had-no-top-bar
    kind: port-omission-fixed
    feature: client
    severity: error
    raised_at: '2026-10-22T00:00:00.000Z'
    raised_by: /implement
    status: resolved
    message: >-
      All TWELVE `feature/client` push destinations rendered with **no top bar
      at all** — no title and no back affordance. The shell draws one only for
      tab roots (`AuthenticatedNavbarNavigationScreen`: `topBar = { if
      (!isTabRoot) return@KptRootScaffold … }`), and only `ClientChargesScreen`
      had a scaffold of its own. So an officer on the client profile, its
      accounts, addresses, documents, identifiers, signature, loan accounts or
      details saw an untitled page with no way back except the system gesture —
      which does not exist on desktop or web. This is why NINE client ViewModels
      declared a `NavigateBack` action that nothing dispatched: the control that
      would send it had never been drawn. Same inverse-defect shape as the
      group-detail overflow menu (`group-detail-menu-was-never-ported-...`): a
      complete chain with no control, invisible to a dead-clickable audit and
      invisible to the §6a two-grep caller check, because both start from the
      ROUTE. Fixed by wrapping each stateful half in `AppScaffold` with a title
      and a back that DISPATCHES the action, and threading the scaffold's insets
      into the stateless half as a defaulted `scaffoldPadding` so tests and
      previews still render it alone.
    worth_sweeping: >-
      the same question is worth asking of every feature: does each push
      destination draw its own top bar, given the shell draws one only for tab
