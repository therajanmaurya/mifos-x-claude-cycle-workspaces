  - id: readonly-dropdowns-never-opened-app-wide
    kind: template-defect-fixed
    feature: designsystem
    severity: error
    raised_at: '2026-10-22T00:00:00.000Z'
    raised_by: device-verify
    status: resolved
    message: >-
      EVERY read-only dropdown in the app was impossible to open. Found on a
      physical device; nothing in the build or the 1,586-test suite caught it.
      `AppTextFieldDropdown` hardcoded
        .menuAnchor(type = MenuAnchorType.PrimaryEditable, enabled = enabled)
      while its own `readOnly` parameter DEFAULTS TO TRUE. M3 treats
      `PrimaryEditable` as "tap to type", so the anchor claims the gesture for
      the text field: a tap focuses the input and the `ExposedDropdownMenu`
      never expands. The `.clickable(enabled = readOnly && enabled)` that was
      evidently meant to compensate is chained AFTER `menuAnchor`, so the anchor
      consumes the pointer first and it never runs. SCALE: 22 screens use this
      component — every loan form, client transfer/closure/staff/collateral, and
      every application wizard. On the default `readOnly = true` path none of
      their dropdowns could be opened, so no form requiring a selection could be
      completed. WHY IT SURVIVED: the composable compiles, renders and lays out
      correctly, and the ViewModels pass because their tests invoke the
      selection callback directly rather than through the anchor. A dropdown
      that never opens is indistinguishable from a working one in any
      non-interactive check. It presented as a focused field with a chevron and
      no menu. FIXED: the anchor type is now derived from `readOnly`
      (`PrimaryNotEditable` when read-only), with `.clickable` retained for the
      editable case. Verified on device — the Office dropdown on create-group
      expands and lists its options, and a full create round-trip (`POST
      /groups` -> 200) completes. TEMPLATE-DERIVED: fixed locally because the
      fork is unusable without it, AND queued upstream as
      `app-text-field-dropdown-readonly-never-opens` — `sync-dirs.sh` overwrites
      `core/designsystem` wholesale, so the local fix is one sync away from
      silent reversion unless the template carries it.
    fix_belongs_in: >-
      core/designsystem/.../AppTextFieldDropdown.kt + upstream
      openMF/kmp-project-template
