# idea-plan.yaml — mifos-x-field-officer-app
# ═══════════════════════════════════════════════════════════════════════════
#
# BOOTSTRAPPED by /idea-feature-import STEP 0.3 on 2026-10-02.
#
# Why it was missing: this project has working source (20 feature modules, 1652 .kt at the original
# ref), a registered PROJECT_CONFIG.yaml and a session binding — but no plan. Every per-feature
# idea-layer command requires this file, so the project was unreachable by the pipeline it is meant
# to use. /idea-import does not write it; /idea-plan writes it only via a 15-phase wizard or an
# import mode that registers a NEW project.
#
# DELIBERATELY MINIMAL. A feature-import knows one feature at a time, so vision, personas,
# requirements and release phases are NOT invented here — writing them from a few screens would be
# fabrication wearing a plan's clothes. `/idea-plan` fills them when the operator is ready.
#
# features[] grows one row per `/idea-feature-import` run. `status: imported` means extracted from
# real source with provenance — distinct from `draft` (authored, unreviewed) and `scaffold`
# (structure only, no content).

schema_version: "1.0"
_creation_mode: "feature-import"
