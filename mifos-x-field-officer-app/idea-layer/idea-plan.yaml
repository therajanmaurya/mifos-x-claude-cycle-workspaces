      - "Pull-to-refresh retries every visible card; offline shows cached figures with their age"
    note: >
      Added 2026-10-26 from the Fineract permission/API audit (sandbox 1.17.0-SNAPSHOT + gateway).
      Operator decisions: staff-linked scope with office fallback · own-loan queues · dashboard IS Home.

