  - id: home
    name: Home
    status: scaffold
    scaffolded_at: "2026-10-26T16:30:00Z"
    priority: P0
    category: home
    module: feature/home
    screens: [home]
    depends_on: [signin, search, clientList, individualCollectionSheet, checkerInbox, syncAndDrafts, runReports]
    description: >
      Permission-aware field officer dashboard that becomes the Home tab body (search stays on the
      top-bar icon): today's collections, work queue (checker tasks, own loans awaiting approval /
      disbursal, clients pending activation, reschedule requests, unsynced drafts), meetings today,
