      CHECKER_SUPER_USER / REPORTING_SUPER_USER honoured) and absent — not disabled — without it.
    acceptance_criteria:
      - "Each card renders, fails and caches independently; one failing source never blanks the screen"
      - "A card or action whose permission the user lacks is not rendered and makes no request"
      - "Portfolio scope = staff-linked 'my portfolio', else office-wide; loan queues show only the officer's own loans"
