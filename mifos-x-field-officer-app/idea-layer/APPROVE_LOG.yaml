# APPROVE_LOG — the human gate between design and implementation.
#
# `/implement` refuses to run without an `approve_hash` matching the docset it is generating from.
# That is the whole point: it pins WHICH design a given implementation came from.

schema_version: "1.0"

approvals:
  - feature: signin
    approved_at: "2026-10-05"
    approved_by: human
    approval_mode: explicit-human-gate
    approve_hash: "00fddd1a9276309a7a89d0051684c0d4c752fcb7dc8403834826fd56b5d578f3"
    hash_source: "core/scripts/staleness-resolve.sh signin --current-hash (sanctioned hasher)"
    docset_version: "2.0"

    # ──────────────── READINESS PREDICATE, RECORDED HONESTLY ────────────────
    predicate:
      C1_schema_conformance: pass
      C2_artifacts_present_and_fresh: "pass-with-disclosure (see below)"
      C4_no_blocking_verify_failures: pass
      evidence:
        - "ui-source-consumed: PASS, 8/8 states consumed stitch, no downgrade"
        - "mockup-completeness: PASS"
        - "screen-visual-assets: PASS, generated + wired + license/fidelity clean"
        - "idea-agent-setup-completeness: PASS"
        - "export self-validation: 6/6 checkpoints"
        - "stitch ledger: 8 files, 0 sv-fail, 0 hard fails"

    # ──────────────── WHAT THE HUMAN WAS TOLD BEFORE APPROVING ────────────────
    # Recorded because an approval whose caveats are not written down is indistinguishable from
    # one that had none.
    disclosed_at_approval:
      - id: c2-mtime-staleness
        detail: >
          18 artifact FILES are older than `ui.yaml` (7 previews, 9 stitch README sidecars,
          MANIFEST, journeys/authentication, flows/authentication). All are CONTENT-CURRENT: the
          `ui.yaml` edit that post-dates them was the `visual_assets` provenance correction
          (`produced_by` + asset binding), which cannot affect a preview render, a nav flow, or a
          sidecar. C2's mtime comparison cannot distinguish a metadata edit from a design change,
          so it reports a staleness that does not exist in content.
        why_not_cleared_mechanically: >
          Re-emitting 18 byte-identical files to move timestamps is the laundering move this
          session twice refused (and which the write-direction guard blocked when attempted). The
          honest resolution is disclosure plus an explicit human decision, not a timestamp bump.

      - id: stitch-tier-is-fallback
        detail: >
          All 8 stitch renders are `sv-fallback`, locally authored, `pending_stitch_upgrade=true`.
          The Google backend returned "accepted but never delivered" (300s poll) on every call.
          Content is correct and token-native; only the render PROVENANCE is degraded. Upgradeable
          via the resume ledger when the backend recovers.

      - id: states-not-device-verified
        detail: >
          `transport_error`, `offline`, `locked_out` and `biometric_ready` have not been exercised
          on a device. They rest on unit tests. `empty`, `validation_error`, `submitting` and
          `success` are device-verified (2026-10-03, OnePlus CPH2423, live apis.mifos.community).

    # ──────────────── WHAT THIS APPROVAL AUTHORISES ────────────────
    authorises: >
      `/kmp-implement signin` to generate `feature/signin` source from THIS docset. The shipped
      source currently implements the v1 shape and has DRIFTED from this design: `instance_chip`,
      `consent_text`, `biometric_action` and `lockout_notice` are all declared here and absent from
      `SignInScreen.kt`; `SignInError` carries 4 values where the docset declares 5. Closing that
      drift is the purpose of this approval.

    binding_implementation_notes:
      - "feature-owned navigation in a `navigation/` package, but NOT @FeatureDestination (it registers onto the authenticated graph this gate guards)"
      - "do NOT use MifosOutlinedTextField; compose M3 OutlinedTextField from core/designsystem tokens"

