# DEPLOYMENT_PROJECT_CONFIG.yaml — Project Release Configuration
# Framework template: layers/deployment/templates/DEPLOYMENT_PROJECT_CONFIG.yaml
# Copied to: {workspace_path}/deployment-layer/DEPLOYMENT_PROJECT_CONFIG.yaml on first /idea-deploy setup
# Source of truth for all release config values
# project_config.rb is a DERIVED artifact generated from this YAML for fastlane consumption
schema_version: 2

project:
  name: "MifosXDroid"
  organization: "MobileByteSensei"

android:
  configured: true
  package_name: "com.mifos.mifosxdroid"
  keystore:
    alias: ""
    password_source: "secrets.env"     # secrets.env | env_var | manual
    status: "not_generated"            # not_generated | template | project_specific | mismatch
    file: "secrets/live/android/keystores/upload_keystore.keystore"
  # Which upload key signs Play bundles (read by core/scripts/secrets-android-signing-run.sh).
  #   legacy → the key Play has registered today (cert SHA1 F9:97:65:28:77:FF:AA:9D:5D:E9:F0:35:7B:80:A9:23:2D:21:AE:93),
  #            vault aliases mifos-x-field-officer-app-upload-keystore-legacy{,-storepass,-keyalias,-keypass}.
  #            EXPOSED (public openMF history b5a57c9) — a bridge only.
  #   vault  → the new key (cert SHA1 F7:1C:29:8D:F4:7F:46:DC:BC:6E:BB:EB:D1:68:0D:39:2E:45:D3:57), materialized by
  #            /secrets pull into secrets/live/android/keystores/. Flip here AFTER Google approves the reset ([AK]),
  #            then delete the four legacy aliases.
  upload_key:
    active: legacy
    reset_status: not_requested       # not_requested | requested | approved
    reset_requested_at: null
    expected_sha1_legacy: "F9:97:65:28:77:FF:AA:9D:5D:E9:F0:35:7B:80:A9:23:2D:21:AE:93"
    # Generated 2026-11-04 by core/scripts/keystore-manager.sh: PKCS12, RSA-4096, key password == store
    # password, alias "upload". Public cert for the reset: regenerate with android-cert-digest.sh --export-pem (never committed)
    expected_sha1_vault: "17:18:A6:D8:AB:10:B6:A0:49:47:19:36:43:1B:5D:B8:40:92:F2:90"
  firebase:
    prod_app_id: "1:728434912738:android:ecdb5b96f0e735661a1dbb"   # com.mifos.mifosxdroid (cmp-android/google-services.json)
    demo_app_id: "1:728434912738:android:53d0930e402622611a1dbb"   # com.mifos.mifosxdroid.demo
    project_number: "728434912738"                 # extracted from prod_app_id (1:{NUMBER}:android:...)
    groups: ""
    credentials_file: "secrets/android/firebaseAppDistributionServiceCredentialsFile.json"
  play_store:
    registered: true
    # DERIVED from package_name — https://play.google.com/store/apps/details?id=<pkg>.
    # Valid before publication; the URL 404s until the first release is live.
    listing_url: "https://play.google.com/store/apps/details?id=com.mifos.mifosxdroid"
    # DERIVED from package_name by core/scripts/deploy-config-autoconfigure.sh on every [GE] run —
    # https://play.google.com/store/apps/details?id=<package_name>. Never hand-type it. It is valid
    # (and correct) before the app is published; the URL simply 404s until the first release is live,
    # which is why the site renders the button by channel `state`, not by URL presence.
    listing_url: ""
    # secrets/live/ is the canonical tree every consumer reads (deployment/Appfile, secrets-pull's
    # `canonical:`, SECRETS_LAYOUT#kmp-app). The old "secrets/android/..." path resolved nowhere.
    json_key: "secrets/live/android/play/playStorePublishServiceCredentialsFile.json"
  apk_paths:
    prod: "cmp-android/build/outputs/apk/prod/release/cmp-android-prod-release.apk"
    demo: "cmp-android/build/outputs/apk/demo/release/cmp-android-demo-release.apk"
  aab_path: "cmp-android/build/outputs/bundle/prodRelease/cmp-android-prod-release.aab"

ios:
  configured: true
  bundle_id: "com.mifos.mifosxdroid"
  team_id: "L432S2FZP5"                          # can inherit from ios_shared.team_id
  firebase:
    app_id: ""
    groups: ""
  app_store_connect:
    key_id: ""
    issuer_id: ""
    key_path: "secrets/apple/appstore/AuthKey.p8"
