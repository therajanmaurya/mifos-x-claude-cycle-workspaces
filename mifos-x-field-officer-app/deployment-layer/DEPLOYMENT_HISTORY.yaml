# DEPLOYMENT_HISTORY.yaml — Release History Tracking
#
# Schema version: 1.0.0
# Location: {workspace_path}/deployment-layer/DEPLOYMENT_HISTORY.yaml (per-project)
# Written by: /idea-deploy after every successful deploy
# Read by: /idea-deploy rollback, /idea-deploy-verify, release dashboard (localhost:7576)
#
# This file is the single source of truth for what was deployed, when, and where.
# RULE-DEPLOYMENT-004 enforces that every deploy writes an entry here.

release_history:
  schema_version: "1.0.0"

  # Releases are appended in chronological order (newest last).
  # Each release entry represents a version cut (git tag + GitHub Release).
  # Platform deployments are recorded as sub-entries under the release.
  releases:
    - version: "2026.10.1-beta.0.8"
      build_number: 265
      timestamp: "2026-10-31T00:00:00Z"
      git_tag: "2026.10.1-beta.0.8"
      github_release_url: "https://github.com/openMF/mifos-x-field-officer-app/releases/tag/2026.10.1-beta.0.8"
      status: active
      platforms:
        android_firebase:
          track: "firebase-app-distribution"
          deployed_at: "2026-10-31T00:00:00Z"
          deployed_by: "local"
          artifact: "cmp-android-prod-release.apk"
          app_id: "1:728434912738:android:ecdb5b96f0e735661a1dbb"
          groups: ["mifos-mobile-apps"]
          release: "https://console.firebase.google.com/project/mifos-mobile-apps/appdistribution/app/android:com.mifos.mifosxdroid/releases/742i8s2rfkpn0"
          release_notes: "Field officer app ported onto the kmp-project-template base (#2706)."
    - version: "2026.11.1-beta.0.4"
      build_number: 41
      timestamp: "2026-11-04T18:30:28+05:30"
      git_tag: null                     # NOT YET CREATED — run [tag] (upstream openMF) to cut tag + GitHub Release
      github_release_url: null
      status: pending                   # flips terminal only after tag + GitHub Release exist (enforcement contract)
      platforms:
        android:
          track: "internal"
          deployed_at: "2026-11-04T18:30:28+05:30"
          deployed_by: "local"
          artifact: "cmp-android-prod-release.aab"
          version_code: 41
          build_duration: "9m 54s"
          build_duration_seconds: 594
          signing: "legacy upload key from git history b5a57c9 (cert SHA1 F9:97:65:28…) — upload-key reset to the vault key pending"
          listing: "store-listing v3 (Hero) — synced by [SC-A] 2026-11-04 and re-sent with this deploy"
          release_notes: "Rebuilt on Kotlin Multiplatform. New home dashboard with today's work, offline sync for chosen centres, groups and clients, a Profile screen with password change, a server picker, and faster, more reliable loading across every screen."
