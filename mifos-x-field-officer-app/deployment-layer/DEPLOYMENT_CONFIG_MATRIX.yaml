# DEPLOYMENT_CONFIG_MATRIX.yaml
# Complete fastlane config tracking matrix — single source of truth
# Copied to {workspace_path}/DEPLOYMENT_CONFIG_MATRIX.yaml on first /idea-deploy setup
# Synced when framework template version bumps
#
# Status values: missing | generated | manual | stale | not_applicable | synced | drift | studio
#   studio — media delegated to /idea-store-assets-generate (SP-01 / RULE-DEPLOY-MEDIA-STUDIO-001)
#   synced — manual file verified against framework template, all lanes/blocks present
#   drift  — manual file missing lanes/blocks/tokens found in framework template
# Generated by: /idea-deploy [G] Regenerate Config
# Verified by: /idea-deploy [GV] Verify & Enrich Manual (compares manual files against templates)
# Read by: /idea-deploy matrix (CONFIG COMPLETENESS section)

schema_version: 4
strategy: "{strategy}"
primary_locale: "{locale}"
last_generated: null

# ═══════════════════════════════════════════════════════════════════
# ANDROID TEXT ASSETS (per locale)
# ═══════════════════════════════════════════════════════════════════
# Android store TEXT lives in the DEPLOYMENT tree, beside its media — not under root fastlane/.
# The media rows already used deployment/android/metadata/{locale}/images/..., and idea-deploy.md's
# enforcement contract names deployment/android/metadata/en-US/changelogs/default.txt as the file
# that must exist before deployInternal. Only the text rows still pointed at fastlane/metadata/
# android/, so generated copy sat on disk while the matrix reported it missing — 5 rows the
# preflight could never close (found 2026-09-03).
text_assets:
  android:
    title:
      path: "deployment/android/metadata/{locale}/title.txt"
      max_chars: 30
      generated_by: G7
      status: generated
    short_description:
      path: "deployment/android/metadata/{locale}/short_description.txt"
      max_chars: 80
      generated_by: G7
      status: generated
    full_description:
      path: "deployment/android/metadata/{locale}/full_description.txt"
      max_chars: 4000
      generated_by: G7
      status: generated
    video:
      path: "deployment/android/metadata/{locale}/video.txt"
      note: "YouTube video URL"
      generated_by: G7
      status: generated
    changelog_default:
      path: "deployment/android/metadata/{locale}/changelogs/default.txt"
      max_chars: 500
      generated_by: G7
      status: generated   # syncForkConfig ← app-profile android.changelog (2026-11-04)
    # Per-version changelogs are auto-generated at deploy time
    # Path: fastlane/metadata/android/{locale}/changelogs/{VERSION_CODE}.txt

  # ═══════════════════════════════════════════════════════════════════
  # iOS TEXT ASSETS — LOCALIZED (per locale)
  # ═══════════════════════════════════════════════════════════════════
  ios_localized:
    name:
      path: "deployment/ios/appstore/metadata/{locale}/name.txt"
      max_chars: 30
      live_editable: false
      generated_by: G7
      status: generated
    subtitle:
      path: "deployment/ios/appstore/metadata/{locale}/subtitle.txt"
      max_chars: 30
      live_editable: false
      generated_by: G7
      status: generated
    description:
      path: "deployment/ios/appstore/metadata/{locale}/description.txt"
      max_chars: 4000
      live_editable: true
      generated_by: G7
      status: generated
    keywords:
      path: "deployment/ios/appstore/metadata/{locale}/keywords.txt"
      max_chars: 100
      note: "comma-separated"
      live_editable: false
      generated_by: G7
      status: generated
    release_notes:
      path: "deployment/ios/appstore/metadata/{locale}/release_notes.txt"
      max_chars: 4000
      live_editable: true
      generated_by: G7
      status: generated
    promotional_text:
      path: "deployment/ios/appstore/metadata/{locale}/promotional_text.txt"
      max_chars: 170
      live_editable: true
      generated_by: G7
      status: generated
    marketing_url:
      path: "deployment/ios/appstore/metadata/{locale}/marketing_url.txt"
      generated_by: G7
      status: generated
    support_url:
      path: "deployment/ios/appstore/metadata/{locale}/support_url.txt"
      generated_by: G7
      status: generated
    privacy_url:
      path: "deployment/ios/appstore/metadata/{locale}/privacy_url.txt"
      generated_by: G7
      status: generated
    apple_tv_privacy_policy:
      path: "deployment/ios/appstore/metadata/{locale}/apple_tv_privacy_policy.txt"
      note: "required if tvOS app"
      generated_by: G7
      status: generated

  # ═══════════════════════════════════════════════════════════════════
  # iOS TEXT ASSETS — NON-LOCALIZED (categories + subcategories)
  # ═══════════════════════════════════════════════════════════════════
  ios_categories:
    copyright:
      path: "deployment/ios/appstore/metadata/copyright.txt"
      generated_by: G7
      status: generated
    primary_category:
      path: "deployment/ios/appstore/metadata/primary_category.txt"
      note: "e.g. FINANCE, PRODUCTIVITY, SOCIAL_NETWORKING"
      generated_by: G7
      status: generated
    secondary_category:
      path: "deployment/ios/appstore/metadata/secondary_category.txt"
      generated_by: G7
      status: generated
    primary_first_sub_category:
      path: "deployment/ios/appstore/metadata/primary_first_sub_category.txt"
      generated_by: G7
      status: generated
    primary_second_sub_category:
      path: "deployment/ios/appstore/metadata/primary_second_sub_category.txt"
      generated_by: G7
      status: generated
    secondary_first_sub_category:
      path: "deployment/ios/appstore/metadata/secondary_first_sub_category.txt"
      generated_by: G7
      status: generated
    secondary_second_sub_category:
      path: "deployment/ios/appstore/metadata/secondary_second_sub_category.txt"
      generated_by: G7
      status: generated

  # ═══════════════════════════════════════════════════════════════════
  # iOS REVIEW INFORMATION (7 files)
  # ═══════════════════════════════════════════════════════════════════
  ios_review:
    # All 7 derived by syncForkConfig ← app-profile org.* + store.review.* (2026-11-04).
    first_name:
      path: "deployment/ios/appstore/metadata/review_information/first_name.txt"
      generated_by: G7
      status: generated
    last_name:
      path: "deployment/ios/appstore/metadata/review_information/last_name.txt"
      generated_by: G7
      status: generated
    phone_number:
      path: "deployment/ios/appstore/metadata/review_information/phone_number.txt"
      generated_by: G7
      status: generated
    email_address:
      path: "deployment/ios/appstore/metadata/review_information/email_address.txt"
      generated_by: G7
      status: generated
    # Demo account: deliberately empty in the repo — the reviewer picks a community demo server in
    # the sign-in picker (see notes.txt); real reviewer credentials are entered in App Store Connect.
    demo_user:
      path: "deployment/ios/appstore/metadata/review_information/demo_user.txt"
      generated_by: G7
      status: manual
    demo_password:
      path: "deployment/ios/appstore/metadata/review_information/demo_password.txt"
      generated_by: G7
      status: manual
    notes:
      path: "deployment/ios/appstore/metadata/review_information/notes.txt"
      generated_by: G7
      status: generated

  # ═══════════════════════════════════════════════════════════════════
  # iOS TRADE REPRESENTATIVE CONTACT INFORMATION (12 files)
  # Required for apps sold in certain regions (e.g., South Korea, Brazil)
  # ═══════════════════════════════════════════════════════════════════
  ios_trade_rep:
    first_name:
      path: "deployment/ios/appstore/metadata/trade_representative_contact_information/first_name.txt"
      generated_by: G7
      status: generated
    last_name:
      path: "deployment/ios/appstore/metadata/trade_representative_contact_information/last_name.txt"
      generated_by: G7
      status: generated
    address_line1:
      path: "deployment/ios/appstore/metadata/trade_representative_contact_information/address_line1.txt"
      generated_by: G7
      status: generated
    address_line2:
      path: "deployment/ios/appstore/metadata/trade_representative_contact_information/address_line2.txt"
      generated_by: G7
      status: generated
    address_line3:
      path: "deployment/ios/appstore/metadata/trade_representative_contact_information/address_line3.txt"
      generated_by: G7
      status: generated
    city_name:
      path: "deployment/ios/appstore/metadata/trade_representative_contact_information/city_name.txt"
      generated_by: G7
      status: generated
    state:
      path: "deployment/ios/appstore/metadata/trade_representative_contact_information/state.txt"
      generated_by: G7
      status: generated
    country:
      path: "deployment/ios/appstore/metadata/trade_representative_contact_information/country.txt"
      generated_by: G7
      status: generated
    postal_code:
      path: "deployment/ios/appstore/metadata/trade_representative_contact_information/postal_code.txt"
      generated_by: G7
      status: generated
    phone_number:
      path: "deployment/ios/appstore/metadata/trade_representative_contact_information/phone_number.txt"
      generated_by: G7
      status: generated
    email_address:
      path: "deployment/ios/appstore/metadata/trade_representative_contact_information/email_address.txt"
      generated_by: G7
      status: generated
    is_displayed_on_app_store:
      path: "deployment/ios/appstore/metadata/trade_representative_contact_information/is_displayed_on_app_store.txt"
      note: "true or false"
      generated_by: G7
      status: generated

  # ═══════════════════════════════════════════════════════════════════
  # macOS / MAC APP STORE TEXT ASSETS (Fastlane deliver — per locale)
  # Mirrors the iOS deliver shape (SP-11). Text-only; screenshots owned by studio (mac_retina).
  # Flat inline keys so [G] G7 targets a THIRD platform root: deployment/desktop/mac-app-store/metadata/{locale}/
  # ═══════════════════════════════════════════════════════════════════
  macos_name:             { path: "deployment/desktop/mac-app-store/metadata/{locale}/name.txt",             max_chars: 30,   generated_by: G7, status: generated }
  macos_subtitle:         { path: "deployment/desktop/mac-app-store/metadata/{locale}/subtitle.txt",         max_chars: 30,   generated_by: G7, status: generated }
  macos_description:      { path: "deployment/desktop/mac-app-store/metadata/{locale}/description.txt",      max_chars: 4000, generated_by: G7, status: generated }
  macos_keywords:         { path: "deployment/desktop/mac-app-store/metadata/{locale}/keywords.txt",         max_chars: 100,  generated_by: G7, status: generated }
  macos_release_notes:    { path: "deployment/desktop/mac-app-store/metadata/{locale}/release_notes.txt",    max_chars: 4000, generated_by: G7, status: generated }
  macos_promotional_text: { path: "deployment/desktop/mac-app-store/metadata/{locale}/promotional_text.txt", max_chars: 170,  generated_by: G7, status: generated }
  macos_marketing_url:    { path: "deployment/desktop/mac-app-store/metadata/{locale}/marketing_url.txt",    generated_by: G7, status: generated }
  macos_support_url:      { path: "deployment/desktop/mac-app-store/metadata/{locale}/support_url.txt",      generated_by: G7, status: generated }
  macos_privacy_url:      { path: "deployment/desktop/mac-app-store/metadata/{locale}/privacy_url.txt",      generated_by: G7, status: generated }
  macos_copyright:        { path: "deployment/desktop/mac-app-store/metadata/copyright.txt",                 generated_by: G7, status: generated }

# ═══════════════════════════════════════════════════════════════════
# MEDIA ASSETS
# ═══════════════════════════════════════════════════════════════════
media_assets:
  # Paths are the ACTUAL fastlane deployment metadata tree the lanes deliver from:
  #   Android → fastlane supply reads deployment/android/metadata/{locale}/images/
  #   iOS     → fastlane deliver reads deployment/ios/appstore/metadata/
  #   macOS   → fastlane deliver reads deployment/desktop/mac-app-store/metadata/
  # iOS & macOS screenshots live in ONE screenshots/{locale}/ dir per platform — deliver
  # resolution-detects the device — so they are ONE tracked slot each, NOT per-device folders.

  # ── Android (fastlane supply) ──
  android_icon:
    path: "deployment/android/metadata/{locale}/images/icon.png"
    dimensions: "512x512"
    format: "PNG 32-bit with alpha"
    max_size_kb: 1024
    generated_by: studio
    status: generated   # icon-gen → variant v2 media → app-profile → syncForkConfig (2026-11-04)
  android_feature_graphic:
    path: "deployment/android/metadata/{locale}/images/featureGraphic.png"
    dimensions: "1024x500"
    format: "PNG or JPEG"
    generated_by: studio
    status: generated
  android_phone_screenshots:
    path: "deployment/android/metadata/{locale}/images/phoneScreenshots/"
    dimensions: "min 320px, max 3840px per side"
    aspect_ratio: "9:16 or 16:9"
    format: "PNG or JPEG, 24-bit, no alpha"
    min_count: 2
    max_count: 8
    generated_by: studio
    status: generated
  android_tablet_10:
    path: "deployment/android/metadata/{locale}/images/tenInchScreenshots/"
    dimensions: "same as phone"
    format: "PNG or JPEG, 24-bit, no alpha"
    max_count: 8
    generated_by: studio
    status: generated
  android_tablet_7:
    path: "deployment/android/metadata/{locale}/images/sevenInchScreenshots/"
    dimensions: "same as phone"
    format: "PNG or JPEG, 24-bit, no alpha"
    max_count: 8
    status: not_applicable
    scope_out_reason: "Play accepts 10\" tablet alone; the studio's Frame=tablet targets 10\"."
  android_promo_graphic:
    path: "deployment/android/metadata/{locale}/images/promoGraphic.png"
    dimensions: "180x120"
    format: "PNG or JPEG"
    note: "legacy — still accepted by Play Console"
    status: not_applicable
    scope_out_reason: "Legacy Play promo graphic; outside the studio's Frame union."
  android_tv_banner:
    path: "deployment/android/metadata/{locale}/images/tvBanner.png"
    dimensions: "1280x720"
    format: "PNG or JPEG"
    note: "required for Android TV apps (tvos leg)"
    status: not_applicable
    scope_out_reason: "Android-TV banner; gated off unless tvos configured."
  android_tv_screenshots:
    path: "deployment/android/metadata/{locale}/images/tvScreenshots/"
    dimensions: "1920x1080"
    format: "PNG or JPEG"
    note: "required for Android TV apps (tvos leg)"
    status: not_applicable
    scope_out_reason: "Android-TV screenshots; gated off unless tvos configured."
  android_wear_screenshots:
    path: "deployment/android/metadata/{locale}/images/wearScreenshots/"
    dimensions: "same as phone"
    format: "PNG or JPEG"
    note: "required for Wear OS apps (watchos leg)"
    status: not_applicable
    scope_out_reason: "Wear OS screenshots; gated off unless watchos configured."

  # ── iOS (fastlane deliver — deployment/ios/appstore/metadata/) ──
  ios_screenshots:
    path: "deployment/ios/appstore/metadata/screenshots/{locale}/"
    note: "ALL iPhone + iPad screenshots — deliver resolution-detects device (6.9/6.5/6.3/6.1/5.5 iPhone · 13/11 iPad)"
    format: "PNG or JPEG, 24-bit, no alpha"
    min_count: 1
    max_count: 10
    generated_by: studio
    status: generated
  ios_icon:
    path: "deployment/ios/appstore/metadata/{locale}/app_icon.png"
    dimensions: "1024x1024"
    format: "PNG"
    status: not_applicable
    scope_out_reason: "iOS App Store icon ships in the build's asset catalog (Assets.xcassets), not delivered via fastlane deliver metadata."
  ios_app_previews:
    path: "deployment/ios/appstore/metadata/app-previews/{locale}/"
    note: "up to 3 per locale per device — MP4/MOV"
    status: not_applicable
    scope_out_reason: "Studio is an HTML→PNG screenshotter; cannot render MP4/MOV app-preview video."

  # ── macOS (fastlane deliver — deployment/desktop/mac-app-store/metadata/) ──
  mac_screenshots:
    path: "deployment/desktop/mac-app-store/metadata/screenshots/{locale}/"
    dimensions: "2880x1800 / 2560x1600 (Retina 16:10)"
    format: "PNG or JPEG"
    max_count: 10
    generated_by: studio
    status: generated

  # ── tvOS / visionOS / watchOS (fastlane deliver — shared appstore metadata, device resolution-detected) ──
  tvos_screenshots:
    path: "deployment/ios/appstore/metadata/screenshots/{locale}/"
    dimensions: "3840x2160 (4K)"
    note: "required for tvOS apps"
    status: not_applicable
    scope_out_reason: "tvOS outside the project's declared platform set."
  visionos_screenshots:
    path: "deployment/ios/appstore/metadata/screenshots/{locale}/"
    dimensions: "3840x2160"
    note: "visionOS apps"
    status: not_applicable
    scope_out_reason: "visionOS outside the project's declared platform set."
  watchos_screenshots:
    path: "deployment/ios/appstore/metadata/screenshots/{locale}/"
    dimensions: "410x502 / 416x496 / 396x484"
    note: "watchOS apps"
    status: not_applicable
    scope_out_reason: "watchOS outside the project's declared platform set."

  # ── Web (Open-Graph listing asset) ──
  web_og_image:
    path: "web/public/og-image.png"
    dimensions: "1200x630"
    format: "PNG"
    status: not_applicable
    scope_out_reason: "Web Open-Graph image is a web-listing asset; no `web` leg in the Fastlane deployment metadata tree."

config_files:
  # ── Core Fastlane ──
  # `path` is the ANCHOR G3 writes; `also_at` lists the template's sibling copies. Fastlane resolves
  # these per lane working-dir, so a dir holding some but not others is the DESIGNED layout, not a
  # gap. NEVER write one to fill an inferred gap — the layout is template-owned
  # (RULE-TEMPLATE-MODULE-FIX-UPSTREAM-001). Verified by framework-verify-fastlane-layout.sh.
  fastfile:
    path: "fastlane/Fastfile"
    also_at: ["deployment/Fastfile", "deployment/fastlane/Fastfile"]
    generated_by: G3
    status: generated
  appfile:
    path: "deployment/Appfile"
    also_at: ["deployment/Appfile"]   # deployment/fastlane/ inherits this — do NOT create a copy
    generated_by: G3
    status: generated
  gemfile:
    path: "Gemfile"
    also_at: ["deployment/Gemfile"]
    generated_by: G3
    status: generated

  # ── Platform Defaults ──
  age_rating:
    # The lanes read app_store_rating_config.json (config.rb app_rating_config_path); age_rating.json was a stale path.
    path: "deployment/ios/appstore/metadata/app_store_rating_config.json"
    note: "23+ keys — frequency (13), boolean (7), age overrides (3+)"
    generated_by: G7
    status: generated   # syncForkConfig ← store.age_rating 4+
  app_privacy:
    path: "deployment/ios/appstore/metadata/app_privacy_details.json"
    note: "Apple App Privacy questionnaire responses"
    generated_by: G7
    status: generated

  # ── Testing ──
  testers_csv:
    path: "testers.csv"
    note: "bulk beta tester list — columns: first_name, last_name, email"
    generated_by: G9
    status: not_applicable
    reason: "no lane reads testers.csv in this deployment tree — testers come from app-profile apple.testers + Firebase tester groups"

  # ── Project Config (Ruby) ──
  project_config:
    path: "fastlane-config/project_config.rb"
    note: "master config — ANDROID, IOS, IOS_SHARED, MACOS, TVOS, SHARED blocks"
    generated_by: G4
    status: generated
regeneration_targets:
  GT:
    label: "All Text"
    sections: [android, ios_localized, ios_categories, ios_review, ios_trade_rep, macos_name, macos_subtitle, macos_description, macos_keywords, macos_release_notes, macos_promotional_text, macos_marketing_url, macos_support_url, macos_privacy_url, macos_copyright]
  GT-A:
    label: "Android Text"
    sections: [android]
  GT-M:
    label: "macOS / Mac App Store Text"
    note: "Fastlane deliver metadata under deployment/desktop/mac-app-store/metadata/{locale}/ — generated by G7 (SP-11)"
    sections: [macos_name, macos_subtitle, macos_description, macos_keywords, macos_release_notes, macos_promotional_text, macos_marketing_url, macos_support_url, macos_privacy_url, macos_copyright]
  GT-I:
    label: "iOS Localized Text"
    sections: [ios_localized]
  GT-C:
    label: "iOS Categories"
    sections: [ios_categories]
  GT-R:
    label: "iOS Review Info"
    sections: [ios_review]
  GT-T:
    label: "iOS Trade Rep"
    sections: [ios_trade_rep]
  GM:
    label: "All Media (studio-delegated)"
    note: "Delegates to /idea-store-assets-generate --only-media (SP-01)"
    # SP-04 (GOAL D13): scoped-out carve-outs (app_previews, android_tv_screenshots,
    # android_tv_banner, android_tablet_7, watch_ultra, watch_series10, watch_series7,
    # visionpro — plus appletv_4k/android_wear_screenshots the studio cannot render) are
    # excluded so [GM] never re-invokes a removed generator against a not_applicable slot.
    sections: [android_icon, android_feature_graphic, android_promo_graphic, android_phone_screenshots, android_tablet_10, ios_icon, ios_iphone_69, ios_iphone_65, ios_iphone_63, ios_iphone_61, ios_iphone_55, ios_ipad_13, ios_ipad_11, mac_retina]
  GM-P:
    label: "Phone Screenshots"
    sections: [android_phone_screenshots, ios_iphone_69, ios_iphone_65, ios_iphone_63, ios_iphone_61, ios_iphone_55]
  GM-T:
    label: "Tablet Screenshots"
    sections: [android_tablet_7, android_tablet_10, ios_ipad_13, ios_ipad_11]
  GM-IC:
    label: "Icons"
    sections: [android_icon, ios_icon]
  GM-FG:
    label: "Feature Graphic"
    sections: [android_feature_graphic]
  GC:
    label: "All Config"
    sections: [fastfile, appfile, gemfile, deliverfile, matchfile, gymfile, snapfile, screengrabfile, framefile, age_rating, app_privacy, testers_csv, project_config, android_config, ios_config, mac_config, tvos_config]
  GC-F:
    label: "FastFile + Appfile + Gemfile"
    sections: [fastfile, appfile, gemfile]
    note: "These 3 are generated together by G3"
  GC-D:
    label: "Deliverfile"
    sections: [deliverfile]
  GC-M:
    label: "Matchfile"
    sections: [matchfile]
  GC-G:
    label: "Gymfile"
    sections: [gymfile]
  GC-P:
    label: "Project Config (Ruby)"
    sections: [project_config, android_config, ios_config, mac_config, tvos_config]
    note: "project_config.rb blocks (G4) + adapter configs (G4b)"
  GC-S:
    label: "Screenshot Config"
    sections: [snapfile, screengrabfile, framefile]
    note: "Snapfile+Screengrabfile (G5b) + Framefile.json (studio-delegated frameit config)"
  GC-ST:
    label: "Store Config (JSON)"
    sections: [age_rating, app_privacy]
    note: "Generated by dedicated G7 store-config subset"
  GC-T:
    label: "Testers CSV"
    sections: [testers_csv]
  GV:
    label: "Verify & Enrich Manual"
    sections: [fastfile, appfile, gemfile, deliverfile, matchfile, gymfile, snapfile, screengrabfile, framefile, age_rating, app_privacy, testers_csv, project_config, android_config, ios_config, mac_config, tvos_config]
    note: "Compares manual files against framework templates — lane/block-level diff + merge"
    filter: "manual_only"

