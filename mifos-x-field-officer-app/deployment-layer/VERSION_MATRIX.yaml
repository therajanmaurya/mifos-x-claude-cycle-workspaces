# VERSION_MATRIX.yaml — Platform Deployment Status (per-version)
#
# Schema version: 1
# Location: {workspace_path}/deployment-layer/VERSION_MATRIX.yaml (per-project)
# Written by: /idea-deploy after every deploy action
# Read by: /idea-deploy matrix (Step 3), /idea-deploy-verify, release dashboard
#
# Single source of truth model:
#   - VERSION (what version exists): GitHub Releases is authoritative
#   - DEPLOYMENT STATUS (what's deployed where): VERSION_MATRIX.yaml is authoritative
#   - On conflict: GH Release version wins; deployment status stays local-only
#
# Synced on every /idea-deploy invocation (Step 2.5):
#   1. Fetch latest GH Release -> update current_version
#   2. If new version detected -> reset all platforms to not_deployed
#   3. Display platform deployment matrix
#
# Platform visibility: Only platforms where DEPLOYMENT_PROJECT_CONFIG.yaml has
# the section configured=true are shown. Unconfigured platforms are hidden.

schema_version: 1

# Current active version (from latest GH Release)
current_version:
  version: "2026.10.1-beta.0.8"                          # e.g., "0.0.1-beta.0.6"
  stage: "beta"                        # beta | rc | stable — release stage lifecycle
  base_version: "2026.10.1"                     # version without pre-release suffix (e.g., "2026.5.0")
  git_tag: "2026.10.1-beta.0.8"                          # e.g., "v0.0.1-beta.0.6"
  github_release_url: "https://github.com/openMF/mifos-x-field-officer-app/releases/tag/2026.10.1-beta.0.8"               # URL to GH Release page
  created_at: "2026-10-31"                       # GH Release creation timestamp (ISO 8601)
  assets: []                           # [{name, size, download_url}] from GH Release

# Platform deployment status for current_version
# Each platform tracks: deployed version, status, timestamp, metadata
#
# NAMING CONVENTION:
#   Key names: snake_case matching PLATFORM_REGISTRY.yaml
#   Display names: display_name field — used in ALL UI rendering
#   PlayStore promotion: Internal -> Promote to Beta -> Promote to Production
#
# STATUS VALUES:
#   not_deployed — never deployed for this version
#   deployed     — successfully deployed
#   failed       — deploy attempted but failed
#   rolled_back  — was deployed, then rolled back

