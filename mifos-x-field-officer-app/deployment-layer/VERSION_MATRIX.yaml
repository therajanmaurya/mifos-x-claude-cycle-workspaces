# Promotion chains — generic enforcement mechanism
# Each chain defines required deployment order for a platform family
# Enforcement: before deploying platform X, check ALL requires[] have status=deployed
#   strict = hard block (cannot proceed)
#   warn   = allow with warning
promotion_chains:
  android:
    chain: [android_playstore_internal, android_playstore_beta, android_playstore_production]
    enforcement: strict
  ios:
    chain: [ios_testflight, ios_appstore]
    enforcement: strict
  mac_appstore:
    chain: [mac_testflight, mac_appstore]
    enforcement: strict
  tvos:
    chain: [tvos_testflight, tvos_appstore]
    enforcement: strict
  desktop_stores:
    chain: []                          # No chain — each store is independent
    enforcement: warn                  # Binary prerequisites enforced via requires[]

# Platform key -> /idea-deploy action code mapping
# Maps VERSION_MATRIX platform keys to action codes used in idea-deploy-matrix.md
# Used by: deploy actions (write), matrix display (read), auto-setup (lookup)
