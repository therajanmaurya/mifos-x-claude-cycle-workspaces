schema_version: 2
project:
  name: mifos-x-field-officer-app
  type: kmp
  subtype: kmp-app
  status: active
  org_domain: org.mifos
  package_name: com.mifos.mifosxdroid

# ─── Repository (SoT for default_branch — RULE-PROJECT-CONFIG-001) ───────────
# `dev` is the real default: origin/HEAD -> origin/dev on both the fork and
# openMF/mifos-x-field-officer-app. Declared here so nothing falls back to the
# framework's hardcoded "development" default (context-start-collect.sh:273).
repository:
  remote: origin
  url: git@github.com:therajanmaurya/mifos-x-field-officer-app.git
  upstream: git@github.com:openMF/mifos-x-field-officer-app.git
  default_branch: dev

tech:
  language: kotlin
  ui_framework: compose-multiplatform
  architecture: mvi
  di: koin
  network: ktor-ktorfit
  database: room-kmp

platforms: [android, ios, desktop, web]

# ─── Template lineage (RULE-KMP-TEMPLATE-REMOTE-001) ─────────────────────────
# Dedicated 'template' remote; 'upstream' stays this app's own repo.
# last_synced_sha mirrors source/.template-version (synced 2026-08-21).
template:
  remote: template
  url: https://github.com/openMF/kmp-project-template.git
  upstream_is_own_repo: true
  default_branch: dev
  last_synced_sha: 6fe88bade82f36c5b8ab0b66569087ea6e340ef2

layers:
  plan: { enabled: true }
  design-spec: { enabled: true }
  server: { enabled: true }
  client: { enabled: true }
  feature: { enabled: true }
  infrastructure: { enabled: true }
  platform: { enabled: true }
  testing: { enabled: true }

idea:
  stitch_pipeline_version: v4
