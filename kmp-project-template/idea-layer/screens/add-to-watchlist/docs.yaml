schema_version: '1.0'
contract_version: "2.0.0"
screen_id: add-to-watchlist
feature_id: feat-add-to-watchlist
archetype: input
flow: flow-watchlist-track
title: Add to Watchlist (Star Toggle)
purpose: >-
  The WRITE side of the Personal Crypto Watchlist showcase — the one-tap "star" toggle
  that ADDS a coin to (or removes it from) the user's private, device-local watch-list.
  Materialized as its own surface because the star is an EMBEDDED affordance hosted on
  feature/crypto's coin surfaces (Coin Markets rows + Coin Detail), distinct from the
  WatchlistScreen list. It observes WatchlistRepository.contains(coinId) (reactive
  Flow<Boolean>) to render the star filled (tracked) vs outline (not tracked), and taps
  drive WatchlistRepository.add(coinId)/remove(coinId) through the framework SubmitHandler
  (the canonical "input simple" single-formKey simple-mutation seam). Membership is
  persisted LOCALLY ONLY (Room `personal_watchlist`, coinId + addedAtMs; NO Store5, NO
  remote sync) via the same raw DAO + core-base/database invalidation bridge the watchlist
  list reads from.
status: draft
implementation_status: backend-shipped-ui-pending
source_of_truth: source            # write contract documented verbatim in WatchlistRepository KDoc
quality_score: 85
last_modified: '2026-08-05'

# Scaffolded from screens/watchlist (the AddToWatchlistStar embedded screen, watchlist/ui.yaml #2).
scaffolded_from: watchlist
scaffolded_by: "/idea-plan-add (dispatch_queue foundation head — broken dead-end target 'add-to-watchlist' from watchlist)"

# ── Money Toolkit showcase note ──
showcase:
  name: "Add to Watchlist — SubmitHandler 'input simple'"
  patterns_demonstrated:
    - "SubmitHandler 'input simple' — the canonical single-formKey simple-mutation seam (add/remove toggle), distinct from the multi-draft DraftSubmitHandler used by Loans/Bills"
    - "Reactive membership: contains(coinId): Flow<Boolean> driving a filled/outline star"
    - "OFFLINE_LOCAL_ONLY write via a RAW Room DAO (no Store5) + core-base/database notifyingWrite{} invalidation bridge — the wasmJs Room-3-alpha05 fan-out workaround"
    - "Embedded surface: a per-coin composable (koinViewModel keyed by coinId) hosted inside another feature's Scaffold, not a navigable destination"
  store_archetype: OFFLINE_LOCAL_ONLY
  note: >-
    Shares the shipped, DI-wired data layer with feat-watchlist (WatchlistRepository +
    WatchlistDao + WatchlistEntity; AppDatabase v5→v6 adds `personal_watchlist`). The
    AddToWatchlistViewModel + AddToWatchlistStar composable are SHIPPED in
    feature/add-to-watchlist (27 tracked files incl. AddToWatchlistViewModelTest and 19
    translated locales), hosted on CoinMarketsScreen; the screen carries status: implemented.

components:
  - icon_button          # star (filled/outline) — add/remove toggle

screens_summary:
  - { id: add-to-watchlist, composable: AddToWatchlistStar, viewmodel: AddToWatchlistViewModel, states: "content, submitting, submitted, failed", status: implemented, embedded: true }

user_stories:
  - "As a user browsing crypto coins, I want to tap a star to add a coin to my watchlist without leaving the coin surface."
  - "As a user, I want the star to show me at a glance whether a coin is already tracked (filled) or not (outline)."
  - "As a user, I want tapping a filled star to un-track the coin, and it to feel instant."
  - "As a user, I want my watchlist kept private on my device — no account, no sync."

metrics:
  - "coins_added / coins_removed"
  - "star_toggle_taps"
  - "add_from_coin_markets vs add_from_coin_detail"

data_model:
  entity: WatchlistEntity
  table: personal_watchlist
  fields:
    - { name: coinId, type: String, note: "CoinGecko coin id (e.g. 'bitcoin'). Primary key." }
    - { name: addedAtMs, type: Long, note: "epoch millis when added — set to now() on add (REPLACE)" }
  ui_projection:
    dto: WatchlistItem
    fields: [coinId, addedAtMs]

repository_api:
  - "contains(coinId): Flow<Boolean>   — reactive membership (drives filled/outline star)"
  - "add(coinId)    — suspend, idempotent (REPLACE, refreshes addedAtMs to now)"
  - "remove(coinId) — suspend, idempotent (no-op if absent)"

notes:
  - "This is the WRITE half of feat-watchlist. The READ half (WatchlistScreen list + inline remove) lives in screens/watchlist. Both share WatchlistRepository — nothing new is persisted here."
  - "NOT a Store5 store. Reads/writes go direct to WatchlistDao, wrapped in the invalidation bridge (daoFlow{}/notifyingWrite{}) for wasmJs correctness."
  - "The add/remove write is the framework 'input simple' SubmitHandler showcase — the same submit seam a remote mutation uses, but the block is a local Room commit; the SubmitState.Failed arm never trips on-device."
  - "Embedded, route: none. Hosted by feature/crypto's CoinMarkets rows + CoinDetail Scaffolds; not a navigable destination. koinViewModel(key = coinId) with Koin parametersOf(coinId)."
