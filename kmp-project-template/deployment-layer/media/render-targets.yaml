# workspaces/mifos-x/kmp-project-template/release-layer/media/render-targets.yaml
# 5 screens × 8 form factors = 40 PNG targets.
# Per RULE-RELEASE-MEDIA-SINGLE-SOURCE-001 (prompt-driven canonical 2026-06-16).

schema_version: "1.0"

screens:
  01_home:
    title: Home — net worth, bills, rates
    targets:
      - {platform: android, form_factor: phone,      viewport: 1080x1920, dest: deployment/android/metadata/en-US/images/phoneScreenshots/01_home.png}
      - {platform: android, form_factor: tablet_7,   viewport: 1200x1920, dest: deployment/android/metadata/en-US/images/sevenInchScreenshots/01_home.png}
      - {platform: android, form_factor: tablet_10,  viewport: 1920x1200, dest: deployment/android/metadata/en-US/images/tenInchScreenshots/01_home.png}
      - {platform: ios,     form_factor: iphone_6_9, viewport: 1290x2796, dest: deployment/ios/appstore/metadata/screenshots/iPhone_6.9/en-GB/01_home.png}
      - {platform: ios,     form_factor: iphone_6_3, viewport: 1179x2556, dest: deployment/ios/appstore/metadata/screenshots/iPhone_6.3/en-GB/01_home.png}
      - {platform: ios,     form_factor: ipad_13,    viewport: 2048x2732, dest: deployment/ios/appstore/metadata/screenshots/iPad_Pro_13/en-GB/01_home.png}
