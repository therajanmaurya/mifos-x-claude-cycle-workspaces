# PHASE 5 — §vision
# ═══════════════════════════════════════════════════════════════════
vision:
  _tag: "§vision"
  _status: approved
  _quality_score: 92
  _last_updated: "2026-05-02T05:15:00Z"
  _enrichment_count: 1
  _source: "wizard"
  content:
    elevator_pitch: "CommonPurse digitizes the full lifecycle of self-funded community banking groups — meetings, savings, lending, and share-out — with offline-first KMP and Mifos Fineract backend."
    problem_statement: "Millions of people in emerging markets organize into community savings groups (VSLA, ROSCA, ASCA, SHG) to pool savings, issue loans, and distribute profits. These groups operate with paper ledgers, leading to record-keeping errors, fraud, limited transparency, and inability to scale. Existing digital solutions are either online-only, lack Fineract integration, or don't support the full group lifecycle."
    success_metrics:
      - "50+ active groups onboarded within 6 months of launch"
      - "90% reduction in meeting duration vs paper-based workflow"
      - "Zero record-keeping disputes in digitized groups"
      - "95% sync success rate on 2G/3G connections"
      - "< 5 minute onboarding time for new group treasurer"
      - "100% data parity between local cache and Fineract backend after sync"
    target_users:
      - "Everyone self-signs-up through ONE unified login/signup — there is no separate admin vs end-user app. Capabilities auto-resolve per group after login, based on each person's role within that specific group (dt_member_role)."
      - "Organizers (primary identity) — anyone who self-signs-up, creates a group, picks its type, invites members, and runs it as its loan officer. Full write access to the groups they organize."
      - "Group members (treasurer / chairperson / secretary / member) — self-sign-up, join a group via invite link/code, and get the capabilities their per-group role grants (savings, loans, meeting participation, approvals)."
      - "Field officers / NGO program managers (optional supervisory tier) — the same self-signup identity, additionally granted an optional cross-group supervisory view. This is a demoted, opt-in oversight layer, not a required or co-equal admin persona."
    solution_statement: "CommonPurse provides a Kotlin Multiplatform mobile app that digitizes every step of the community banking lifecycle — from group creation and member onboarding, through meeting-driven savings collection and loan disbursement, to periodic share-out — all working offline-first with automatic sync to Mifos Fineract when connectivity is available."
    value_propositions:
      - "Offline-first: full functionality without internet — sync when connected"
      - "Meeting-centric workflow: mirrors how real groups operate (attendance → savings → loans → decisions)"
      - "Fineract-backed: enterprise-grade financial record-keeping via proven open-source core banking"
      - "Low-literacy UX: icon-heavy, minimal text, voice prompts, large touch targets"
      - "Transparent: every member can see group balances, loan status, and share-out projections in real-time"
    scope:
      in_scope:
        - "Group creation, member onboarding, role assignment"
        - "Meeting lifecycle (schedule, attendance, agenda)"
        - "Savings collection (regular contributions, fines, social fund)"
        - "Loan application, approval, disbursement, repayment"
        - "Share-out calculation and distribution"
        - "Offline-first with SQLDelight local cache"
        - "Sync engine for Mifos Fineract (batch API)"
        - "Multi-language support (Swahili, French, Hindi, English)"
        - "Field officer supervision dashboard"
      out_of_scope:
        - "Mobile money integration (Phase 2)"
        - "Inter-group lending (Phase 3)"
        - "Credit scoring / ML risk assessment (Phase 3)"
        - "Web admin dashboard (Phase 2)"
        - "SMS notifications (Phase 2)"
    constraints:
      technical:
        - "Offline-first: app must be fully functional without internet"
        - "Sync latency < 30 seconds on 2G connection"
        - "APK size < 15MB for low-end devices"
        - "Support Android API 24+ (Android 7.0)"
        - "Fineract API compatibility: 1.8.x+"
      business:
        - "Open source (MPL-2.0)"
        - "Must work on low-end Android devices ($50-100 smartphones)"
        - "Must support groups of 5-50 members"
        - "Must comply with local financial record-keeping regulations"
      assumptions:
        - "Users have access to Android smartphones"
        - "At least one group member has occasional internet connectivity"
        - "Groups follow a meeting-based operational model"
        - "Mifos Fineract instance is deployed and accessible"
    known_limitations:
      - description: "iOS support deferred to Phase 2 (Android-first)"
        planned_version: "2.0.0"
      - description: "No real-time notifications in offline mode"
        planned_version: "1.1.0"
      - description: "Single-currency per group"
        planned_version: "1.2.0"
      - description: "No photo-based receipt generation"
        planned_version: "1.1.0"
      - description: "No inter-group fund transfer"
        planned_version: "2.0.0"

# ═══════════════════════════════════════════════════════════════════
# PHASE 6 — §personas
# ═══════════════════════════════════════════════════════════════════
personas:
  _tag: "§personas"
  _status: approved
  _quality_score: 95
  _last_updated: "2026-07-17T00:00:00Z"
  _enrichment_count: 2
  _source: "wizard+global-self-signup-pivot-2026-07-17"
  # ── IDENTITY MODEL (global self-signup pivot, 2026-07-17) ──
  # Identity is UNIFIED — one login/signup for everyone. No up-front client-type
  # selector. After authentication, the app queries which groups the user belongs
  # to and their role in each group. Capabilities are resolved PER GROUP, not
  # app-wide. The same user can be an organizer in one group and a plain member
  # in another. (FR-014, FR-015, ARCHITECTURE.md §1 topology.)
  content:
    personas:
      # ── PRIMARY PERSONA — self-signup ORGANIZER ──
      # The default persona for any new download. Downloads → self-signs-up →
      # creates a group → operates it end-to-end like a loan officer.
      # Role is earned on group creation; not pre-assigned at signup.

      - name: "Kofi"
        role: "Group Organizer (primary persona)"
        identity_model: unified
        role_scope: per_group
        persona_tier: primary
        note: "Self-signup organizer — the default persona for any new user. Kofi downloads the app, signs up without a back-office officer, creates a group, picks its type (VSLA, ROSCA, SHG…), invites members, and runs the full group lifecycle end-to-end. Within his group he holds the organizer role, which grants loan-officer-equivalent capabilities via the companion API's service-credential bridge. In a different group he may simply be a member."
        permissions:
          - "self_signup — registers without back-office involvement"
          - "create_group — creates a group, becomes its organizer"
          - "pick_group_type — selects from 9 seeded types (extensible via config)"
          - "invite_members — generates invite link/code for the group"
          - "create_approve_loans — loan-officer capability for the group"
          - "schedule_run_meetings — full meeting lifecycle"
          - "record_savings — collection + validation"
          - "execute_share_out — cycle close + distribution"
          - "manage_group_settings — group config, roles, policies"
          - "assign_roles — delegate treasurer/chairperson/secretary to members"
        jobs_to_be_done:
          - "Sign up and create a group in under 5 minutes"
          - "Choose the right group type (VSLA, ROSCA, SHG…) from a picker"
          - "Invite community members via link or code"
          - "Run each meeting: attendance → savings → loans → close"
          - "Approve or reject loan requests on behalf of the group"
          - "Execute share-out / rotation payout at end of cycle"
        pain_points:
          - "Current apps require back-office staff to set up a group — Kofi cannot self-serve"
          - "No single app supports both VSLA share-out AND ROSCA rotation payout"
          - "Paper ledgers create disputes that destroy group trust"
        goals:
          - "Zero back-office setup — anyone can start a group"
          - "Type picker that adapts the app to his group's model"
          - "Transparent, verifiable ledger that all members can see"

      # ── PER-GROUP DELEGATED ROLES ──
      # Amina and Joseph are group roles, not separate account types.
      # They are delegated by an organizer within a specific group.
      # Their login is the same unified signup as anyone else.

      - name: "Amina"
        role: "Group Treasurer (delegated role — per group)"
        identity_model: unified
        role_scope: per_group
        persona_tier: delegated_role
        note: "Amina has the same unified login as any user. Within a specific group, the organizer has delegated the treasurer role to her. This grants her transaction-recording capabilities for THAT group only. In another group she may be a plain member. The role is stored in dt_member_role and resolved after login (FR-015)."
        permissions:
          - "record_savings — contributions, fines, individual savings"
          - "record_loan_repayments"
          - "conduct_meeting — can run meeting steps"
          - "manage_attendance — mark present/absent/late, apply auto-penalties"
          - "calculate_share_out — view and initiate distribution"
          - "view_all_members_in_group"
          - "generate_group_reports"
        jobs_to_be_done:
          - "Record savings contributions at each meeting"
          - "Track loan disbursements and repayments"
          - "Calculate share-out amounts at end of cycle"
          - "Mark attendance and apply fines per group rules"
        pain_points:
          - "Paper ledger errors cause disputes and erode trust"
          - "Manual share-out calculations take hours and are error-prone"
          - "No way to verify records between meetings"
        goals:
          - "Accurate, transparent record-keeping"
          - "Faster meeting proceedings (< 1 hour)"
          - "Build trust through verifiable, tamper-evident records"

      - name: "Joseph"
        role: "Group Chairperson (delegated role — per group)"
        identity_model: unified
        role_scope: per_group
        persona_tier: delegated_role
        note: "Joseph has the same unified login as any user. Within a specific group he has been delegated the chairperson role, granting him loan-approval and meeting-governance powers for THAT group. Role resolved post-login from dt_member_role (FR-015)."
        permissions:
          - "approve_loan — approve or reject loan applications"
          - "reject_loan"
          - "schedule_meeting"
          - "conduct_meeting"
          - "initiate_share_out"
          - "manage_group_settings"
          - "view_all_members_in_group"
          - "generate_group_reports"
        jobs_to_be_done:
          - "Schedule and conduct group meetings"
          - "Approve or reject loan requests through the voting workflow"
          - "Resolve disputes using the transparent transaction history"
          - "Initiate share-out at end of cycle"
        pain_points:
          - "Disputes over who paid what"
          - "No visibility into group health between meetings"
        goals:
          - "Smooth, conflict-free meetings"
          - "Real-time group health dashboard"
          - "One-tap reporting for the group"

      # ── MEMBER PERSONA (unified identity, member role) ──

      - name: "Grace"
        role: "Regular Group Member"
        identity_model: unified
        role_scope: per_group
        persona_tier: member
        note: "Grace uses the same unified login/signup as anyone else. In the groups she belongs to, her role is 'member' — she sees her own financial position plus group-level summaries. She cannot record transactions or manage group operations, but she can request a loan, which queues for organizer/chairperson review. Capability is resolved per-group after login (FR-014, FR-015)."
        permissions:
          - "view_own_savings"
          - "view_own_loans"
          - "view_own_attendance"
          - "view_group_summary"
          - "view_meeting_schedule"
          - "view_share_out_projection"
          - "request_loan"
          - "view_own_fine_history"
          - "participate_in_loan_vote"
        restrictions:
          - "cannot_record_transactions — only treasurer/organizer can"
          - "cannot_approve_loans — only chairperson/organizer can"
          - "cannot_view_other_members_details — own data + group totals only"
          - "cannot_manage_group — no settings, no meetings, no share-out"
        jobs_to_be_done:
          - "View personal savings balance and contribution history"
          - "View own loan status and repayment schedule"
          - "See projected share-out amount"
          - "Request a new loan (submitted for organizer/chairperson review)"
          - "View upcoming meeting schedule"
          - "See group summary (total pool, member count — not individual data)"
        pain_points:
          - "Cannot verify own balance between meetings"
          - "Unclear loan terms and remaining balance"
          - "Fear of record manipulation"
          - "No way to request a loan outside of meeting"
        goals:
          - "See own financial position anytime on phone"
          - "Simple, low-literacy interface with icons"
          - "Trust through transparency — verify every transaction"
          - "Submit loan requests before next meeting"

      # ── OPTIONAL SUPERVISORY TIER ──
      # NOT the default identity. David and Sarah are an opt-in tier for
      # MFI / NGO deployments. They do NOT use the self-signup path;
      # they require a back-office-provisioned account. In a pure
      # self-signup deployment this tier may not exist at all. (FR-009.)

      - name: "David"
        role: "MFI Field Officer"
        identity_model: supervisory_tier
        role_scope: cross_group
        persona_tier: optional_supervisory
        note: "OPTIONAL — NOT the default identity (2026-07-17 global self-signup pivot). David is part of an opt-in supervisory tier for MFI/NGO deployments. He requires back-office provisioning; he does not self-signup. In a self-signup-only deployment this persona is absent."
        permissions:
          - "view_all_groups — read-only cross-group monitoring"
          - "view_all_members — read-only"
          - "view_all_transactions — read-only"
          - "run_reports"
          - "force_sync"
        restrictions:
          - "read_only — cannot modify group data or record transactions"
          - "cross_group — can see multiple groups assigned to them"
        jobs_to_be_done:
          - "Monitor multiple groups remotely"
          - "Verify group records during field visits"
          - "Identify at-risk groups early"
        pain_points:
          - "Must physically visit each group to collect data"
          - "Inconsistent record quality across groups"
        goals:
          - "Remote monitoring dashboard"
          - "Auto-sync to Fineract"
          - "Early warning indicators"

      - name: "Sarah"
        role: "NGO Program Manager"
        identity_model: supervisory_tier
        role_scope: cross_group
        persona_tier: optional_supervisory
        note: "OPTIONAL — NOT the default identity (2026-07-17 global self-signup pivot). Sarah is part of an opt-in supervisory tier for NGO program deployments. Requires back-office provisioning. In a self-signup-only deployment this persona is absent."
        permissions:
          - "view_all_groups"
          - "run_reports"
          - "export_data"
          - "view_program_analytics"
        restrictions:
          - "read_only — analytics and reporting only"
        jobs_to_be_done:
          - "Track performance across all groups in program"
          - "Generate donor reports"
          - "Identify best practices and struggling groups"
        pain_points:
          - "Aggregating data from paper records is slow"
          - "Inconsistent metrics across groups"
          - "Limited real-time visibility"
        goals:
          - "Automated program-wide analytics"
          - "Standardized metrics"
          - "Real-time dashboard"

# ═══════════════════════════════════════════════════════════════════
# PHASE 7 — §requirements
# ═══════════════════════════════════════════════════════════════════
requirements:
  _tag: "§requirements"
  _status: approved
  _quality_score: 95
  _last_updated: "2026-05-03T00:00:00Z"
  _enrichment_count: 1
  _source: "wizard"
  content:
    functional_requirements:
      - id: "FR-001"
        description: "Create and configure a new savings group with name, cycle length, meeting schedule, contribution rules, and loan policies"
        priority: must
        acceptance_criteria:
          - "Group created with all required fields"
          - "Configuration saved locally and synced to Fineract Center entity"
          - "Group visible in member list after creation"

      - id: "FR-002"
        description: "Onboard members with name, photo, phone, and role assignment (chairperson, treasurer, secretary, member)"
        priority: must
        acceptance_criteria:
          - "Member created with photo capture"
          - "Role assigned and reflected in UI"
          - "Synced to Fineract Client entity"

      - id: "FR-003"
        description: "Conduct meetings with attendance tracking, savings collection, loan review, and decision recording"
        priority: must
        acceptance_criteria:
          - "Meeting starts with attendance roll call"
          - "Each member's contribution recorded"
          - "Loan requests reviewed and voted on"
          - "Meeting summary generated and saved"

      - id: "FR-004"
        description: "Collect regular savings contributions with amount validation against group rules"
        priority: must
        acceptance_criteria:
          - "Contribution amount validated against min/max rules"
          - "Receipt generated for contributor"
          - "Running balance updated in real-time"
          - "Synced to Fineract Savings Account"

      - id: "FR-005"
        description: "Process loan applications with eligibility check based on savings multiplier rule"
        priority: must
        acceptance_criteria:
          - "Eligibility auto-calculated (savings * multiplier)"
          - "Loan terms (amount, interest, duration) displayed"
          - "Requires approval by chairperson + majority vote"
          - "Synced to Fineract Loan Product"

      - id: "FR-006"
        description: "Track loan repayments with schedule, overdue detection, and fine calculation"
        priority: must
        acceptance_criteria:
          - "Repayment schedule generated at disbursement"
          - "Overdue loans flagged with fine calculation"
          - "Partial payments supported"

      - id: "FR-007"
        description: "Calculate and execute share-out at end of cycle based on savings ratio + profit distribution"
        priority: must
        acceptance_criteria:
          - "Share-out formula: (member_savings / total_savings) * total_pool"
          - "Preview shown to all members before execution"
          - "Execution creates transactions and closes cycle"

      - id: "FR-008"
        description: "Work fully offline with local SQLDelight database and queue-based sync to Fineract"
        priority: must
        acceptance_criteria:
          - "All CRUD operations work without internet"
          - "Sync queue persists across app restarts"
          - "Conflict resolution for concurrent edits"
          - "Sync status indicator visible in UI"

      - id: "FR-009"
        description: "OPTIONAL supervisory tier: field officer / NGO program manager can view and supervise multiple groups with read-only access (demoted from primary identity to an opt-in tier per the 2026-07-17 global self-signup pivot)"
        priority: could
        acceptance_criteria:
          - "Optional tier — NOT part of the default self-signup organizer/member model"
          - "When enabled, field officer sees list of assigned groups (read-only)"
          - "Can drill into group details, meetings, balances; cannot modify group data"

      - id: "FR-010"
        description: "Support multiple languages (English, Swahili, French, Hindi) with runtime switching"
        priority: should
        acceptance_criteria:
          - "All UI strings externalized"
          - "Language picker in settings"
          - "RTL layout support for future Arabic"

      - id: "FR-011"
        description: "Social fund collection and emergency disbursement tracking"
        priority: could
        acceptance_criteria:
          - "Separate social fund balance tracked"
          - "Emergency requests recorded with reason"
          - "Disbursement requires approval"

      - id: "FR-012"
        description: "Fine collection for late attendance, missed meetings, or late loan repayment"
        priority: should
        acceptance_criteria:
          - "Auto-calculated based on group rules"
          - "Fine added to group pool"
          - "Fine history visible to member"

      - id: "FR-013"
        description: "Authentication: self-signup + login through the companion API (Fineract self-service registration bridged to back-office), with local PIN and optional biometric for offline re-auth"
        priority: must
        acceptance_criteria:
          - "Anyone can self-sign-up from the app (self-registration → user + client), no back-office officer required"
          - "Login authenticates the user and returns their group memberships + roles for capability resolution (FR-014)"
          - "Token cached locally for offline re-auth via PIN"
          - "Biometric unlock on supported devices"
          - "Session expires after configurable period"

      - id: "FR-014"
        description: "Single unified login/signup with post-login capability auto-resolution — no up-front client-type selection. Roles (organizer vs member) are resolved AFTER authentication from the groups/roles the user holds, not pre-picked."
        priority: must
        superseded: "Replaces the prior dual client-type (Admin staff vs End User self-service) split — evolve 2026-07-17 global-self-signup pivot"
        acceptance_criteria:
          - "ONE login/signup screen — the client-type-selector gate is removed"
          - "Authenticate once; the app then queries which groups the user belongs to and their role in each"
          - "A user who organizes/owns ≥1 group gets the organizer capability surface for that group; a plain member gets the member surface — resolved per-group, after login"
          - "A user with ZERO groups lands on a 'create your first group / join with an invite code' empty state — never rejected"
          - "The same person can be an organizer in one group and a member in another; the UI resolves capabilities per active group"
          - "Capability resolution is driven by group membership + role, not by a Fineract staff-vs-self-service account distinction"

      - id: "FR-015"
        description: "Group-scoped roles resolved per group: organizer (creates the group, acts as its loan officer), treasurer (record transactions), chairperson (approve loans + run meetings), secretary (notes), member (own data + participate). Roles grant capabilities WITHIN a group, not app-wide."
        priority: must
        acceptance_criteria:
          - "Organizer: full group operation for their group — create/approve loans, schedule + run meetings, record savings, execute share-out (loan-officer-equivalent capability set)"
          - "Treasurer: record savings, repayments, fines, attendance. Cannot approve loans."
          - "Chairperson: all treasurer permissions + approve/reject loans + run meetings + initiate share-out"
          - "Secretary: meeting notes + action items"
          - "Member: view own balance/loans, group summary, request loans, participate in votes"
          - "Role stored per (member, group) in dt_member_role — a person can hold different roles in different groups"
          - "Field officer / program manager cross-group supervision is an OPTIONAL tier (FR-009), not the primary identity"

      - id: "FR-016"
        description: "End user can submit loan request from their personal dashboard, which appears as pending in next admin meeting"
        priority: should
        acceptance_criteria:
          - "End user sees 'Request Loan' button on personal dashboard"
          - "Loan request form with amount, purpose, desired duration"
          - "Eligibility auto-calculated and shown (savings * multiplier)"
          - "Submitted request visible to admins in next meeting agenda"
          - "End user sees request status: pending → approved/rejected"

      # ── VALIDATED GAPS FROM COMMUNITY RESEARCH (CR-003) ──
      # Selectively adopted — only what's genuinely needed for a professional VSLA app.
      # Rejected: org-level dashboard (web concern), DEO persona (treasurer = data entry),
      # share-weighted time-proportional math (over-complex), cooperative earnings split (deployment-specific),
      # advanced meeting patterns (over-engineering for v1).

      - id: "FR-017"
        description: "Dual savings: mandatory group savings (collected at meetings, min/max enforced) and voluntary individual savings (flexible deposits/withdrawals anytime)"
        priority: must
        source_ref: "CR-003"
        acceptance_criteria:
          - "Two savings account types per member: group (mandatory) and individual (voluntary)"
          - "Group savings: min/max per meeting enforced per group rules"
          - "Individual savings: no meeting-tied constraints"
          - "Both tracked separately in dashboards — group savings balance vs individual balance"
          - "Group savings contribute to share-out pool; individual savings are fully owned by member"

      - id: "FR-018"
        description: "Real-time fund balance (corpus) for the group — inflows minus outflows, visible during meetings, blocks loan disbursement when insufficient"
        priority: must
        source_ref: "CR-003"
        acceptance_criteria:
          - "Fund balance = deposits + repayments + penalties - withdrawals - disbursals"
          - "Displayed on group dashboard"
          - "Opening balance shown at meeting start, running total during, closing at end"
          - "Loan disbursement blocked if fund balance would go negative"

      - id: "FR-019"
        description: "Enhanced meeting flow: review previous meeting, separate cash inflows from outflows, fund balance visible throughout, close with opening/closing reconciliation"
        priority: must
        source_ref: "CR-003"
        acceptance_criteria:
          - "Step 0: Review previous meeting (summary, balances, action items)"
          - "Step 1: Attendance (present/absent/late with auto-penalty)"
          - "Step 2: Cash inflows (group savings, individual savings, loan repayments, penalties)"
          - "Step 3: Cash outflows (savings withdrawals, loan disbursements) — blocked if exceeds fund"
          - "Step 4: New loan applications + voting"
          - "Step 5: Notes & action items"
          - "Step 6: Close meeting (opening balance + inflows - outflows = closing balance)"
          - "Fund balance visible on every step"

      - id: "FR-020"
        description: "Penalty for member not meeting minimum group savings contribution at a meeting"
        priority: should
        source_ref: "CR-003"
        acceptance_criteria:
          - "Auto-detected when member deposits below group minimum"
          - "Penalty amount defined in group config"
          - "Collected in current or next meeting"
          - "Visible in member fine history"

      # ── GLOBAL SELF-SIGNUP PIVOT (evolve 2026-07-17) ──
      # Product direction: anyone downloads → self-signs-up → creates/joins a group → invites members → runs it end-to-end.
      # Backend: Fineract-only (ledger) + companion API (extended mcp-mifosx) for missing behavior; datatables for state.
      # Backend is designed later, fully compatible with the abstract contract in ARCHITECTURE.md. No Supabase, no standalone DDD service.

      - id: "FR-021"
        description: "Self-signup registers the user as a group ORGANIZER by default — able to create a group and operate it end-to-end like a loan officer (create/approve loans, schedule + run meetings, record savings, execute share-out)"
        priority: must
        source_ref: "evolve-2026-07-17"
        acceptance_criteria:
          - "After self-signup, the user can immediately create a group"
          - "On creating a group, the creator is its organizer with the loan-officer capability set"
          - "Organizer capability executes back-office group operations via the companion API service-credential bridge (Fineract self-scope cannot do group ops directly)"

      - id: "FR-022"
        description: "Config-driven group_type — every group declares a type modeled on two axes (pool_model: ROTATING_PAYOUT|ACCUMULATING; contribution_model: FIXED|SHARE_BASED_VARIABLE) plus payout/shareout/lending/social-fund/cycle/governance parameters as one GroupTypeConfig. Adding a new type is a config row, not code. See ARCHITECTURE.md#group-type-registry."
        priority: must
        source_ref: "evolve-2026-07-17"
        acceptance_criteria:
          - "Seeded types (9): ROSCA, ASCA, VSLA, SILC, SHG, SACCO/Credit-Union, CBO/Village-Banking, Burial/Welfare-Society, JLG"
          - "A group's type is a GroupTypeConfig instance stored in the group_type_config datatable on m_group"
          - "New types (chit/tanda/stokvel/chama/equb/hagbad…) added as config rows without code changes"
          - "The group-create flow presents a type picker and adapts screens to the selected type's parameters"

      - id: "FR-023"
        description: "Pluggable distribution strategy — payout/share-out is one of several strategies selected by group_type: VSLA/SILC/ASCA pro-rata share-out, ROSCA rotation payout, chit/hui auction/bid"
        priority: must
        source_ref: "evolve-2026-07-17"
        acceptance_criteria:
          - "VSLA/SILC/ASCA: end-of-cycle pro-rata share-out (savings + earnings)"
          - "ROSCA family: rotating payout — one member takes the pot each period per payout_order_method (FIXED_ORDER|LOTTERY|AUCTION|NEED_BASED)"
          - "Distribution compute runs client-side; the companion API executes the resulting Fineract money movements (server-side validation is a later hardening)"

      - id: "FR-024"
        description: "Members join a group via invite link/code — organizer invites; invitees self-register (if new) and are associated to the group"
        priority: must
        source_ref: "evolve-2026-07-17"
        acceptance_criteria:
          - "Organizer generates an invite link/code for their group"
          - "Invitee opens the app, self-signs-up if new, and is associated to the inviting group as a member"
          - "Invite tokens tracked in an invitations datatable; single-use / expiry supported"

      - id: "FR-025"
        description: "Group-type-specific state is stored as Fineract datatables consumed via the companion API: group_type_config, rosca_rotation, rosca_auction, vsla_cycle, welfare_fund. State that maps to Fineract native (savings, loans, calendar, charges, group/center) uses native entities."
        priority: must
        source_ref: "evolve-2026-07-17"
        acceptance_criteria:
          - "Datatables provisioned on m_group/m_client via the companion API's datatable-CRUD tools"
          - "Companion API contract is abstract — backend implementation (extended mcp-mifosx, Fineract-only) is designed later, fully compatible (ARCHITECTURE.md)"

      - id: "FR-026"
        description: "NON-GOALS for v1 (recorded): no standalone heavy DDD backend service, no region-specific payment webhooks (e.g. YAPE/PLIN), no group-level GL/COA accounting in a separate DB, no deployment-time group-type trapdoor. Group-type is a runtime per-group config."
        priority: must
        source_ref: "evolve-2026-07-17"
        acceptance_criteria:
          - "Group-type extensibility is runtime per-group config, never a deployment-time immutable trapdoor"
          - "Domain vocabulary + invariants harvested from the technical DDD doc (corpus, votes-per-share, voting quorum, cash-in-tentative/cash-out-reject, idempotency) — not its heavy architecture"

    data_entities:
      - name: "Group"
        fields:
          - { name: "id", type: "UUID" }
          - { name: "name", type: "String" }
          - { name: "cycle_number", type: "Int" }
          - { name: "cycle_length_months", type: "Int" }
          - { name: "meeting_frequency", type: "Enum(weekly, biweekly, monthly)" }
          - { name: "contribution_min", type: "Decimal" }
          - { name: "contribution_max", type: "Decimal" }
          - { name: "loan_multiplier", type: "Decimal" }
          - { name: "interest_rate", type: "Decimal" }
          - { name: "currency", type: "String" }
          - { name: "fineract_center_id", type: "Long?" }
          - { name: "status", type: "Enum(active, closed, suspended)" }
        relationships:
          - "has_many Members"
          - "has_many Meetings"
          - "has_one SavingsPool"

      - name: "Member"
        fields:
          - { name: "id", type: "UUID" }
          - { name: "name", type: "String" }
          - { name: "phone", type: "String?" }
          - { name: "photo_uri", type: "String?" }
          - { name: "role", type: "Enum(chairperson, treasurer, secretary, member)" }
          - { name: "joined_date", type: "LocalDate" }
          - { name: "fineract_client_id", type: "Long?" }
          - { name: "status", type: "Enum(active, inactive, suspended)" }
        relationships:
          - "belongs_to Group"
          - "has_many SavingsTransactions"
          - "has_many Loans"

      - name: "Meeting"
        fields:
          - { name: "id", type: "UUID" }
          - { name: "meeting_number", type: "Int" }
          - { name: "scheduled_date", type: "LocalDate" }
          - { name: "actual_date", type: "LocalDate?" }
          - { name: "status", type: "Enum(scheduled, in_progress, completed, cancelled)" }
          - { name: "attendance_count", type: "Int" }
          - { name: "total_collected", type: "Decimal" }
          - { name: "notes", type: "String?" }
        relationships:
          - "belongs_to Group"
          - "has_many AttendanceRecords"
          - "has_many SavingsTransactions"

      - name: "SavingsTransaction"
        fields:
          - { name: "id", type: "UUID" }
          - { name: "member_id", type: "UUID" }
          - { name: "meeting_id", type: "UUID" }
          - { name: "amount", type: "Decimal" }
          - { name: "type", type: "Enum(contribution, withdrawal, fine, social_fund)" }
          - { name: "fineract_transaction_id", type: "Long?" }
          - { name: "sync_status", type: "Enum(pending, synced, failed)" }
        relationships:
          - "belongs_to Member"
          - "belongs_to Meeting"

      - name: "Loan"
        fields:
          - { name: "id", type: "UUID" }
          - { name: "member_id", type: "UUID" }
          - { name: "amount", type: "Decimal" }
          - { name: "interest_rate", type: "Decimal" }
          - { name: "duration_weeks", type: "Int" }
          - { name: "status", type: "Enum(requested, approved, disbursed, repaying, closed, defaulted)" }
          - { name: "approved_by", type: "UUID?" }
          - { name: "disbursed_date", type: "LocalDate?" }
          - { name: "fineract_loan_id", type: "Long?" }
          - { name: "sync_status", type: "Enum(pending, synced, failed)" }
        relationships:
          - "belongs_to Member"
          - "has_many LoanRepayments"

      - name: "LoanRepayment"
        fields:
          - { name: "id", type: "UUID" }
          - { name: "loan_id", type: "UUID" }
          - { name: "amount", type: "Decimal" }
          - { name: "meeting_id", type: "UUID?" }
          - { name: "paid_date", type: "LocalDate" }
          - { name: "fineract_transaction_id", type: "Long?" }
          - { name: "sync_status", type: "Enum(pending, synced, failed)" }
        relationships:
          - "belongs_to Loan"

      - name: "AttendanceRecord"
        fields:
          - { name: "id", type: "UUID" }
          - { name: "meeting_id", type: "UUID" }
          - { name: "member_id", type: "UUID" }
          - { name: "present", type: "Boolean" }
          - { name: "late", type: "Boolean" }
          - { name: "fine_amount", type: "Decimal?" }
        relationships:
          - "belongs_to Meeting"
          - "belongs_to Member"

      - name: "SyncQueue"
        fields:
          - { name: "id", type: "UUID" }
          - { name: "entity_type", type: "String" }
          - { name: "entity_id", type: "UUID" }
          - { name: "operation", type: "Enum(create, update, delete)" }
          - { name: "payload_json", type: "String" }
          - { name: "created_at", type: "Instant" }
          - { name: "retry_count", type: "Int" }
          - { name: "last_error", type: "String?" }
          - { name: "status", type: "Enum(pending, in_progress, synced, failed)" }
        relationships:
          - "polymorphic to any entity"

    third_party_services:
      - name: "Mifos Fineract"
        purpose: "Core banking backend — groups (Centers), members (Clients), savings accounts, loan products, transactions"
        integration_type: api
      - name: "SQLDelight"
        purpose: "Local offline database for all entities"
        integration_type: sdk

# ═══════════════════════════════════════════════════════════════════
# PHASE 8 — §features
# ═══════════════════════════════════════════════════════════════════
features:
  _tag: "§features"
  _status: approved
  _quality_score: 97
  _last_updated: "2026-07-17T00:00:00Z"
  _enrichment_count: 3
  _source: "wizard+vsla-best-practices+global-self-signup-pivot-2026-07-17"
  content:
    features:
      - name: "group-management"
        priority: must
        description: "Create, configure, and manage savings groups with cycle parameters and rules. The group-create step now includes a group_type picker (9 seeded types; see group-type-config feature) that adapts subsequent configuration screens to the selected type's parameters."
        requirement_refs: ["FR-001", "FR-022"]
        version: "1.0.0"
        screen_refs: ["group-list", "group-dashboard", "group-create", "group-type-picker"]
        flow_ref: "group-creation-flow"
        api_refs: ["/fineract-provider/api/v1/centers", "/fineract-provider/api/v1/centers/{centerId}", "/fineract-provider/api/v1/datatables/dt_group_config/{entityId}", "/fineract-provider/api/v1/datatables"]
        pivot_note: "group-create now presents a group_type picker as step 1a, driven by the group-type-config feature. The wizard adapts its fields to the selected GroupTypeConfig (e.g. ROSCA shows payout_order_method; VSLA shows share_value + min/max shares). Type is stored in the group_type_config datatable on m_group."
        acceptance_criteria:
          - "Group creation wizard includes a group_type picker (step 1a) with 9 seeded types"
          - "Wizard adapts configuration fields based on selected GroupTypeConfig"
          - "Group type config stored in group_type_config datatable on m_group"
          - "Edit group settings after creation"
          - "View group dashboard with balance, members, next meeting, sync status"
          - "Group configuration synced to Fineract Center + dt_group_config"

      - name: "member-onboarding"
        priority: must
        description: "Add members with photo, assign roles, manage member lifecycle"
        requirement_refs: ["FR-002"]
        version: "1.0.0"
        screen_refs: ["member-list", "member-profile", "member-add"]
        api_refs: ["/fineract-provider/api/v1/clients", "/fineract-provider/api/v1/clients/{clientId}", "/fineract-provider/api/v1/datatables/dt_member_role/{entityId}"]
        acceptance_criteria:
          - "Add member with camera photo capture"
          - "Assign/change roles (chairperson, treasurer, secretary, member)"
          - "View member profile with savings balance, loans, contribution history"
          - "Member synced to Fineract Client entity"

      - name: "meeting-lifecycle"
        priority: must
        description: "Schedule, conduct, and record meetings with attendance and agenda workflow"
        requirement_refs: ["FR-003"]
        version: "1.0.0"
        screen_refs: ["meeting-calendar", "meeting-conduct", "meeting-summary"]
        flow_ref: "meeting-flow"
        api_refs: ["/fineract-provider/api/v1/datatables/dt_meeting_record/{entityId}", "/fineract-provider/api/v1/datatables/dt_meeting_attendance/{entityId}"]
        acceptance_criteria:
          - "Meeting calendar with scheduling and status indicators"
          - "Step-by-step meeting flow: attendance → savings → loans → notes"
          - "Meeting summary with attendance count, total collected, decisions"
          - "Attendance synced to dt_meeting_attendance data table"

      - name: "savings-collection"
        priority: must
        description: "Record member savings contributions with validation and receipt generation"
        requirement_refs: ["FR-004"]
        version: "1.0.0"
        screen_refs: ["savings-dashboard", "meeting-conduct"]
        flow_ref: "meeting-flow"
        api_refs: ["/fineract-provider/api/v1/savingsaccounts", "/fineract-provider/api/v1/savingsaccounts/{accountId}/transactions"]
        acceptance_criteria:
          - "Contribution entry with min/max validation per group rules"
          - "Running balance display per member and group total"
          - "Transaction history per member with date, amount, meeting ref"
          - "Contributions synced to Fineract Savings Account transactions"

      - name: "loan-management"
        priority: must
        description: "Full loan lifecycle: application, eligibility check, approval, disbursement, repayment tracking"
        requirement_refs: ["FR-005", "FR-006"]
        version: "1.0.0"
        screen_refs: ["loan-list", "loan-apply", "loan-detail", "meeting-conduct"]
        flow_ref: "loan-lifecycle-flow"
        api_refs: ["/fineract-provider/api/v1/loans", "/fineract-provider/api/v1/loans/{loanId}", "/fineract-provider/api/v1/loans/{loanId}/transactions"]
        acceptance_criteria:
          - "Loan application with auto-eligibility (savings * multiplier)"
          - "Approval workflow: chairperson + majority vote in meeting"
          - "Repayment schedule auto-generated at disbursement"
          - "Overdue detection with configurable fine calculation"
          - "Loan synced to Fineract Loan Product"

      - name: "share-out"
        priority: must
        description: "End-of-cycle distribution calculation, preview, and execution. Now generalized to support pluggable distribution strategies via the pluggable-distribution feature (FR-023): VSLA/ASCA/SILC pro-rata share-out, ROSCA rotation payout, auction/bid. Strategy is determined by the group's GroupTypeConfig."
        requirement_refs: ["FR-007", "FR-023"]
        version: "1.0.0"
        screen_refs: ["share-out-preview", "share-out-execute"]
        flow_ref: "share-out-flow"
        api_refs: ["/fineract-provider/api/v1/savingsaccounts/{accountId}/transactions?command=withdrawal", "/fineract-provider/api/v1/datatables/dt_share_out/{entityId}"]
        pivot_note: "Generalized by the 2026-07-17 pivot: the distribution strategy is now pluggable (see pluggable-distribution feature). The share-out screen adapts its UI and formula based on GroupTypeConfig.shareout_formula (PRORATA_SHARES / PRORATA_SAVINGS / EQUAL / INVESTMENT_PROPORTIONAL) or delegates to rosca_rotation datatable for rotation payout. Client-side compute; companion API executes Fineract money movements."
        acceptance_criteria:
          - "VSLA/ASCA/SILC: share-out formula driven by GroupTypeConfig.shareout_formula (default: pro-rata savings)"
          - "ROSCA: rotation payout — winner determined by payout_order_method from rosca_rotation datatable"
          - "Preview shows per-member breakdown (amount + formula explanation) before execution"
          - "Execution routes to companion API which executes Fineract GSIM withdrawal / journal / transfer"
          - "New cycle auto-initiated after completion"

      - name: "offline-sync"
        priority: must
        description: "Offline-first via core-base/store from kmp-project-template (Store5 + SQLDelight + Bookkeeper). UI consumes ScreenDataStream → ScreenState. Fineract Batch API drains the Bookkeeper outbox on reconnect."
        requirement_refs: ["FR-008"]
        version: "1.0.0"
        screen_refs: ["sync-status"]
        flow_ref: "offline-sync-flow"
        api_refs: ["/fineract-provider/api/v1/batches"]
        depends_on: ["kmp-project-template:core-base/store"]
        acceptance_criteria:
          - "All CRUD operations work without internet (writes go to Bookkeeper outbox)"
          - "Reads served from SourceOfTruth (SQLDelight); freshness governed by DefaultValidator TTL per entity"
          - "On reconnect, outbox drains via Fineract Batch API in entity-tier order (group-scoped → user-scoped → reports)"
          - "Mutations idempotent via client-UUID keys; safe to retry without server-side duplication"
          - "Sync status indicator surfaces via NetworkMonitor + Bookkeeper queue depth (no per-screen wiring needed)"
          - "Captive-portal detection auto-handled by ScreenDataStream"

      - name: "field-officer-view"
        priority: should
        description: "Read-only supervision of multiple groups for field officers"
        requirement_refs: ["FR-009"]
        version: "1.1.0"
        screen_refs: ["field-officer-dashboard"]
        api_refs: ["/fineract-provider/api/v1/centers", "/fineract-provider/api/v1/runreports/{reportName}", "/fineract-provider/api/v1/datatables/dt_sync_metadata/{entityId}"]
        acceptance_criteria:
          - "Group list with health indicators (active, at-risk, dormant)"
          - "Drill-down to group details, meetings, balances"
          - "Read-only access — cannot modify group data"
          - "Cross-group summary metrics"

      - name: "multi-language"
        priority: should
        description: "Runtime language switching with support for English, Swahili, French, Hindi"
        requirement_refs: ["FR-010"]
        version: "1.0.0"
        screen_refs: ["settings"]
        acceptance_criteria:
          - "Language picker in settings with 4 languages"
          - "All UI strings externalized via Compose resources"
          - "Immediate UI refresh on language switch"

      - name: "social-fund"
        priority: could
        description: "Separate social fund collection and emergency disbursement"
        requirement_refs: ["FR-011"]
        version: "1.1.0"
        api_refs: ["/fineract-provider/api/v1/datatables/dt_social_fund/{entityId}"]
        acceptance_criteria:
          - "Separate social fund balance tracked per group"
          - "Emergency requests recorded with reason and approval"
          - "Disbursement requires chairperson approval"

      - name: "fines-tracking"
        priority: should
        description: "Auto-calculated fines for attendance/payment violations per group rules"
        requirement_refs: ["FR-012"]
        version: "1.0.0"
        screen_refs: ["meeting-conduct"]
        api_refs: ["/fineract-provider/api/v1/charges", "/fineract-provider/api/v1/savingsaccounts/{accountId}/charges", "/fineract-provider/api/v1/datatables/dt_meeting_attendance/{entityId}"]
        acceptance_criteria:
          - "Auto-calculated based on group fine rules"
          - "Fine added to group pool as SavingsTransaction(type=fine)"
          - "Fine history visible to member in profile"

      - name: "end-user-dashboard"
        priority: must
        description: "Personal dashboard for end-user members: own savings, loans, attendance, share-out projection, loan request"
        requirement_refs: ["FR-014", "FR-016"]
        version: "1.0.0"
        screen_refs: ["personal-dashboard", "personal-savings", "personal-loans", "loan-request"]
        acceptance_criteria:
          - "Personal dashboard shows: savings balance, active loans, next meeting, share-out projection"
          - "Savings tab: own contribution history, running balance"
          - "Loans tab: own active/past loans, repayment schedule, status"
          - "Group summary: total pool, member count, next meeting — NO individual member data"
          - "Loan request form: amount, purpose, duration — submitted for admin review"
          - "All data is read-only except loan request submission"

      # ── FEATURES FROM COMMUNITY RESEARCH (CR-003) — professionally curated ──

      - name: "group-linked-savings"
        priority: must
        description: "Dual savings: mandatory group-linked savings (min/max per meeting) separate from voluntary individual savings"
        requirement_refs: ["FR-017", "FR-020"]
        version: "1.0.0"
        screen_refs: ["meeting-conduct", "savings-dashboard", "group-dashboard"]
        api_refs: ["/fineract-provider/api/v1/savingsaccounts", "/fineract-provider/api/v1/savingsaccounts/{accountId}/transactions"]
        source_ref: "CR-003"
        acceptance_criteria:
          - "Two savings products per member: group-linked (mandatory, min/max enforced) and individual (voluntary)"
          - "Group-linked savings collected at every meeting with min/max validation"
          - "Auto-create both savings accounts on member activation"
          - "Separate tracking and balance display for each type"
          - "Penalty auto-triggered if member deposits below minimum"

      - name: "corpus-tracking"
        priority: must
        description: "Real-time group fund/corpus balance — all inflows minus outflows, visible during meetings, blocks excess cash outflows"
        requirement_refs: ["FR-018"]
        version: "1.0.0"
        screen_refs: ["group-dashboard", "meeting-conduct", "meeting-summary"]
        flow_ref: "meeting-flow"
        api_refs: ["/fineract-provider/api/v1/datatables/dt_group_corpus/{entityId}"]
        source_ref: "CR-003"
        acceptance_criteria:
          - "Corpus = deposits + repayments + penalties - withdrawals - disbursals - distributions"
          - "Displayed on group dashboard and during every meeting step"
          - "Opening balance at meeting start, running balance during, closing at end"
          - "Cash outflows blocked when corpus would go negative"

      # ── VSLA / GROUP-BANKING BEST PRACTICES (2026-05-04) ──

      - name: "loan-ceilings"
        priority: must
        description: "Per-group configurable loan ceiling — limits any one member's outstanding loan based on a rule (flat cap, N× savings, or hybrid). Promoted from inline acceptance-criterion to first-class feature so config + audit + per-member overrides are testable and exposed via UI."
        requirement_refs: ["FR-005"]
        version: "1.0.0"
        screen_refs: ["loan-ceiling-config", "loan-apply"]
        api_refs: ["/fineract-provider/api/v1/datatables/dt_group_loan_policy/{entityId}", "/fineract-provider/api/v1/datatables/dt_member_ceiling_override/{entityId}"]
        source_ref: "vsla-best-practices"
        acceptance_criteria:
          - "Group chair/treasurer can set ceiling rule: flat | savings-multiplier | hybrid"
          - "Per-member overrides supported (e.g. high-trust member gets +20%)"
          - "loan-apply screen shows live computed ceiling and rejects amounts that exceed it"
          - "Ceiling rule + overrides versioned (audit trail when changed)"

      - name: "loan-guarantees"
        priority: should
        description: "Group members co-guarantee each other's loans. Each guarantor pledges a pro-rata share against the loan. On default, share-out adjusts proportionally from each guarantor's savings."
        requirement_refs: ["FR-006"]
        version: "1.1.0"
        screen_refs: ["loan-guarantee-select", "loan-detail"]
        flow_ref: "loan-guarantee-flow"
        api_refs: ["/fineract-provider/api/v1/datatables/dt_loan_guarantor/{entityId}"]
        source_ref: "vsla-best-practices"
        acceptance_criteria:
          - "Borrower selects 1–N guarantors during loan-apply"
          - "Each guarantor's pro-rata share displayed; insufficient-savings flagged"
          - "Guarantors confirm in-meeting (recorded with signed_at timestamp)"
          - "On default: dt_loan_guarantor drives proportional savings deduction at next share-out"
          - "Guarantor view in member-profile lists all loans they back"

      - name: "loan-repayment-health"
        priority: should
        description: "Per-loan health score (green/amber/red) computed from payment punctuality, paid-vs-due ratio, and days-overdue. Drives early-warning banner in meeting-conduct so chair sees at-risk loans before approving new disbursements."
        requirement_refs: ["FR-006"]
        version: "1.1.0"
        screen_refs: ["repayment-health-card", "loan-detail", "member-profile", "meeting-conduct"]
        api_refs: ["/fineract-provider/api/v1/loans/{loanId}", "/fineract-provider/api/v1/runreports/loan_repayment_health"]
        source_ref: "vsla-best-practices"
        acceptance_criteria:
          - "Score formula transparent and stored as a Fineract custom report query"
          - "Score recomputed on each repayment + on schedule miss"
          - "Loan-detail and member-profile show traffic-light badge"
          - "Meeting-conduct surfaces at-risk loans before new-loans step"
          - "Field-officer-dashboard aggregates score per group"

      - name: "notifications"
        priority: must
        description: "Push + in-app notifications + activity feed: loan approvals, repayment reminders, meeting invites, guarantor requests, share-out previews. Backed by user-scoped sync tier."
        requirement_refs: ["FR-019"]
        version: "1.0.0"
        screen_refs: ["notification-feed"]
        api_refs: ["/fineract-provider/api/v1/datatables/dt_notification/{entityId}"]
        source_ref: "vsla-best-practices"
        acceptance_criteria:
          - "FCM push for high-priority events (loan approval, meeting reminder T-1h)"
          - "In-app feed for all events with read/unread state"
          - "Notifications survive offline → reconcile on reconnect via user-scoped Bookkeeper"
          - "Per-event-type opt-in/opt-out in settings"

      - name: "member-invitations"
        priority: must
        description: "Organizer generates an invite link/code; invitee self-registers (if new) and is associated to the group as a member. Extended by the global self-signup pivot (FR-024): invite tokens tracked in the invitations datatable via the companion API. Replaces the manual member-add path for remote recruitment; member-add remains for in-meeting walk-up adds."
        requirement_refs: ["FR-002", "FR-024"]
        version: "1.0.0"
        screen_refs: ["member-invite", "join-with-code", "member-list"]
        flow_ref: "member-invitation-flow"
        api_refs: ["/fineract-provider/api/v1/datatables/dt_member_invitation/{entityId}", "/fineract-provider/api/v1/self/registration"]
        source_ref: "vsla-best-practices+evolve-2026-07-17"
        pivot_note: "Extended by global self-signup pivot: invitee self-registers then is auto-associated to the group (no back-office provisioning). Invite tokens in the invitations datatable are provisioned via companion API datatable-CRUD tools."
        acceptance_criteria:
          - "Organizer generates invite link/code (one-time token, expires 7 days, revocable)"
          - "Invitee opens the app, self-registers if new, and is auto-associated to the inviting group as a member"
          - "Invite tokens tracked in the invitations datatable via the companion API"
          - "SMS/email deep-link (app://join?code=XYZ123) launches app with pre-filled join intent"
          - "Audit trail of invitations in dt_member_invitation"

      # ── GLOBAL SELF-SIGNUP PIVOT FEATURES (evolve 2026-07-17) ──

      - name: "unified-auth"
        priority: must
        description: "Single unified login/signup replacing the prior dual client-type (Admin staff vs End User self-service) split. One screen for sign-up and login. After authentication, the app queries the user's group memberships and roles; capabilities are auto-resolved per group (organizer vs member). No up-front client-type selector."
        requirement_refs: ["FR-013", "FR-014", "FR-015"]
        version: "1.0.0"
        screen_refs: ["login-signup"]
        flow_ref: "unified-auth-flow"
        api_refs: ["/companion/auth/self-register", "/companion/auth/login", "/companion/auth/me"]
        source_ref: "evolve-2026-07-17"
        supersedes: "authentication (client-type-selector path)"
        acceptance_criteria:
          - "One login/signup screen — no client-type-selector gate"
          - "Self-signup creates a user (and a linked Fineract client) without back-office provisioning"
          - "Login authenticates via the companion API and returns the user's groups + roles for capability resolution"
          - "A user with zero groups lands on 'create your first group / join with an invite code' empty state — never rejected"
          - "The same person can be an organizer in one group and a member in another; UI resolves capabilities per active group"
          - "Token cached locally for offline re-auth via PIN; optional biometric unlock"

      - name: "self-signup-organizer"
        priority: must
        description: "Self-registration mints an organizer identity — the registering user can immediately create a group and operate it end-to-end (loan-officer equivalent capability set) via the companion API's service-credential bridge. No back-office officer required."
        requirement_refs: ["FR-021", "FR-013"]
        version: "1.0.0"
        screen_refs: ["login-signup", "group-create", "group-type-picker"]
        flow_ref: "self-signup-organizer-flow"
        api_refs: ["/companion/auth/self-register", "/companion/groups/create", "/companion/groups/{id}/activate"]
        source_ref: "evolve-2026-07-17"
        acceptance_criteria:
          - "After self-signup the user can immediately create a group"
          - "On creating a group, the creator is auto-assigned the organizer role for that group"
          - "Organizer capability executes back-office group operations via the companion API (Fineract service credential)"
          - "Organizer can run meetings, approve loans, record savings, execute share-out — all for their group"

      - name: "group-type-config"
        priority: must
        description: "Config-driven group_type — every group declares a type modeled on two axes (pool_model: ROTATING_PAYOUT|ACCUMULATING|NONE; contribution_model: FIXED|SHARE_BASED_VARIABLE) with a GroupTypeConfig object capturing all payout, lending, social-fund, cycle, and governance parameters. Adding a new group type is a config row, not code. 9 seeded types. See ARCHITECTURE.md#group-type-registry."
        requirement_refs: ["FR-022"]
        version: "1.0.0"
        screen_refs: ["group-type-picker", "group-create"]
        api_refs: ["/companion/datatables/group_type_config/{groupId}"]
        source_ref: "evolve-2026-07-17"
        acceptance_criteria:
          - "Seeded types (9): ROSCA, ASCA, VSLA, SILC, SHG, SACCO/Credit-Union, CBO/Village-Banking, Burial/Welfare-Society, JLG"
          - "Each type is a GroupTypeConfig instance in the group_type_config datatable on m_group"
          - "New types (chit/tanda/stokvel/chama/equb/hagbad…) are added as config rows without code changes"
          - "Group-create flow presents a type picker and adapts subsequent screens to the selected type's parameters"
          - "GroupTypeConfig schema: pool_model, payout_order_method, shareout_formula, contribution_model, share_value, lending flags, social_fund flags, cycle_model, meeting_cadence, governance fields (per ARCHITECTURE.md §4)"

      - name: "pluggable-distribution"
        priority: must
        description: "Payout / share-out strategy is selected by the group_type. VSLA/SILC/ASCA: end-of-cycle pro-rata share-out (savings + earnings). ROSCA family: rotating payout — one member takes the pot each period per payout_order_method (FIXED_ORDER/LOTTERY/AUCTION/NEED_BASED). Distribution compute runs client-side; the companion API executes the resulting Fineract money movements."
        requirement_refs: ["FR-023", "FR-007"]
        version: "1.0.0"
        screen_refs: ["share-out-preview", "share-out-execute"]
        flow_ref: "share-out-flow"
        api_refs: ["/companion/distribution/execute", "/companion/datatables/rosca_rotation/{groupId}", "/companion/datatables/vsla_cycle/{groupId}"]
        source_ref: "evolve-2026-07-17"
        pivot_note: "Extends share-out feature with pluggable strategies. The share-out feature now delegates to this feature for distribution-strategy selection and execution."
        acceptance_criteria:
          - "VSLA/SILC/ASCA: pro-rata share-out (member_savings / total_savings × total_pool + earnings)"
          - "ROSCA family: rotating payout — pot goes to one member per period; order stored in rosca_rotation datatable"
          - "Auction/bid (chit/hui): bid amount determines payout order; state in rosca_auction datatable"
          - "Distribution compute is client-side; companion API executes the resulting Fineract GSIM withdrawal / journal / transfer"
          - "Strategy is driven entirely by the group's GroupTypeConfig — no hardcoded type checks in UI code"

