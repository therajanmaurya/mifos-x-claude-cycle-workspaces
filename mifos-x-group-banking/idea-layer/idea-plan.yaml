  _source: "wizard+claude-enrich-260504+claude-tune-260505"
  content:
    # ─── Brand tuning rationale (why these specific shades) ───
    _brand_tuning:
      anchors:
        primary:   "#2E7D32  — deep VSLA-green, evokes growth + trust; passes WCAG AA on white"
        secondary: "#FF8F00  — warm amber, evokes shared coin / harvest; high contrast vs primary"
        tertiary:  "#1565C0  — trust-blue reserved for informational chips + links"
      derivation: "Material Theme Builder algorithm with primary=#2E7D32, secondary=#FF8F00, tertiary=#1565C0; tonal palettes generated, role-mapped to M3 v3 spec."
      cultural_notes:
        - "Green primary aligns with East-African agricultural / community symbolism (matches CARE VSLA branding)."
        - "Amber secondary distinct from gold (avoids 'wealth' connotation that may misalign with VSLA mutual-aid ethos)."
        - "Avoided red as a high-frequency role color — reserved strictly for error states (not 'danger' for member actions, which can read as accusatory in low-trust contexts)."
      contrast_audit:
        primary_on_white:    "5.83:1 ✓ AAA"
        on_primary_on_primary: "13.5:1 ✓ AAA"
        secondary_on_white:  "3.21:1 ✓ AA-large only — use only for surfaces ≥18sp or icons"
        error_on_white:      "5.91:1 ✓ AAA"

    # Material 3 role-mapped color palette — light + dark
    color_palette:
      light:
        primary: "#2E7D32"
        on_primary: "#FFFFFF"
        primary_container: "#A6F1A6"
        on_primary_container: "#002106"
        secondary: "#FF8F00"
        on_secondary: "#FFFFFF"
        secondary_container: "#FFDDB3"
        on_secondary_container: "#2A1700"
        tertiary: "#1565C0"
        on_tertiary: "#FFFFFF"
        tertiary_container: "#D2E4FF"
        on_tertiary_container: "#001C39"
        error: "#D32F2F"
        on_error: "#FFFFFF"
        error_container: "#FFDAD6"
        on_error_container: "#410002"
        background: "#FFFFFF"
        on_background: "#1A1C19"
        surface: "#FAFAFA"
        on_surface: "#1A1C19"
        surface_variant: "#DEE5DA"
        on_surface_variant: "#424942"
        outline: "#727971"
        outline_variant: "#C2C9BD"
        scrim: "#000000"
        inverse_surface: "#2F312D"
        inverse_on_surface: "#F0F1EB"
        inverse_primary: "#8BD68F"
      dark:
        primary: "#8BD68F"
        on_primary: "#003910"
        primary_container: "#00531A"
        on_primary_container: "#A6F1A6"
        secondary: "#FFB95C"
        on_secondary: "#472A00"
        secondary_container: "#653E00"
        on_secondary_container: "#FFDDB3"
        tertiary: "#9FCAFF"
        on_tertiary: "#00325B"
        tertiary_container: "#004A82"
        on_tertiary_container: "#D2E4FF"
        error: "#FFB4AB"
        on_error: "#690005"
        error_container: "#93000A"
        on_error_container: "#FFDAD6"
        background: "#1A1C19"
        on_background: "#E2E3DD"
        surface: "#121412"
        on_surface: "#E2E3DD"
        surface_variant: "#424942"
        on_surface_variant: "#C2C9BD"
        outline: "#8C9388"
        outline_variant: "#424942"
        scrim: "#000000"
        inverse_surface: "#E2E3DD"
        inverse_on_surface: "#2F312D"
        inverse_primary: "#2E7D32"

    # Material 3 type scale (sp + lh + tracking)
    typography:
      font_family: "Noto Sans"
      font_family_brand: "Noto Sans"
      scale_style: "large"  # accessibility — scale up for low-vision rural users
      type_scale:
        display_large:   { size_sp: 57, line_height_sp: 64, tracking_sp: -0.25, weight: 400 }
        display_medium:  { size_sp: 45, line_height_sp: 52, tracking_sp: 0,     weight: 400 }
        display_small:   { size_sp: 36, line_height_sp: 44, tracking_sp: 0,     weight: 400 }
        headline_large:  { size_sp: 32, line_height_sp: 40, tracking_sp: 0,     weight: 400 }
        headline_medium: { size_sp: 28, line_height_sp: 36, tracking_sp: 0,     weight: 400 }
        headline_small:  { size_sp: 24, line_height_sp: 32, tracking_sp: 0,     weight: 400 }
        title_large:     { size_sp: 22, line_height_sp: 28, tracking_sp: 0,     weight: 500 }
        title_medium:    { size_sp: 16, line_height_sp: 24, tracking_sp: 0.15,  weight: 500 }
