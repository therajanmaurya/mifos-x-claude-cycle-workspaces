# PHASE 9 — §screens
# ═══════════════════════════════════════════════════════════════════
screens:
  _tag: "§screens"
  _status: approved
  _quality_score: 95
  _last_updated: "2026-07-17T00:00:00Z"
  _enrichment_count: 3
  _source: "wizard+vsla-best-practices+global-self-signup-pivot-2026-07-17"
  content:
    screens:
      - name: "login-signup"
        archetype: "form"
        feature_refs: ["unified-auth", "self-signup-organizer"]
        source_ref: "evolve-2026-07-17"
        description: "Unified entry screen: sign up (name, email/phone, password) OR log in. Single screen for all users — no client-type selector. On signup, creates a user + linked Fineract client via companion API self-registration. On login, authenticates and fetches the user's groups + roles for per-group capability resolution. Zero-group state shows 'create your first group / join with an invite code'. PIN/biometric for offline re-auth."

      - name: "group-type-picker"
        archetype: "form"
        feature_refs: ["group-type-config", "group-management"]
        source_ref: "evolve-2026-07-17"
        description: "Step 1a of the group-create wizard: pick the group type from the 9 seeded types (VSLA, ROSCA, ASCA, SILC, SHG, SACCO/Credit-Union, CBO/Village-Banking, Burial/Welfare-Society, JLG). Each type card shows a brief description and distinguishing features. Selection loads the corresponding GroupTypeConfig which adapts the remaining wizard steps. Can also be surfaced inline within group-create as a wizard step rather than a separate screen."

      - name: "join-with-code"
        archetype: "form"
        feature_refs: ["member-invitations", "unified-auth"]
        source_ref: "evolve-2026-07-17"
        description: "Invitee enters (or deep-links with) an invite code to join a group. If not yet registered, redirects to login-signup first; after registration, the invite code is matched and the user is auto-associated to the inviting group as a member. Shows the group name, type, and organizer before confirmation. Invite token validated via companion API invitations datatable."

      - name: "personal-dashboard"
        archetype: "dashboard"
        feature_refs: ["end-user-dashboard"]
        description: "End User home: savings balance (group-linked + individual), loan balance, next meeting, share-out projection, loan request button. Recent transactions list."

      - name: "personal-savings"
        archetype: "detail_screen"
        feature_refs: ["end-user-dashboard"]
        description: "End User savings: own contribution history, running balance, visual chart"

      - name: "personal-loans"
        archetype: "index_list"
        feature_refs: ["end-user-dashboard"]
        description: "End User loans: own active/past loans with status, repayment schedule"

      - name: "loan-request"
        archetype: "form"
        feature_refs: ["end-user-dashboard"]
        description: "End User loan request: amount, purpose, duration. Shows eligibility. Submitted for admin approval."

      - name: "group-list"
        archetype: "index_list"
        feature_refs: ["group-management"]
        description: "List of user's groups with status badges and key metrics"

      - name: "group-dashboard"
        archetype: "dashboard"
        feature_refs: ["group-management", "corpus-tracking", "group-linked-savings"]
        description: "Group overview: corpus/fund balance, group savings vs individual savings, members (active/inactive), attendance rate, next meeting, outstanding loans, cycle progress (savings goal vs actual, meetings completed, cycle remaining), member overview table with savings/loans/status"

      - name: "group-create"
        archetype: "form"
        feature_refs: ["group-management"]
        description: "Multi-step group creation wizard with cycle and rule configuration"

      - name: "member-list"
        archetype: "index_list"
        feature_refs: ["member-onboarding"]
        description: "Group members with roles, photos, and savings summary"

      - name: "member-profile"
        archetype: "detail_screen"
        feature_refs: ["member-onboarding"]
        description: "Member details: savings balance, loans, contribution history"

      - name: "member-add"
        archetype: "form"
        feature_refs: ["member-onboarding"]
        description: "Add member with photo capture and role assignment"

      - name: "meeting-calendar"
        archetype: "index_list"
        feature_refs: ["meeting-lifecycle"]
        description: "Upcoming and past meetings with status indicators"

      - name: "meeting-conduct"
        archetype: "form"
        feature_refs: ["meeting-lifecycle", "savings-collection", "loan-management", "corpus-tracking", "group-linked-savings", "fines-tracking"]
        description: "Step-by-step meeting flow: (0) review previous meeting → (1) attendance with auto-penalties → (2) savings collection (group + individual) → (3) loan repayments → (4) withdrawals/disbursements (blocked if exceeds corpus) → (5) new loans → (6) minutes/notes → (7) review & close with opening/closing fund balance. Running corpus balance visible on every step."

      - name: "meeting-summary"
        archetype: "detail_screen"
        feature_refs: ["meeting-lifecycle"]
        description: "Meeting results: attendance, collections, decisions, next steps"

      - name: "savings-dashboard"
        archetype: "dashboard"
        feature_refs: ["savings-collection", "group-linked-savings"]
        description: "Dual savings view: group-linked savings (mandatory, per-member breakdown) vs individual savings (voluntary). Per-member table with group savings balance, individual savings balance, last contribution. Savings growth trend graph."

      - name: "loan-list"
        archetype: "index_list"
        feature_refs: ["loan-management"]
        description: "Active loans with status, amounts, and next payment due"

      - name: "loan-apply"
        archetype: "form"
        feature_refs: ["loan-management"]
        description: "Loan application with eligibility calculator and term selection"

      - name: "loan-detail"
        archetype: "detail_screen"
        feature_refs: ["loan-management"]
        description: "Loan details: schedule, payments, remaining balance, status history"

      - name: "share-out-preview"
        archetype: "detail_screen"
        feature_refs: ["share-out"]
        description: "End-of-cycle share-out preview: total pool, profit earned (interest + fees + penalties), per-member breakdown by savings ratio. Shows: total pool, profit, per-member share amount + percentage."

      - name: "share-out-execute"
        archetype: "form"
        feature_refs: ["share-out"]
        description: "Confirmation and execution of share-out distribution"

      - name: "sync-status"
        archetype: "dashboard"
        feature_refs: ["offline-sync"]
        description: "Sync queue status, pending items, last sync time, conflict resolution"

      - name: "field-officer-dashboard"
        archetype: "dashboard"
        feature_refs: ["field-officer-view"]
        description: "Multi-group overview for field officers with health indicators"

      - name: "settings"
        archetype: "settings"
        feature_refs: ["multi-language"]
        description: "App settings: language, PIN, sync preferences, about"

      # ── SCREEN FROM COMMUNITY RESEARCH (CR-003) — professionally curated ──

      - name: "previous-meeting-review"
        archetype: "detail_screen"
        feature_refs: ["meeting-lifecycle"]
        source_ref: "CR-003"
        description: "Review previous meeting before starting new one: attendance summary, cash/bank balances, total inflows/outflows, decisions made, action items from last meeting. Shown as Step 0 of meeting-conduct flow."

      # ── VSLA / GROUP-BANKING BEST-PRACTICE SCREENS (2026-05-04) ──

      - name: "member-invite"
        archetype: "form"
        feature_refs: ["member-invitations"]
        source_ref: "vsla-best-practices"
        description: "Invite new member via SMS or email: enter phone/email, optionally pre-assign role. Generates one-time stewardship code; recipient joins via deep-link. Replaces member-add for the common (remote-recruit) path; member-add stays for in-meeting walk-up adds."

      - name: "loan-guarantee-select"
        archetype: "form"
        feature_refs: ["loan-guarantees"]
        source_ref: "vsla-best-practices"
        description: "Pick guarantors for a loan request: list of group members with own-savings balance shown. Member-borrower selects 1–N guarantors. System computes pro-rata share each must cover; flags any guarantor whose savings would be insufficient."

      - name: "loan-ceiling-config"
        archetype: "form"
        feature_refs: ["loan-ceilings"]
        source_ref: "vsla-best-practices"
        description: "Per-group loan-ceiling rule editor (chair/treasurer only): set ceiling formula — flat cap, savings-multiplier (e.g. 3× savings), or hybrid. Optionally per-member overrides for high-trust members. Persists to dt_group_loan_policy."

      - name: "repayment-health-card"
        archetype: "detail_screen"
        feature_refs: ["loan-repayment-health"]
        source_ref: "vsla-best-practices"
        description: "Component (embedded in loan-detail and member-profile): traffic-light health score for a loan based on payment punctuality, paid-vs-due ratio, days-overdue. Drives early-warning banner in meeting-conduct so chair sees at-risk loans before disbursement step."

      - name: "notification-feed"
        archetype: "index_list"
        feature_refs: ["notifications"]
        source_ref: "vsla-best-practices"
        description: "In-app notification + activity feed: loan approvals, repayment reminders, meeting invites, guarantor requests, share-out previews. Marks read on view. Backed by user-scoped Bookkeeper sync tier."

# ═══════════════════════════════════════════════════════════════════
# PHASE 10 — §flows
# ═══════════════════════════════════════════════════════════════════
flows:
  _tag: "§flows"
  _status: approved
  _quality_score: 92
  _last_updated: "2026-05-04T06:45:00Z"
  _enrichment_count: 2
  _source: "wizard+vsla-best-practices"
  content:
    flows:
      - name: "group-creation-flow"
        type: happy
        feature_ref: "group-management"
        steps:
          - "Login → group-list"
          - "Tap + → group-create (step 1: name, cycle length)"
          - "Step 2: meeting frequency, contribution rules"
          - "Step 3: loan policies (multiplier, interest)"
          - "Review & Create → group-dashboard"
          - "Sync to Fineract Center"

      - name: "meeting-flow"
        type: happy
        feature_ref: "meeting-lifecycle"
        source_ref: "CR-003"
        steps:
          - "group-dashboard → Start Meeting (show opening fund balance)"
          - "Step 0 — previous-meeting-review: last meeting summary, balances, action items"
          - "Step 1 — Attendance: roll call, mark present/absent/late, auto-penalty"
          - "Step 2 — Savings Collection: group-linked + individual savings deposits"
          - "Step 3 — Loan Repayments: collect principal + interest"
          - "Step 4 — Withdrawals/Disbursements: blocked if exceeds corpus"
          - "Step 5 — New Loans: application, eligibility, voting, approve/reject"
          - "Step 6 — Notes & Action Items"
          - "Step 7 — Review & Close: opening + inflows - outflows = closing balance"
          - "meeting-summary → Close Meeting"
          - "Sync all transactions"

      - name: "loan-lifecycle-flow"
        type: happy
        feature_ref: "loan-management"
        steps:
          - "member-profile → Request Loan"
          - "loan-apply: eligibility check, amount, terms"
          - "Meeting: loan request presented → group votes"
          - "Approved → disbursement recorded"
          - "loan-detail: repayment tracking"
          - "Meeting: repayment collected → marked paid"
          - "Loan closed when fully repaid"

      - name: "share-out-flow"
        type: happy
        feature_ref: "share-out"
        steps:
          - "group-dashboard → Initiate Share-Out"
          - "Compute profit: loan interest received + fees + penalties"
          - "Compute per-member share: (member_savings / total_savings) * total_pool"
          - "share-out-preview: per-member breakdown with savings return + profit share"
          - "Group reviews and confirms"
          - "share-out-execute: distribute to each member (withdrawal transactions)"
          - "Cycle closed → historical record saved → new cycle started"

      - name: "offline-sync-flow"
        type: happy
        feature_ref: "offline-sync"
        steps:
          - "User works offline (all CRUD operations)"
          - "Transactions queued in sync_queue table"
          - "Connectivity detected → auto-sync triggers"
          - "Batch API sends queued items to Fineract"
          - "Conflicts detected → conflict resolution UI"
          - "sync-status updated with results"

      - name: "unified-auth-flow"
        type: happy
        feature_ref: "unified-auth"
        steps:
          - "App launch → check for cached token (single unified session — no client_type)"
          - "No token → single login/signup screen (no client-type selector): existing users log in, new users self-sign-up via companion API (mcp-mifosx)"
          - "Authenticate via companion API → cache unified session token"
          - "Post-login role resolution: read dt_member_role across the user's groups → resolve per-group capabilities (organizer vs member)"
          - "Set up local PIN for offline access; optional biometric unlock"
          - "Zero-group user → create/join empty state (prompt to create a group or join with a code)"
          - "Has groups → land in the single shared navigation graph: organizer → organizer-dashboard, member → member view; navigation adapts to the resolved per-group role"

      - name: "self-signup-organizer-flow"
        type: happy
        feature_ref: "self-signup-organizer"
        steps:
          - "New user self-signs-up via companion API (mcp-mifosx) → unified session created"
          - "Create-group empty state → 'Create a group'"
          - "Pick group type (9 config-driven types via 2-axis GroupTypeConfig; writes dt_group_type_config)"
          - "Companion API provisions the group + associates the creator as organizer (loan officer of record)"
          - "Invite members via link/code (deep-link app://join?code=XYZ + 6-char code, dt_companion_invitations)"
          - "Organizer runs the group: schedule meetings, collect savings, disburse/approve loans, drive share-out"

      - name: "end-user-loan-request-flow"
        type: happy
        feature_ref: "end-user-dashboard"
        steps:
          - "personal-dashboard → 'Request Loan' button"
          - "loan-request form: enter amount, purpose, duration"
          - "Eligibility auto-calculated: (own_savings * group_loan_multiplier)"
          - "If eligible → submit request (stored in dt_loan_request on m_client)"
          - "Show confirmation: 'Your request will be reviewed at next meeting'"
          - "Request appears in admin's meeting agenda automatically"
          - "End user checks status: personal-loans → loan status badge"

      - name: "sync-conflict-flow"
        type: error
        feature_ref: "offline-sync"
        steps:
          - "Sync detects server version differs from local"
          - "Show conflict resolution UI with both versions"
          - "User selects: keep local / accept server / merge"
          - "Resolution applied, sync retried"
          - "If unresolvable → flag for field officer review"

      - name: "loan-rejection-flow"
        type: edge
        feature_ref: "loan-management"
        steps:
          - "Loan request presented in meeting"
          - "Group votes: majority rejects"
          - "Loan marked as rejected with reason"
          - "Member notified, can re-apply next meeting"

      # ── FLOW FROM COMMUNITY RESEARCH (CR-003) — professionally curated ──

      - name: "corpus-outflow-blocked-flow"
        type: error
        feature_ref: "corpus-tracking"
        source_ref: "CR-003"
        steps:
          - "During meeting withdrawals/disbursements: user attempts cash outflow"
          - "System checks: would corpus go negative after this transaction?"
          - "If yes → show error: 'Insufficient group funds. Available: X, Requested: Y'"
          - "Transaction blocked — user can reduce amount or skip"

      # ── VSLA / GROUP-BANKING BEST-PRACTICE FLOWS (2026-05-04) ──

      - name: "member-invitation-flow"
        type: happy
        feature_ref: "member-invitations"
        source_ref: "vsla-best-practices"
        steps:
          - "member-list → Invite Member"
          - "member-invite form: enter phone or email + role pre-selection"
          - "System generates one-time stewardship code (6-char) + invitation row in dt_member_invitation"
          - "Send link via SMS/email (deep-link: app://join?code=XYZ123)"
          - "Invitee taps link → app launches → join-with-code screen (single unified flow — no client-type selector)"
          - "Invitee logs in or self-signs-up via the unified login/signup (companion API creates the account if first-time)"
          - "App matches stewardship code → auto-associates invitee to the group, per-group role applied"
          - "Group admin sees activated member in member-list; original invite row marked accepted"

      - name: "loan-guarantee-flow"
        type: happy
        feature_ref: "loan-guarantees"
        source_ref: "vsla-best-practices"
        steps:
          - "loan-apply → after eligibility passes, navigate to loan-guarantee-select"
          - "Pick 1–N group members as guarantors (each must have own savings ≥ pro-rata share)"
          - "Submit request → guarantors receive in-app notification (notifications feature)"
          - "Meeting: loan request shown WITH guarantor list; guarantors confirm in-meeting (signature/voice/video)"
          - "On meeting approval, guarantee rows written to dt_loan_guarantor (loan_id, guarantor_client_id, share_pct, signed_at)"
          - "If loan defaults: dt_loan_guarantor drives proportional deduction from guarantor savings (next share-out adjustment)"

# ═══════════════════════════════════════════════════════════════════
# PHASE 11 — §api_surface
# ═══════════════════════════════════════════════════════════════════
api_surface:
  _tag: "§api_surface"
  _status: approved
  _quality_score: 97
  _last_updated: "2026-07-17T00:00:00Z"
  _enrichment_count: 4
  _source: "wizard+mcp_ingest+bridge-260504-001+global-self-signup-pivot-2026-07-17"
  external_api_ref: "API-001"
  content:
    # ─────────────────────────────────────────────────────────────
    # FINERACT DATA TABLES — CUSTOM API DESIGN SYSTEM
    # ─────────────────────────────────────────────────────────────
    # Data Tables are NOT just storage — they are a FULL API DESIGN
    # mechanism. You can CREATE new tables (= design new REST endpoints)
    # attached to any Fineract entity, with typed columns and full CRUD.
    #
    # Capability via MCP:
    #   create_datatable    → POST /datatables (CREATE TABLE with schema)
    #   create_datatable_entry → POST /datatables/{name}/{entityId}
    #   get_datatable_entries  → GET  /datatables/{name}/{entityId}
    #   update_datatable_entry → PUT  /datatables/{name}/{entityId}
    #   delete_datatable_entry → DELETE /datatables/{name}/{entityId}
    #
    # Attachable to: m_client, m_group, m_loan, m_savings_account, m_office, m_center
    # Column types:  string, int, decimal, boolean, date, datetime, text, dropdown
    # ─────────────────────────────────────────────────────────────

    endpoints:
      # ── Authentication ──
      - path: "/fineract-provider/api/v1/authentication"
        method: POST
        description: "Authenticate with Fineract (username/password → base64 basic auth → token)"
        auth_required: false
        source: external_api
        source_ref: "API-001"
        mcp_tool: null

      # ── Centers (= CommonPurse Groups) ──
      - path: "/fineract-provider/api/v1/centers"
        method: POST
        description: "Create a new center (maps to CommonPurse Group entity)"
        auth_required: true
        source: external_api
        mcp_tool: "create_new_center"

      - path: "/fineract-provider/api/v1/centers/{centerId}"
        method: GET
        description: "Get center details with associations (groups, members)"
        auth_required: true
        source: external_api
        mcp_tool: "get_center"

      - path: "/fineract-provider/api/v1/centers"
        method: GET
        description: "List all centers (field officer group listing)"
        auth_required: true
        source: external_api
        mcp_tool: "list_all_centers"

      # ── Groups (Fineract sub-groups within center — for loan products) ──
      - path: "/fineract-provider/api/v1/groups"
        method: POST
        description: "Create lending sub-group within center for group loan products"
        auth_required: true
        source: external_api
        mcp_tool: "create_lending_group"

      - path: "/fineract-provider/api/v1/groups/{groupId}"
        method: GET
        description: "Get group details"
        auth_required: true
        source: external_api
        mcp_tool: "get_group"

      - path: "/fineract-provider/api/v1/groups/{groupId}?command=activate"
        method: POST
        description: "Activate a pending group"
        auth_required: true
        source: external_api
        mcp_tool: "activate_pending_group"

      - path: "/fineract-provider/api/v1/groups/{groupId}?command=associateClients"
        method: POST
        description: "Add a client member to a group"
        auth_required: true
        source: external_api
        mcp_tool: "add_member_to_group"

      # ── Clients (= CommonPurse Members) ──
      - path: "/fineract-provider/api/v1/clients"
        method: POST
        description: "Create a new client (maps to CommonPurse Member entity)"
        auth_required: true
        source: external_api
        mcp_tool: "create_new_client"

      - path: "/fineract-provider/api/v1/clients/{clientId}"
        method: GET
        description: "Get client details with accounts summary"
        auth_required: true
        source: external_api
        mcp_tool: "get_client"

      - path: "/fineract-provider/api/v1/clients/{clientId}?command=activate"
        method: POST
        description: "Activate a pending client"
        auth_required: true
        source: external_api
        mcp_tool: "activate_pending_client"

      - path: "/fineract-provider/api/v1/clients/{clientId}/accounts"
        method: GET
        description: "Get all accounts (savings + loans) for a client"
        auth_required: true
        source: external_api
        mcp_tool: "get_client_accts"

      - path: "/fineract-provider/api/v1/clients/{clientId}/identifiers"
        method: POST
        description: "Add identity document for a client (national ID, etc.)"
        auth_required: true
        source: external_api
        mcp_tool: "add_identifier"

      - path: "/fineract-provider/api/v1/search?query={term}"
        method: GET
        description: "Search clients by name, external ID, or account number"
        auth_required: true
        source: external_api
        mcp_tool: "search_clients"

      # ── Savings Accounts ──
      - path: "/fineract-provider/api/v1/savingsaccounts"
        method: POST
        description: "Create savings account for member (linked to savings product)"
        auth_required: true
        source: external_api
        mcp_tool: "create_savings"

      - path: "/fineract-provider/api/v1/savingsaccounts/{accountId}"
        method: GET
        description: "Get savings account details with balance, status"
        auth_required: true
        source: external_api
        mcp_tool: "get_savings"

      - path: "/fineract-provider/api/v1/savingsaccounts/{accountId}?command=approve"
        method: POST
        description: "Approve and activate a savings account"
        auth_required: true
        source: external_api
        mcp_tool: "approve_activate_savings"

      - path: "/fineract-provider/api/v1/savingsaccounts/{accountId}/transactions?command=deposit"
        method: POST
        description: "Record savings deposit (member contribution)"
        auth_required: true
        source: external_api
        mcp_tool: "deposit"

      - path: "/fineract-provider/api/v1/savingsaccounts/{accountId}/transactions?command=withdrawal"
        method: POST
        description: "Record savings withdrawal (share-out distribution)"
        auth_required: true
        source: external_api
        mcp_tool: "withdraw"

      - path: "/fineract-provider/api/v1/savingsaccounts/{accountId}/transactions"
        method: GET
        description: "Get all transactions for a savings account"
        auth_required: true
        source: external_api
        mcp_tool: "get_savings_txns"

      - path: "/fineract-provider/api/v1/savingsaccounts/{accountId}/charges"
        method: POST
        description: "Apply fee/charge to savings account (fines)"
        auth_required: true
        source: external_api
        mcp_tool: "apply_savings_fee"

      - path: "/fineract-provider/api/v1/savingsaccounts/{accountId}?command=close"
        method: POST
        description: "Close savings account (end of cycle)"
        auth_required: true
        source: external_api
        mcp_tool: "close_savings"

      - path: "/fineract-provider/api/v1/savingsaccounts/{accountId}?command=calculateInterest&command=postInterest"
        method: POST
        description: "Calculate and post interest on savings"
        auth_required: true
        source: external_api
        mcp_tool: "calc_post_interest"

      # ── Loans ──
      - path: "/fineract-provider/api/v1/loans"
        method: POST
        description: "Create loan application (individual member loan)"
        auth_required: true
        source: external_api
        mcp_tool: "create_new_loan"

      - path: "/fineract-provider/api/v1/loans/{loanId}"
        method: GET
        description: "Get loan details with repayment schedule"
        auth_required: true
        source: external_api
        mcp_tool: "get_loan"

      - path: "/fineract-provider/api/v1/loans/{loanId}?command=approve&command=disburse"
        method: POST
        description: "Approve and disburse a pending loan"
        auth_required: true
        source: external_api
        mcp_tool: "approve_disburse_loan"

      - path: "/fineract-provider/api/v1/loans/{loanId}/transactions?command=repayment"
        method: POST
        description: "Record loan repayment"
        auth_required: true
        source: external_api
        mcp_tool: "make_repayment"

      - path: "/fineract-provider/api/v1/loans/{loanId}?command=reject"
        method: POST
        description: "Reject a loan application"
        auth_required: true
        source: external_api
        mcp_tool: "reject_loan"

      - path: "/fineract-provider/api/v1/loans/{loanId}?command=undoapproval"
        method: POST
        description: "Undo loan approval"
        auth_required: true
        source: external_api
        mcp_tool: "undo_approval"

      - path: "/fineract-provider/api/v1/loans/{loanId}?command=undodisbursal"
        method: POST
        description: "Undo loan disbursal"
        auth_required: true
        source: external_api
        mcp_tool: "undo_disbursal"

      - path: "/fineract-provider/api/v1/loans/{loanId}/transactions?command=waiveInterest"
        method: POST
        description: "Waive interest on a loan"
        auth_required: true
        source: external_api
        mcp_tool: "waive_loan_interest"

      - path: "/fineract-provider/api/v1/loans/{loanId}/charges"
        method: POST
        description: "Apply fee/charge to a loan (late penalty)"
        auth_required: true
        source: external_api
        mcp_tool: "apply_loan_fee"

      - path: "/fineract-provider/api/v1/loans/{loanId}/schedule"
        method: GET
        description: "Get repayment schedule for a loan"
        auth_required: true
        source: external_api
        mcp_tool: "get_repayment_sched"

      - path: "/fineract-provider/api/v1/loans/template?clientId={id}"
        method: GET
        description: "Get loan application template with product defaults and charge options"
        auth_required: true
        source: external_api
        mcp_tool: "get_loan_app_template"

      - path: "/fineract-provider/api/v1/clients/{clientId}/loans?status=overdue"
        method: GET
        description: "Get overdue loans for a client"
        auth_required: true
        source: external_api
        mcp_tool: "get_overdue_loans_for_client"

      - path: "/fineract-provider/api/v1/rescheduleloans"
        method: POST
        description: "Reschedule a loan application"
        auth_required: true
        source: external_api
        mcp_tool: "reschedule_loan_app"

      # ── Group Loans ──
      - path: "/fineract-provider/api/v1/loans (group context)"
        method: POST
        description: "Create group loan application for a lending group"
        auth_required: true
        source: external_api
        mcp_tool: "create_group_loan_app"

      # ── Charges (Fees & Fines) ──
      - path: "/fineract-provider/api/v1/charges"
        method: POST
        description: "Create charge definition (appliesTo: 1=Loan, 2=Savings, 3=Client; calcType: 1=Flat, 2=%)"
        auth_required: true
        source: external_api
        mcp_tool: "create_new_charge"

      - path: "/fineract-provider/api/v1/charges/{chargeId}"
        method: GET
        description: "Get charge details"
        auth_required: true
        source: external_api
        mcp_tool: "get_charge"

      - path: "/fineract-provider/api/v1/charges"
        method: GET
        description: "List all charge definitions"
        auth_required: true
        source: external_api
        mcp_tool: "list_all_charges"

      - path: "/fineract-provider/api/v1/charges/{chargeId}"
        method: PUT
        description: "Update an existing charge definition"
        auth_required: true
        source: external_api
        mcp_tool: "update_existing_charge"

      - path: "/fineract-provider/api/v1/clients/{clientId}/charges"
        method: GET
        description: "List charges applied to a client"
        auth_required: true
        source: external_api
        mcp_tool: "list_client_charges"

      # ── Data Tables — CUSTOM API DESIGN ──
      - path: "/fineract-provider/api/v1/datatables"
        method: POST
        description: "CREATE a new data table (= design a custom API endpoint). Attach to m_client/m_group/m_loan/m_savings_account/m_office/m_center. Define columns with types: string, int, decimal, boolean, date, datetime, text, dropdown."
        auth_required: true
        source: external_api
        mcp_tool: "create_datatable"

