# PHASE 13 — §technical_decisions
# ═══════════════════════════════════════════════════════════════════
technical_decisions:
  _tag: "§technical_decisions"
  _status: approved
  _quality_score: 94
  _last_updated: "2026-05-04T06:45:00Z"
  _enrichment_count: 2
  _source: "wizard+vsla-best-practices"
  content:
    base_project: "kmp-project-template (mifos-x workspace) — this project is built on top of the template; its core-base/* modules (store, network, common, designsystem, ui) are inherited as the foundation. We extend, not fork."
    architecture: "Clean Architecture + MVI/UDF — inherited from kmp-project-template"
    di_framework: "Koin"
    state_management: "compose-state (ScreenState sealed interface from core-base/store)"
    navigation: "voyager"
    backend_provider: "mifos-fineract"
    backend:
      provider: "fineract"
      mcp_server: "mifos"
      bridge: "auto"
      capabilities: "../../mcp-mifosx/server-layer/MCP_CAPABILITIES.yaml"
      approval_gate: true
    platform_targets:
      - "android"
      - "ios"
      - "desktop"
    api_extension_pattern: "Fineract Data Tables — design custom REST endpoints via create_datatable API, attached to core entities (m_center, m_client, m_loan). Full CRUD. No backend code needed."
    offline_strategy: "Use core-base/store from kmp-project-template — Store5-based OOTB offline-first stack. StoreFactory.createMutableStore wires Fetcher (Ktor → Fineract REST) + SourceOfTruth (SQLDelight) + Bookkeeper (write-back queue) + Updater + DefaultValidator (TTL). UI consumes ScreenDataStream which combines StoreData + NetworkStatus into pre-decided ScreenState (Loading / Empty / NoNetwork(captive_portal) / Error / Content). DecisionEngine is pure-function, exhaustively unit-tested. No bespoke queue, backoff, or conflict-resolution UI to design — already implemented and tested in core-base/store."
    sync_architecture: "Three sync tiers per entity, configured at StoreFactory call-site via DefaultValidator TTL + Bookkeeper scope: (1) Group-scoped (Loan, Member, Period, Transaction, MeetingRecord, Attendance) — full sync on group-switch + delta-on-Bookkeeper.write; (2) User-scoped (UserPrefs, Notifications, OutboxMutations) — sync on auth + on-write; (3) On-demand reports (runreports/*) — separate read-only Store with longer TTL via DefaultValidator, NOT participating in mutation Bookkeeper. Fineract Batch API (/api/v1/batches) is used by the outbox flusher for efficient multi-mutation drains."
    mutation_idempotency: "All mutations carry a client-generated UUID (idempotency-key header to Fineract where supported, or stored in custom dt_outbox_log datatable for replay-detection on the server side). Allows safe retry of pending Bookkeeper entries on reconnect without duplicate side effects."
    api_codegen: "Fineract OpenAPI spec → Ktor client + Kotlin DTOs via openapi-generator (kotlin-multiplatform). No raw URL strings in domain code; all endpoints reachable through generated typed client. Avoids the common anti-pattern of stringly-typed mutations (raw URLs or hand-rolled GraphQL strings) scattered across feature modules."
    mcp_integration: "Mifos MCP Server (65 tools) provides programmatic access to all Fineract operations including data table schema design, enabling CI/CD automation and testing."
    unified_identity_architecture: "ONE unified login/signup and ONE Composable navigation graph for everyone — there is no client-type split and no separate admin vs end-user auth path. All users self-sign-up through the companion API (mcp-mifosx). After login, capabilities are resolved per group from dt_member_role: the same navigation graph adapts its available actions to the signed-in user's role within the currently-selected group (organizer vs member). A user with no group lands on a create/join empty state; an organizer lands on their organizer dashboard; a member lands on their member view — all inside the single shared graph, driven by role resolution, not by a locally-stored client type."
    rbac_strategy: "Single navigation graph; per-(member, group) role resolved at login from the companion API (mcp-mifosx) and stored in the dt_member_role data table. Roles: organizer (primary — self-signs-up, creates and runs the group as its loan officer) / treasurer / chairperson / secretary / member, plus an optional field-officer supervisory tier. There is NO client-type-vs-role two-tier split — role alone (per group) determines write permissions. Enforced at ViewModel level — UI actions shown/hidden/disabled based on the resolved per-group role."
    dual_savings_model: "Two savings types per member: (1) Group-Linked — mandatory, min/max enforced per meeting, tied to group cycle. (2) Individual — voluntary, flexible deposits/withdrawals. Both tracked as separate Fineract Savings Accounts with different product IDs."
    corpus_tracking: "Real-time fund balance per group. Corpus = sum(inflows) - sum(outflows). Stored in dt_group_corpus on m_center. Mobile app maintains local running balance during meetings. Cash outflows blocked when corpus would go negative."
    companion_api:
      decision: "Companion API backend = extended mcp-mifosx (Go), Fineract-only"
      rationale: "No Supabase, no standalone DDD service. All self-signup + group-orchestration + datatable-CRUD is implemented as thin declarative BaseToolDef structs in the existing mcp-mifosx Go server (go/tools/companion_*.go + go/tools/datatables.go). Two build tiers: TIER-1 wraps existing Fineract endpoints (9 tools: COMP-AUTH-001..003, COMP-GRP-001..005, COMP-CAL-001..003); TIER-2 generic datatable CRUD (7 tools: COMP-DT-001..005, COMP-DIST-001/002). Auth-model change is the one structural lift (P0): per-call user credentials instead of stateless single-env-credential."
      build_items:
        - "P0 auth-model change: per-call user credential + service-credential group orchestration + organizer-vs-member authz"
        - "TIER-1: 9 thin Fineract-wrap tools in go/tools/companion_auth.go + companion_groups.go + companion_calendar.go"
        - "TIER-2: 7 generic datatable-CRUD tools in go/tools/datatables.go (COMP-DT-001..005, COMP-DIST-001/002)"
        - "Provision 6 companion datatables at deploy (dt_group_type_config, dt_companion_invitations, dt_rosca_rotation, dt_rosca_auction, dt_vsla_cycle, dt_welfare_fund)"
        - "Deploy self-service-enabled Fineract instance (sandbox.mifos.community does NOT have /self/* enabled)"
      deploy_gate: "Until companion API §1–§3 land: features compile + build-green but device-test returns pending-device-verify (not a failure — the honest external gate). matrix-green is gated on this spec being executed."
      spec_ref: "server-layer/COMPANION_API_BUILD_DEPLOY.md"
      contract_ref: "server-layer/API_CONTRACT.yaml (companion section: COMP-AUTH-001..003, COMP-GRP-001..005, COMP-CAL-001..003, COMP-DT-001..005, COMP-DIST-001/002)"

