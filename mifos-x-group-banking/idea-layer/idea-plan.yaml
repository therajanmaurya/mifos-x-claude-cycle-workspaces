          strategy: "companion_api"
          detail: "Self-registration bridge (COMP-AUTH-001) + per-user login returning groups+roles (COMP-AUTH-002) + profile/me (COMP-AUTH-003). Companion API authenticates via Fineract self-service or staff auth depending on account type; returns a session token + per-group capability surface."
