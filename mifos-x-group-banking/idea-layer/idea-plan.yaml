        label_small:     { size_sp: 11, line_height_sp: 16, tracking_sp: 0.5,   weight: 500 }

    # Spacing scale (dp)
    spacing_scale:
      xxs: 2
      xs: 4
      sm: 8
      md: 12
      lg: 16
      xl: 24
      xxl: 32
      "3xl": 48
      "4xl": 64
    spacing_preference: "comfortable"
    density: "comfortable"

    # Shape / corner radii (dp)
    shape:
      none: 0
      extra_small: 4
      small: 8
      medium: 12
      large: 16
      extra_large: 28
      full: 9999

    # Elevation (M3) — dp + tonal overlay alpha
    elevation:
      level_0: { dp: 0, tonal_alpha: 0.00 }
      level_1: { dp: 1, tonal_alpha: 0.05 }
      level_2: { dp: 3, tonal_alpha: 0.08 }
      level_3: { dp: 6, tonal_alpha: 0.11 }
      level_4: { dp: 8, tonal_alpha: 0.12 }
      level_5: { dp: 12, tonal_alpha: 0.14 }

    # Motion tokens — durations (ms) + easing curves
    motion:
      duration:
        short_1: 50
        short_2: 100
        short_3: 150
        short_4: 200
        medium_1: 250
        medium_2: 300
        medium_3: 350
        medium_4: 400
        long_1: 450
        long_2: 500
      easing:
        standard: "cubic-bezier(0.2, 0.0, 0, 1.0)"
        emphasized: "cubic-bezier(0.2, 0.0, 0, 1.0)"
        decelerated: "cubic-bezier(0.0, 0.0, 0, 1.0)"
        accelerated: "cubic-bezier(0.3, 0.0, 1.0, 1.0)"

    # Window-size breakpoints (M3 layout windows, dp)
    breakpoints:
      compact: { min: 0,   max: 599  }   # phones
      medium:  { min: 600, max: 839  }   # foldables / small tablets
      expanded: { min: 840, max: 9999 }  # tablets, desktop

    # Touch & accessibility
    accessibility:
      min_touch_target_dp: 48
      contrast_normal: 4.5
      contrast_large: 3.0
      focus_ring_dp: 3

