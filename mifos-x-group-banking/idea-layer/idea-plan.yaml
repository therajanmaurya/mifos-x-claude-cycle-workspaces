    # ─────────────────────────────────────────────────────────────
    # COMPANION API — abstract contract (evolve 2026-07-17)
    # ─────────────────────────────────────────────────────────────
    # The Companion API is the ABSTRACT CONTRACT the app consumes.
    # Concrete backend = extended mcp-mifosx (Go), built later, fully
    # compatible with this spec. See ARCHITECTURE.md §3.
    #
    # IMPORTANT: backend is Fineract-only (no Supabase, no standalone
    # DDD service). The companion API is a thin extension of mcp-mifosx
    # that adds: per-user auth + self-registration bridge, group
    # orchestration tools, datatable CRUD, calendar/collection-sheet,
    # and execute endpoints for client-computed money moves.
    #
    # All /companion/* paths are DEFERRED — the backend is designed later.
    # Feature priority: P0 = must-have for self-signup; P1 = core ops.
    # ─────────────────────────────────────────────────────────────

    companion_api:
      _contract_status: deferred
      _backend: "extended mcp-mifosx (Go) — built later; see ARCHITECTURE.md §3"
      _fineract_only: true
      _supabase: false
      _note: "The app talks ONLY to the companion API — never directly to Fineract. The companion API executes Fineract calls with a service credential on behalf of the user."

      contracts:

        # ── Self-registration + per-user auth (P0) ──

        - id: "COMP-AUTH-001"
          path: "/companion/auth/self-register"
          method: POST
          description: "Self-registration bridge: creates a Fineract client (+ self-service user) from the submitted name, email/phone, password. Returns a user token and an empty group list. No back-office officer required."
          auth_required: false
          feature_refs: ["unified-auth", "self-signup-organizer"]
          fineract_delegation: "POST /self/registration + POST /self/registration/user → creates Fineract client + self-service account"
          priority: P0

        - id: "COMP-AUTH-002"
          path: "/companion/auth/login"
          method: POST
          description: "Per-user authentication. Returns a session token + the user's group memberships with their role in each group. The app resolves per-group capability surfaces from this payload (FR-014)."
          auth_required: false
          feature_refs: ["unified-auth"]
          fineract_delegation: "Fineract self-service auth or staff auth (selected by companion API based on account type)"
          priority: P0

        - id: "COMP-AUTH-003"
          path: "/companion/auth/me"
          method: GET
          description: "Fetch the authenticated user's profile + all group memberships + role per group. Used on app launch (post-login cache refresh) and after joining a group."
          auth_required: true
          feature_refs: ["unified-auth"]
          fineract_delegation: "GET /self/clients (own profile) + GET /groups?clientId={id} + dt_member_role lookup per group"
          priority: P0

        # ── Group orchestration (P0) ──
        # The app cannot create/activate Fineract groups directly with
        # self-service credentials; the companion API uses a service credential.

        - id: "COMP-GRP-001"
          path: "/companion/groups/create"
          method: POST
          description: "Create a Fineract group (Center entity) on behalf of the organizer. Provisions the group_type_config datatable row. Returns the new group id + a bootstrap GroupTypeConfig."
          auth_required: true
          feature_refs: ["self-signup-organizer", "group-management", "group-type-config"]
          fineract_delegation: "POST /centers (create center) + POST /datatables/group_type_config/{centerId} (store GroupTypeConfig)"
          priority: P0

        - id: "COMP-GRP-002"
          path: "/companion/groups/{groupId}/activate"
          method: POST
          description: "Activate a pending Fineract group (Center). Called automatically after creation."
          auth_required: true
          feature_refs: ["group-management"]
          fineract_delegation: "POST /centers/{centerId}?command=activate"
          priority: P0

        - id: "COMP-GRP-003"
          path: "/companion/groups/{groupId}/associate-clients"
          method: POST
          description: "Add one or more Fineract clients (members) to a group. Used when an invitee accepts an invite and is associated to the inviting group."
          auth_required: true
          feature_refs: ["member-invitations", "member-onboarding"]
          fineract_delegation: "POST /groups/{groupId}?command=associateClients"
          priority: P0

        - id: "COMP-GRP-004"
          path: "/companion/groups/{groupId}/assign-role"
          method: POST
          description: "Assign a Fineract group role (organizer/treasurer/chairperson/secretary) to a client within the group. Writes to dt_member_role datatable."
          auth_required: true
          feature_refs: ["member-onboarding", "group-type-config"]
          fineract_delegation: "POST /groups/{groupId}/roles (Fineract group role) + POST /datatables/dt_member_role/{clientId}"
          priority: P0

        - id: "COMP-GRP-005"
          path: "/companion/groups/{groupId}/assign-staff"
          method: POST
          description: "Assign a Fineract staff member (optional supervisory tier field officer) to a group."
          auth_required: true
          feature_refs: ["field-officer-view"]
          fineract_delegation: "POST /groups/{groupId}?command=assignStaff"
          priority: P1

        # ── Datatable CRUD (P0 — generic, one-time build) ──
        # Thin generic tools that provision and manage all group-type datatables.

        - id: "COMP-DT-001"
          path: "/companion/datatables/register"
          method: POST
          description: "Register (provision) a new datatable schema attached to a Fineract entity. Used at app setup to create all domain-extension tables. One-time setup per Fineract instance."
          auth_required: true
          feature_refs: ["group-type-config"]
          fineract_delegation: "POST /datatables (create datatable schema)"
          priority: P0

        - id: "COMP-DT-002"
          path: "/companion/datatables/{tableName}/{entityId}"
          method: POST
          description: "Create a row in a datatable for a given entity. Generic — used for group_type_config, rosca_rotation, rosca_auction, vsla_cycle, welfare_fund, invitations, and all other domain tables."
          auth_required: true
          feature_refs: ["group-type-config", "pluggable-distribution", "member-invitations"]
          fineract_delegation: "POST /datatables/{tableName}/{entityId}"
          priority: P0

        - id: "COMP-DT-003"
          path: "/companion/datatables/{tableName}/{entityId}"
          method: GET
          description: "Read all datatable rows for an entity. Generic — covers all domain-extension tables."
          auth_required: true
          feature_refs: ["group-type-config", "pluggable-distribution", "member-invitations"]
          fineract_delegation: "GET /datatables/{tableName}/{entityId}"
          priority: P0

        - id: "COMP-DT-004"
          path: "/companion/datatables/{tableName}/{entityId}/{rowId}"
          method: PUT
          description: "Update a datatable row. Generic."
          auth_required: true
          feature_refs: ["group-type-config", "pluggable-distribution"]
          fineract_delegation: "PUT /datatables/{tableName}/{entityId}/{rowId}"
          priority: P0

        - id: "COMP-DT-005"
          path: "/companion/datatables/{tableName}/{entityId}/{rowId}"
          method: DELETE
          description: "Delete a datatable row. Generic."
          auth_required: true
          feature_refs: ["group-type-config"]
          fineract_delegation: "DELETE /datatables/{tableName}/{entityId}/{rowId}"
          priority: P0

        # ── Calendar + collection-sheet (P1) ──

        - id: "COMP-CAL-001"
          path: "/companion/groups/{groupId}/calendar"
          method: POST
          description: "Create a meeting calendar entry for a group (schedule). Wraps Fineract calendar API."
          auth_required: true
          feature_refs: ["meeting-lifecycle"]
          fineract_delegation: "POST /groups/{groupId}/calendars"
          priority: P1

        - id: "COMP-CAL-002"
          path: "/companion/groups/{groupId}/collection-sheet"
          method: GET
          description: "Fetch the collection sheet for a scheduled meeting — lists expected savings and repayments per client."
          auth_required: true
          feature_refs: ["meeting-lifecycle", "savings-collection"]
          fineract_delegation: "GET /groups/{groupId}/clientsAttendance (collection-sheet)"
          priority: P1

        - id: "COMP-CAL-003"
          path: "/companion/groups/{groupId}/collection-sheet/submit"
          method: POST
          description: "Submit a completed collection sheet — saves attendance + savings collected + repayments for a meeting."
          auth_required: true
          feature_refs: ["meeting-lifecycle", "savings-collection"]
          fineract_delegation: "POST /groups/{groupId}/clientsAttendance (submit collection-sheet)"
          priority: P1

        # ── Distribution execution (P1) ──
        # Client-side computes the distribution; the companion API executes
        # the resulting Fineract money movements (server re-validates).

        - id: "COMP-DIST-001"
          path: "/companion/groups/{groupId}/distribution/execute"
          method: POST
          description: "Execute a client-computed distribution (share-out or ROSCA rotation payout). Accepts the per-member payout list; companion API executes GSIM withdrawal / journal entry / transfer in Fineract with idempotency keys. Server re-validates amounts against live balances."
          auth_required: true
          feature_refs: ["pluggable-distribution", "share-out"]
          fineract_delegation: "POST /savingsaccounts/{accountId}/transactions?command=withdrawal (per member) OR POST /journalentries (transfer); idempotency via externalId"
          priority: P1

        - id: "COMP-DIST-002"
          path: "/companion/groups/{groupId}/rosca-rotation/next"
          method: POST
          description: "Advance the ROSCA rotation to the next recipient. Updates the rosca_rotation datatable row, returns the next recipient and pot amount for client-side display before execution."
          auth_required: true
          feature_refs: ["pluggable-distribution"]
          fineract_delegation: "PUT /datatables/rosca_rotation/{groupId} (advance turn) + validation of pot against GSIM savings balance"
          priority: P1

      # Seeded datatables provisioned by the companion API (all via COMP-DT-001 schema registration)
      companion_datatables:
        - name: "group_type_config"
          apptable: "m_group"
          description: "GroupTypeConfig row per group — the 2-axis config (pool_model, contribution_model) + all payout/lending/social-fund/cycle/governance parameters. Schema: ARCHITECTURE.md §4."
          feature_refs: ["group-type-config"]
          priority: P0

        - name: "rosca_rotation"
          apptable: "m_group"
          description: "ROSCA rotation state — ordered recipient list, current turn index, payout per round, payout_order_method."
          feature_refs: ["pluggable-distribution"]
          priority: P0

        - name: "rosca_auction"
          apptable: "m_group"
          description: "Chit/hui auction bids — per-round bids, winning bid, discount allocated."
          feature_refs: ["pluggable-distribution"]
          priority: P1

        - name: "vsla_cycle"
          apptable: "m_group"
          description: "VSLA/SILC cycle state — cycle number, total shares issued, share value, share-out formula override."
          feature_refs: ["pluggable-distribution", "share-out"]
          priority: P0

        - name: "welfare_fund"
          apptable: "m_group"
          description: "Welfare/burial fund balance and disbursement log (for welfare_only_mode groups or groups with social_fund_enabled)."
          feature_refs: ["social-fund"]
          priority: P1

        - name: "invitations"
          apptable: "m_group"
          description: "Invite tokens — token, group_id, inviter_client_id, invited_email/phone, role_to_assign, expires_at, accepted_at. Used by member-invitations feature."
          feature_refs: ["member-invitations", "unified-auth"]
          priority: P0

    # ─────────────────────────────────────────────────────────────
    # CUSTOM DATA TABLES — CommonPurse Domain Extensions
    # ─────────────────────────────────────────────────────────────
    # These tables are DESIGNED via the Data Tables API at app setup.
    # Each table = a custom REST endpoint with full CRUD.
    # Created programmatically via create_datatable MCP tool.
    # ─────────────────────────────────────────────────────────────

    custom_data_tables:
      - table_name: "dt_group_config"
        apptable_name: "m_center"
        feature_ref: "group-management"
        description: "Group cycle rules and policies — the core configuration that drives savings validation, loan eligibility, fine calculation, and cycle lifecycle"
        columns:
          - { name: "cycle_number", type: int, mandatory: true }
          - { name: "cycle_length_months", type: int, mandatory: true }
          - { name: "cycle_start_date", type: date, mandatory: true }
          - { name: "cycle_end_date", type: date, mandatory: true }
          - { name: "meeting_frequency", type: string, length: 20, mandatory: true }
          - { name: "contribution_min", type: decimal, mandatory: true }
          - { name: "contribution_max", type: decimal, mandatory: true }
          - { name: "loan_multiplier", type: decimal, mandatory: true }
          - { name: "interest_rate_per_month", type: decimal, mandatory: true }
          - { name: "max_loan_duration_weeks", type: int, mandatory: false }
          - { name: "fine_late_attendance", type: decimal, mandatory: false }
          - { name: "fine_missed_meeting", type: decimal, mandatory: false }
          - { name: "fine_late_repayment", type: decimal, mandatory: false }
          - { name: "fine_min_savings_not_met", type: decimal, mandatory: false }
          - { name: "social_fund_per_meeting", type: decimal, mandatory: false }
          - { name: "cycle_status", type: string, length: 20, mandatory: true }

      - table_name: "dt_meeting_record"
        apptable_name: "m_center"
        feature_ref: "meeting-lifecycle"
        description: "Per-meeting record — attendance, totals, decisions. One row per meeting per group."
        columns:
          - { name: "meeting_number", type: int, mandatory: true }
          - { name: "meeting_date", type: date, mandatory: true }
          - { name: "status", type: string, length: 20, mandatory: true }
          - { name: "members_present", type: int, mandatory: true }
          - { name: "members_absent", type: int, mandatory: true }
          - { name: "total_savings_collected", type: decimal, mandatory: false }
          - { name: "total_fines_collected", type: decimal, mandatory: false }
          - { name: "loans_approved_count", type: int, mandatory: false }
          - { name: "loans_approved_amount", type: decimal, mandatory: false }
          - { name: "notes", type: text, mandatory: false }

      - table_name: "dt_meeting_attendance"
        apptable_name: "m_client"
        feature_ref: "meeting-lifecycle"
        description: "Per-member per-meeting attendance record — tracks presence, lateness, fines applied"
        columns:
          - { name: "meeting_number", type: int, mandatory: true }
          - { name: "meeting_date", type: date, mandatory: true }
          - { name: "present", type: boolean, mandatory: true }
          - { name: "late", type: boolean, mandatory: false }
          - { name: "fine_applied", type: decimal, mandatory: false }
          - { name: "fine_reason", type: string, length: 50, mandatory: false }

      - table_name: "dt_member_role"
        apptable_name: "m_client"
        feature_ref: "member-onboarding"
        description: "Member role within group — chairperson, treasurer, secretary, member. Drives RBAC in the app."
        columns:
          - { name: "role", type: string, length: 20, mandatory: true }
          - { name: "assigned_date", type: date, mandatory: true }
          - { name: "assigned_by", type: string, length: 100, mandatory: false }

      - table_name: "dt_share_out"
        apptable_name: "m_center"
        feature_ref: "share-out"
        description: "End-of-cycle share-out record — per-group per-cycle, captures the distribution calculation and execution"
        columns:
          - { name: "cycle_number", type: int, mandatory: true }
          - { name: "share_out_date", type: date, mandatory: true }
          - { name: "total_pool", type: decimal, mandatory: true }
          - { name: "total_interest_earned", type: decimal, mandatory: true }
          - { name: "total_fines_collected", type: decimal, mandatory: true }
          - { name: "members_count", type: int, mandatory: true }
          - { name: "distribution_json", type: text, mandatory: true }
          - { name: "status", type: string, length: 20, mandatory: true }

      - table_name: "dt_social_fund"
        apptable_name: "m_center"
        feature_ref: "social-fund"
        description: "Social/emergency fund tracker per group — separate from savings pool, with its own balance and disbursement history"
        columns:
          - { name: "fund_balance", type: decimal, mandatory: true }
          - { name: "contribution_per_meeting", type: decimal, mandatory: true }
          - { name: "last_collection_date", type: date, mandatory: false }
          - { name: "total_disbursed", type: decimal, mandatory: false }
          - { name: "pending_requests", type: int, mandatory: false }

      - table_name: "dt_loan_vote"
        apptable_name: "m_loan"
        feature_ref: "loan-management"
        description: "Loan approval voting record — tracks who voted, approval/rejection, meeting context"
        columns:
          - { name: "meeting_number", type: int, mandatory: true }
          - { name: "votes_for", type: int, mandatory: true }
          - { name: "votes_against", type: int, mandatory: true }
          - { name: "approved", type: boolean, mandatory: true }
          - { name: "approved_by_chairperson", type: boolean, mandatory: true }
          - { name: "notes", type: text, mandatory: false }

      - table_name: "dt_sync_metadata"
        apptable_name: "m_center"
        feature_ref: "offline-sync"
        description: "Sync state tracker per group — last sync timestamp, pending count, conflict status. Read by field officer dashboard."
        columns:
          - { name: "last_sync_at", type: datetime, mandatory: false }
          - { name: "pending_operations", type: int, mandatory: false }
          - { name: "last_sync_status", type: string, length: 20, mandatory: false }
          - { name: "conflict_count", type: int, mandatory: false }
          - { name: "device_id", type: string, length: 50, mandatory: false }

      - table_name: "dt_loan_request"
        apptable_name: "m_client"
        feature_ref: "end-user-dashboard"
        description: "End-user loan requests submitted from personal dashboard. Admin reviews during meeting. Bridges self-service → admin workflow."
        columns:
          - { name: "requested_amount", type: decimal, mandatory: true }
          - { name: "purpose", type: text, mandatory: true }
          - { name: "desired_duration_weeks", type: int, mandatory: true }
          - { name: "eligibility_amount", type: decimal, mandatory: false }
          - { name: "request_date", type: date, mandatory: true }
          - { name: "status", type: string, length: 20, mandatory: true }
          - { name: "reviewed_at_meeting", type: int, mandatory: false }
          - { name: "admin_notes", type: text, mandatory: false }

      # ── DATA TABLE FROM COMMUNITY RESEARCH (CR-003) — professionally curated ──

      - table_name: "dt_group_corpus"
        apptable_name: "m_center"
        feature_ref: "corpus-tracking"
        source_ref: "CR-003"
        description: "Running fund/corpus balance for the group. Updated on every inflow/outflow. Used to block excess cash outflows."
        columns:
          - { name: "current_balance", type: decimal, mandatory: true }
          - { name: "total_inflows", type: decimal, mandatory: true }
          - { name: "total_outflows", type: decimal, mandatory: true }
          - { name: "last_updated_at", type: datetime, mandatory: true }
          - { name: "last_meeting_opening_balance", type: decimal, mandatory: false }
          - { name: "last_meeting_closing_balance", type: decimal, mandatory: false }

    # ─────────────────────────────────────────────────────────────
    # API GAP ANALYSIS (post-ingest)
    # ─────────────────────────────────────────────────────────────
    # With Data Tables as custom API design, coverage jumps to 100%.
    # Every feature gap is resolvable via:
    #   - Native Fineract endpoints (centers, clients, savings, loans)
    #   - Custom Data Tables (meeting records, roles, share-out, votes)
    #   - Fineract Charges API (fines as savings/loan charges)
    #   - Client-only logic (share-out calc, language, offline queue)
    # ─────────────────────────────────────────────────────────────

    api_gap_analysis:
      total_features: 19
      api_covered: 19
      gaps: []
      coverage_percent: 100.0
      _updated: "2026-07-17 — global self-signup pivot: added pivot features (unified-auth, self-signup-organizer, group-type-config, member-invitations, pluggable-distribution); REMOVED the deprecated authentication feature + client-type-selector/login screens (single login-signup replaces them). Backend behavior via companion_api contracts."
      resolution_summary:
        - feature: "group-management"
          strategy: "native + data_table + companion_api"
